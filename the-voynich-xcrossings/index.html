<script id="story-data" type="application/json">{"title": "The Voynich XCrossings", "edition": "第一部・第二部・第3稿", "version": "c1ba2af7557bef9d", "markdown": "# The Voynich XCrossings\n\n## 第一部　閉じられる道\n\n### 序　そこにいた人\n\n「戻らないで！」\n\n声が届いたときには、ラーナの右足は浮いていた。\n\n水が膝の裏を払い、身体が横を向いた。手すりに掛けた腕だけが残った。肩の奥で、何かが伸びた。\n\n来た道へ戻れば階段がある。階段を上がれば、電話がある。\n\nその道から、次の水が来た。\n\n泡の下に、折れた木箱が見えた。壁に当たり、向きを変えずに近づいてくる。\n\nラーナは身を縮めた。\n\n木箱が手すりへぶつかった。\n\n掌に振動が走る。壁に留められた金具が一つ、石ごと抜けた。\n\n「鞄を離して！」\n\n向こう岸の青年が叫んだ。\n\n記録が入っている。\n\nそう思った間に、鞄が水を受けた。紐が首の横へ食い込んだ。\n\nラーナは肩を抜いた。\n\n鞄が消えた。\n\n引かれる力が軽くなった。脚が壁に当たり、靴底が何かを擦った。足場だ。踏もうとすると、また水に剥がされた。\n\n「左の管の上。四角い穴がある！」\n\n青年は斜め上から指していた。\n\n彼の側には高い足場がある。その角度から、ラーナの背後が見えるらしい。\n\n顔を上げた。\n\n管の陰に、黒い四角があった。下へ鉄の段が続いている。一番下は水の中だった。\n\n手すりから、腕一本分。\n\n遠かった。\n\n「横棒に足を。そこの留め具は、まだ壁についてる」\n\nラーナは水の中で膝を曲げた。靴の先が横棒を探り当てた。\n\n踏む。\n\n腰が上がる。\n\n片手を離した。\n\n身体が流れへ開き、息が止まった。\n\n指先が鉄の段に掛かった。\n\n引いた。動かなかった。\n\n両手を移し、肘を曲げた。膝が石へぶつかったが、今度は足を載せる場所があった。\n\n後ろで金属が裂けた。\n\nラーナは上った。\n\n開口部の蓋は、拳一つ分しか動かなかった。\n\n横へ引く。止まる。\n\nもう一度引く。同じところで止まる。\n\n「開かない？」\n\n彼女は答える代わりに、蓋の溝へ指を入れた。\n\n砕けた石が詰まっていた。\n\n腰の工具を抜く。刃を差し込み、屑を落とす。指が震えて、金属が石に何度も触れた。\n\n青年が何か言いかけた。\n\nだが、声は続かなかった。\n\n待っている。\n\nラーナは息を吐き、もう一度差し込んだ。\n\n蓋が滑った。\n\n肩を入れる。腹を縁へ載せる。脚を引き込む。\n\n最後に靴が水から抜けた。\n\n低い廊下の床へ、這ったまま進んだ。\n\n掌の下に、動かない石があった。\n\nラーナはそこへ額を近づけ、息をした。\n\n＊\n\n水路の向こうにも、同じ高さの廊下があった。\n\n青年が、壁の隙間からこちらを見ている。\n\n「聞こえる？」\n\nラーナは頷いた。\n\n頷いただけでは伝わらないと思い、手を上げた。\n\n「そっち、出口は？」\n\n廊下の奥に、小さな灯りが見えた。\n\n「上の連絡路へ、行けると思う」\n\n「じゃあ、下へ戻らなくていい」\n\n言われて初めて、戻らなくてよいのだと分かった。\n\n膝が痛んだ。布の下に血が滲んでいた。\n\n彼女は片脚ずつ動かした。\n\n「歩ける？」\n\n「歩く。あなたは？」\n\n「こっちは大丈夫」\n\nラーナは壁へもたれた。\n\n青年の後ろには、白っぽい石の面があった。足元に狭い通路。その先は行き止まりに見える。\n\n「名前」\n\n彼が顔を上げた。\n\n「聞いてなかった」\n\n「リツ」\n\n彼は、自分を指した。\n\n「君は？」\n\n「ラーナ」\n\n＊\n\n部屋の電話が鳴った。\n\n男は受話器を取り、机の映像を見た。\n\n水路と、その上に離れて座る二人。\n\n『ミーシャ。二人とも水から上がりました。接触は続いています』\n\nサングラスの奥で、男の目が動いた。\n\n「接続元は」\n\n『まだ確認中です』\n\n「切れ」\n\n＊\n\n「ラーナ。じゃあ、上で――」\n\n青年の声がなくなった。\n\n姿も、なくなった。\n\nラーナは動かなかった。\n\n目をそらしていなかった。\n\n彼が座っていた場所に、白い壁があった。\n\n「リツ？」\n\n返事はない。\n\n人が横へ退いたのなら、狭い通路を通るはずだった。下へ落ちたのなら、水に当たる音がするはずだった。\n\nどちらもなかった。\n\n足元では、水が流れ続けている。\n\n＊\n\n男の机で、映像が閉じた。\n\nその下から、古い本の画像が現れた。\n\n黄ばんだページに、緑の葉と、絡み合う根が描かれていた。絵を避けるように、丸い輪と背の高い線が行を作っている。\n\n画面の端に、資料名があった。\n\n《Voynich Manuscript — Beinecke MS 408》\n\n---\n\n# The Voynich XCrossings\n\n*タイトル*\n\n### 一　希望欄\n\n*三時間前*\n\n「その区域には、今朝から入れません」\n\n窓口の担当者は、ラーナの勤務証を返した。\n\n「そこで働いてるんですけど」\n\n「所属先から、変更の申請をお願いします」\n\n「仕事を変えたいんじゃありません。昨日の点検が終わってないんです」\n\n担当者は机の画面を見た。\n\n同じ返事が来る前に、ラーナは記録の控えを置いた。\n\n「閉じるなら、その前に調べないと。水の量が合ってない」\n\n隣から母が別の紙を差し出した。\n\n「移転先の希望は、ここでいいんですね」\n\n「まだ話してる」\n\n「私の話もあるの」\n\n担当者の手が、母の用紙へ移った。\n\nその上端に、白い十字を抜いた赤い印がある。四本の腕の先が、それぞれ小さく割れていた。\n\n母は同居者の欄へ指を置いた。\n\n「夫は、もう亡くなっていますけど」\n\n「その欄は空けてください」\n\n母の指が、一つの欄を飛ばした。\n\nラーナは控えを引き戻した。\n\n「点検の許可を出す人の名前を教えてください」\n\n「管理責任者です」\n\n「その人の名前です」\n\nようやく、担当者が顔を上げた。\n\n＊\n\n外では、荷車の車輪が溝に落ちていた。\n\n押している少年にラーナが肩を貸すと、母は先にパンを買った。一枚を紙で包み、戻ってきた娘へ渡す。\n\n「メフルダードだって」\n\nラーナは、用紙の余白に書いた名前を見せた。\n\n「知ってる。昨日も倉庫にいた」\n\n「だったら最初から言ってよ」\n\n「その人に会いに行く間に、私は希望を出してくる」\n\n母の鞄には、もう移転先の図が入っていた。\n\n「本当に移るつもり？」\n\n「書かなかったら、好きな部屋が残ると思う？」\n\n「おかしいと思わないの」\n\n「思うよ」\n\n母はパンを折った。\n\n「だから、せめて窓のある方を選ぶ」\n\nラーナは熱いところを噛んでしまい、口を開けた。\n\n母が笑う。\n\n「食べてから怒りなさい」\n\n「今、食べてる」\n\n「じゃあ、その間は休み」\n\n角で別れるとき、母は娘の襟を直した。\n\n「帰りに油を買ってきて。荷物をまとめても、ご飯は作るから」\n\nラーナは、用紙の端へ忘れないように書いた。\n\nメフルダード。\n\n油。\n\n並べると、少し腹が立たなくなった。\n\n### 二　合わないもの\n\n作業所の扉にも、赤い印の通知が貼られていた。\n\n東側の点検を見合わせること。\n\n中で同僚が、返却された工具を並べていた。\n\n「働かなくていい日だと思ってた」\n\n「点検しないで壊れたら、直すのは誰？」\n\n「そのとき働く」\n\n「私がね」\n\n彼は笑って、机の引出しを開けた。\n\n昨日の控えが、曲がらないよう板に挟まれていた。\n\nラーナは礼を言い、読み取り機を机の端子へつないだ。\n\n画面に昨日の図を出す。閉鎖通知の境目を重ねる。\n\n水量の異常が出た場所は、境目の外だった。\n\n家は内側にある。\n\n「この線、何で決めたんだろう」\n\n「聞くと思った」\n\n同僚が、内線番号を書いた紙を置いた。\n\nラーナが受話器を取ると、戸口からファリデが言った。\n\n「そっちにはいないよ。西の倉庫」\n\n彼女は鍵を置き、ラーナの横から画面を覗いた。\n\n「その前に、こっちを見て」\n\n持ってきた紙に、取水と戻りの値が並んでいた。\n\n「送った分が、戻ってこない」\n\n「畑の方で使った分は？」\n\n「引いてある。貯めた分も」\n\nラーナは昨日の値を写した。\n\n数字の差は大きくない。だが、同じ向きの差が続いていた。\n\n「記録装置の線、接触が悪かったんです。私の値にも誤差があるかも」\n\n「こっちの計器まで、あなたの線につながってるの？」\n\nラーナは顔を上げた。\n\nファリデが鍵を押し出す。\n\n「だから、見てきて。畑へ行く水を、思い込みで減らされたら困る」\n\n＊\n\n西の倉庫では、職員が床へ白い線を引いていた。\n\nラーナはその線をまたいで、メフルダードの前へ出た。\n\n「私の家を移す根拠を知りたいんです」\n\n差し出した控えを、彼は受け取った。\n\n「昨日の点検か」\n\n「提出しました」\n\n彼の手元にある一覧には、昨日の途中までしか値がなかった。\n\nラーナは自分の控えを指した。\n\n「この後も測ってます」\n\nメフルダードは職員を呼び、写しを取らせた。\n\n「記録室へ入る許可は出す。ただし、奥の作業路には出ないように」\n\n「そこで測った値なんですけど」\n\n「今日は別の確認が入る」\n\n「設備の？」\n\n彼は答える前に、脇の電話を見た。\n\n鳴ってはいなかった。\n\n「重ねて作業をしないためだ」\n\nラーナは、床の線へ目を落とした。\n\nまだ壁のない、母と自分の次の部屋。\n\n「水は、作業の順番を待ってくれません」\n\n「分かっている」\n\nメフルダードは、紙の端へ番号を書いた。\n\n「変化があったら、ここへ。呼び出しても返事がなければ、倉庫の係へ伝える。担当の名前も聞きなさい」\n\n彼女は紙を受け取った。\n\n「電話したことだけで、終わりにしないでください」\n\n「君も、返事を待たずに奥へ行くな」\n\n倉庫を出ると、ファリデが扉の脇で待っていた。\n\n「あの人も、全部は聞かされてない顔だね」\n\n「知らないなら、閉じないでほしい」\n\n「知らないから、閉じるのかもしれない」\n\nラーナはそれ以上、言い返せなかった。\n\n### 三　境目の向こう\n\n計量所の記録室には、朝の暖かさが入ってこなかった。\n\nラーナは作業所へ到着を知らせ、装置へ線をつないだ。\n\n警告が出る。\n\n接続部を押さえると消えた。\n\nいったん抜き、予備の線に替えた。\n\n今度は出ない。\n\n同じ時間の記録を二度読む。値は一致した。だが、記録の途中に空白がある。\n\n昨夜の故障ではなかった。\n\nついさっきまで動いていた機器が、今朝、途中で止まっている。\n\nラーナはメフルダードの番号を回した。\n\n倉庫の係が出た。\n\n状況と計器の番号を伝え、名前を聞く。係は復唱してから、確認に人を出すと言った。\n\n「私はここで待ちます」\n\n電話を置いた。\n\n机の端に、今日の作業予定表があった。東側は、点検見合わせ。\n\nしかし、隣の欄には小さく《試験中》と出ている。\n\n何の試験かは書かれていなかった。\n\n水路に面した扉の窓を覗く。\n\n向こう岸に、人がいた。\n\n＊\n\n薄い色の上着を着た青年だった。\n\n扉を開けると、こちらに気づいた。\n\n「そこ、上へ戻れる？」\n\n「戻れるけど。あなた、誰？」\n\n「道を間違えた。下りる方は開いてたんだ」\n\n彼は自分の来た側を指した。\n\n「途中で戻れなくなって。別の出口を探してる」\n\nラーナは向こう岸の通路を見た。\n\n彼の後ろの扉には、赤い灯りが点いている。\n\n「今、作業してる人がいるはず。勝手に奥へ行かないで」\n\n「じゃあ、ここで待つ」\n\n青年は本当に止まった。\n\n扉の脇に、細い表示灯が三つ並んでいた。\n\n左から一つずつ灯り、全部消える。それを繰り返している。\n\nラーナが何度も通った場所だが、昨日までは消えていた。\n\n「それ、新しいの？」\n\n青年が表示灯を指した。\n\n「知らない」\n\n「さっきも、別の入口で見た」\n\n「どこの？」\n\n「広場の、水門へ下りるところ」\n\nラーナの知る広場から、ここへ直接下りる道はなかった。\n\n説明を求めようとすると、記録室の電話が鳴った。\n\n＊\n\nメフルダードだった。\n\n『記録室にいるか』\n\n「います。向こうの作業路に、知らない人がいます」\n\n少し間が空いた。\n\n『作業者か』\n\n「印はないです。道を間違えたって」\n\n受話器の向こうで、紙が擦れた。\n\n『声は聞こえるのか』\n\nラーナは窓の外を見た。\n\n青年は水路の上流を見ていた。\n\n「話してますけど」\n\n『その人を動かさないで。君も待つように』\n\n通話が切れた。\n\nラーナは、受話器を持ったままになった。\n\nまず名前を聞かれると思っていた。\n\nあるいは、けがをしていないか。\n\n声が聞こえるか、とは、どういう確認なのだろう。\n\n### 四　二つの計器\n\n記録室の扉から、青年へ待つよう伝えた。\n\n彼が頷き、水路沿いの壁を見た。\n\n「あの印、ちょっと変わってるね」\n\n古い扉の上の十字だった。\n\n「変？」\n\n「先が。僕の知ってる形と違う」\n\n「昔から、あれだけど」\n\n「そうか。僕の方が、混ぜて覚えてるのかもしれない」\n\n彼はそれ以上、説明しなかった。\n\n向こうの作業着でもないし、管理の人間でもない。ラーナの返事を待つときに、時々、何もないところへ目をやった。\n\n「ここへ来るように、誰かに言われたの？」\n\n「いいや。今日は港の方を見に来たんだ」\n\n「港？」\n\n「工房と水門を。仕事で、案内する順番を考えてて」\n\nラーナは眉を寄せた。\n\n「閉鎖する場所を？」\n\n彼は答えかけて、やめた。\n\n「閉鎖は、いつ決まった？」\n\n「私たちには、昨日」\n\n青年が、こちらを見た。\n\n今度は、何もない場所へ目を向けなかった。\n\n＊\n\n装置から短い警告音がした。\n\nラーナは机へ戻った。\n\n線は抜けていない。読み込みも止まっていない。\n\nだが、水位の値が上がっている。\n\n窓から、壁に据えた針式の計器を見た。\n\nそちらも上がっていた。\n\n違う仕組みの二つが、同じ変化を示している。\n\n彼女は電話を取り、倉庫へ伝えた。\n\n今度は返事を待たず、伝言を受けた係の名前と時刻を紙に書いた。\n\n「奥へ出るの？」\n\n青年が窓の向こうから聞いた。\n\n「ここの水位が上がってる。窓からじゃ、上の管が見えない」\n\n彼は自分の側へ寄った。\n\n「ここから、箱の横は見える」\n\nラーナは読み取り機を持ち、扉の外へ出た。\n\n階段までは数歩。計器も、そのすぐ脇だ。\n\n「私が見ている箱の、上。小さい表示は？」\n\n「点いてる。文字もある」\n\n「何て？」\n\n「……読めない」\n\nラーナは首を伸ばした。\n\n反対側へ回らなければ、表示の正面は見えない。だが青年の位置からなら見えるはずだった。\n\n「線の下に、丸い字が二つ。その隣に、縦に長いの」\n\n彼が形を言う。\n\nラーナの手が止まった。\n\n切替中。\n\nその表示が、彼女の操作前から点いていた。\n\n「私が道具を抜いても、消えない？」\n\n彼は箱を見たまま答えた。\n\n「消えない」\n\nラーナは、機器と設備をつなぐ線を外した。\n\n針は動き続けた。\n\n青年が先に音へ気づいた。\n\n「上で、何か動いた」\n\nラーナも聞いた。\n\n水音の中に、硬い、小さな音が混じっていた。\n\n記録室の床へ、水が走った。\n\n### 五　切断の前\n\nラーナは電話へ戻ろうとした。\n\n階段の方から水が来ていると分かっても、受話器がそこにあると思うと、身体がそちらを向いた。\n\n向こう岸で青年が走った。\n\n曲がり角の先へ消え、すぐ戻ってくる。\n\n「戻らないで！」\n\n彼が指した場所を、ラーナはその時、まだ見つけられなかった。\n\n＊\n\nメフルダードが記録室へ電話したとき、呼出音は返らなかった。\n\n彼は受話器を置かず、配線盤の表示を見た。\n\n東の系統が、応答なしになっている。\n\n「現場へ二人。上の連絡路から入ってくれ」\n\n職員が鍵を取った。\n\nメフルダードは別の番号を回した。\n\n＊\n\n別室の机では、水路の映像だけが動いていた。\n\nラーナが壁を上っている。\n\nもう一人は、反対側の高い通路から、彼女の手元を見ていた。\n\n電話の向こうで、メフルダードが言った。\n\n『こちらで下の電話が通じません。そちらから、二人に上の連絡路へ出るよう伝えられますか』\n\n係が、傍らの男を見た。\n\n男はすぐには答えなかった。\n\n画面の外側で、短い文字列が動いている。\n\n接続先の欄には番号があった。\n\n接続元の欄は空白だった。\n\n「そのままにしろ」\n\n男が言った。\n\n係は受話器へ向き直り、現場へ人が向かっていることだけを確認した。\n\n画面の中で、ラーナが穴へ身体を入れた。\n\n向こう岸の青年が、ようやく腕を下ろす。\n\n＊\n\n男は手元の紙へ、短い印を付けた。\n\n印は、水路の絵の入口側にあった。\n\n線を先へ延ばす前に、戻るところを囲む。\n\nそれから、係へ尋ねた。\n\n「接触は」\n\n「続いています」\n\n男が電話を取った。\n\n係は椅子を引き、切断の操作へ手を置いた。\n\n### 六　消えなかったもの\n\nラーナは、青年が消えた後もしばらく同じ場所を見ていた。\n\nそれから、自分が上ってきた穴へ顔を向けた。\n\n下へ戻って確かめることはできない。\n\nできるのは、自分の側の出口へ進むことだった。\n\n膝を立てる。立ち上がる。\n\n脚が震えた。\n\n壁に手をつき、灯りへ向かって歩いた。\n\n途中に古い配線の溝があり、細い光がいくつか点いていた。\n\nその一本が、対岸に向かう管の陰で消えていた。\n\n＊\n\n連絡路の扉を開けると、二人の職員が来た。\n\n一人がラーナの腕を支えた。\n\n今度は、触れられた。\n\n「向こうにも人がいた」\n\nラーナは先に言った。\n\n「リツって名前。上の通路に」\n\n職員がもう一人へ合図を送り、壁の電話まで走った。\n\nもう一人は、ラーナを椅子へ座らせた。\n\n「見てきてもらうから。膝を」\n\n布を当てられると、痛みが戻ってきた。\n\n＊\n\nメフルダードが来たのは、手当ての途中だった。\n\n彼はラーナの顔を見てから、濡れた勤務証を見た。\n\n「記録は？」\n\n「流された」\n\n言ってから、ラーナは顔を上げた。\n\n「けど、私が触る前から切替中だった。あの人も見てた」\n\n「向こうの人か」\n\n「リツ。知らない人だけど、箱の裏を見てくれた」\n\nメフルダードは、その名前を書いた。\n\nラーナは彼の手を見た。\n\n名前の横に、連絡先を書く余白がある。\n\nそこは空いたままだった。\n\n「どこへ行ったか、聞かないの？」\n\n彼の指が止まった。\n\n「消えたんです」\n\nラーナは言った。\n\n「目の前で。落ちたんじゃない。歩いて出てもいない」\n\nメフルダードは、何があったのかと聞かなかった。\n\nラーナは、電話での問いを思い出した。\n\n声は聞こえるのか。\n\n「何を確認してたの」\n\n彼は椅子を引いた。\n\n座る前に、廊下の職員へ言った。\n\n「この人の家へ、無事だと知らせてくれ」\n\nそれから、ラーナへ向き直った。\n\n「最初に、その人を見たところから話してほしい」\n\n＊\n\nラーナは濡れた用紙を開いた。\n\n赤い十字が滲み、余白に書いた二つの言葉だけが残っていた。\n\nメフルダード。\n\n油。\n\n母は今、荷物をまとめている。\n\nあの青年は、その母のことも知らない。\n\n名前以外、ほとんど何も知らない相手が、自分を助けた。\n\nラーナは用紙を裏返した。\n\nまだ書けるところへ、リツ、と記した。\n\n切替中。\n\n私が触る前。\n\n忘れる前に、それも書いた。\n\n---\n\n*第一部・了*\n\n\n## 第二部　助けに来た男\n\n### 一　こちら側の床\n\n《中継側から接続が終了されました》\n\n律は、ラーナのいた場所へ手を上げたままだった。\n\n水路も、白い壁も消えている。\n\n「待って。まだ、出口まで――」\n\n言葉は誰にも届かなかった。\n\n視界の隅に、再接続の項目が出た。\n\n選ぶ。\n\n《この区域は現在ご利用いただけません》\n\nもう一度選ぶ。\n\n同じ表示だった。\n\n律は終了を選んだ。\n\n机の端が戻ってきた。\n\nその向こうに、洗濯物を積んだ椅子。窓の外を、隣の建物の広告がゆっくり移動している。\n\n接続具を外した。\n\n自分の手を開く。\n\n握り直す。\n\n袖は乾いていた。床にも水はない。\n\n律は足を下ろした。\n\nさっき、ラーナの靴が何度も壁から剥がされていた。\n\nその感触を想像したせいで、自分の足を床へ載せるのにも時間がかかった。\n\n＊\n\n六月十七日、午後四時二十一分。\n\n仕事の通知が五件、私用が二件。\n\n秋山からの最後の一件を開く。\n\n《澪さん、六時。案内経路、絞れた？》\n\n律は返信した。\n\n《予定外の区域へ入りました。接続が切れて戻れません。記録を確認してから行きます》\n\nすぐに返事が来た。\n\n《体調は？》\n\n《大丈夫です》\n\nそこまで書いてから、もう一行足した。\n\n《少し、変なことがありました》\n\n＊\n\n歴史体験の履歴には、予定していた場所が順に並んでいた。\n\n広場。染織工房。水門。\n\n律の仕事は、そのどこを展示の入口にするか決めることだった。\n\n来場者が一度に入れる人数。案内を聞かずに先へ行く人がどこで迷うか。初めて接続具を使う人にも、戻る場所が分かるか。\n\n大学を出る前に旅をしていたときも、知らない街へ着くと、まず帰る駅を確かめた。\n\n今日は、戻る扉が閉じた。\n\n水門の次に、名前のない区間がある。\n\nその部分を開いた。\n\n映像は残っていた。\n\nラーナがこちらを見ている。\n\n律は音を止めた。\n\n彼女の口が動く。片手は道具の線を替えている。\n\nなぜか、怒られたときの方がはっきり思い出せた。\n\n仕事が終わるまで待って、と言われた。\n\n律が質問を重ねたせいで、彼女は一度、作業を止めた。\n\nAGIが担当する人物は、プレイヤーの見ていないところでも生活を続ける。見せ場を逃したからといって、同じ台詞で待ち直してはくれない。\n\nそれは分かっていた。\n\nけれどラーナは、律の言う港の場所さえ分からなかった。\n\n彼女は律に役割を渡そうとしていなかった。\n\n出口の邪魔になる、知らない人が来た。\n\nあの反応は、それに近かった。\n\n律は、再生位置を少し戻した。\n\n箱の上の表示が映っている。\n\nラーナに形を説明した文字。\n\n読めないまま、記録へ印を付けた。\n\n＊\n\n切断直前の通信状態を開いた。\n\n遅延の警告は出ていない。\n\n端末の接続も続いていた。\n\n終了理由だけが、通常の区域移動と違う。\n\n《中継側終了》\n\n最初に入った扉にも、中継という表示があった。\n\n水門の補修通路に、三つの灯りが並んでいたことを思い出す。\n\nラーナも同じ灯りを見て、新しいのかと聞かれて首を振った。\n\n律は体験運営の報告画面を開いた。\n\n勤務先の展示制作案件に紐づけ、区域履歴と終了理由を添える。\n\n記録の提供を求められた。\n\n全部を選びかけて、指を止めた。\n\nラーナが、家を閉じられる話をしている。\n\n仕事の事故報告へ必要なのは、そこではなかった。\n\n入口、計器、終了直前の短い場面を選んだ。\n\n彼女の顔が入る最後の場面は、状況を伝えるため残した。\n\n《接続先の人物が負傷しているように見えます。相手が実際の参加者の場合、安全確認をお願いします》\n\nそう書いて送った。\n\n受理番号が出た。\n\n律はその番号を保存し、上着を取った。\n\n### 二　知らないはずの名前\n\n駅へ向かう途中で、運営から返事が来た。\n\n《該当区域は、当社の公開コンテンツ一覧では確認できませんでした。接続基盤の担当へ照会しています。再接続はお控えください》\n\n律は歩きながら読み、足を止めた。\n\n公開されていない、ではない。\n\n一覧で確認できない。\n\n画面の下に、引継ぎ先の会社名があった。\n\n展示の設備契約で見た名前だった。\n\n秋山へ転送し、歩き出す。\n\n駅前の店で水を買った。\n\n支払いを終えたとき、男が扉の脇から離れた。\n\n「リツさんですか」\n\n律は飲み物を鞄へ入れず、持ったまま振り向いた。\n\n知らない顔だった。\n\n「どちらの方ですか」\n\n「何を持って帰りました」\n\n男の日本語は、言葉を一つずつ選んでいた。\n\n律は、出口を背にしないよう半歩ずれた。\n\n「接続の調査なら、会社を通してください。窓口は――」\n\n「遊びではない」\n\n男の声が低くなった。\n\n「招かれていない者が、あそこへ入ってはならない」\n\n律は店の中を見た。\n\n店員が、次の客の会計をしている。\n\n「誰のことを言ってますか」\n\n「あの女から、何を受け取った」\n\nラーナ。\n\n名前が出かけた。\n\n飲み込んだが、男は律の顔を見ていた。\n\n手が伸び、上着をつかんだ。\n\n「離してください」\n\n律は大きく言った。\n\n店員が顔を上げた。\n\n男の空いた手に、細い刃があった。\n\n一度、身体を引いた。\n\n袖をつかむ力が強くなる。\n\n律は持っていた水を、男との間へ押し出した。\n\n刃を持つ手がそれを払った。\n\n瓶が落ちる音がした。\n\nその間に、つかまれた腕を店の方へ引いた。\n\n上着の脇が裂けた。\n\n律は男の手首を取ろうとはしなかった。肩から逃げ、もう一度声を出した。\n\n「刃物です！　警察を！」\n\n誰かが叫んだ。\n\n人が動く。\n\n男が押した。\n\n律の踵が縁石から外れた。\n\n車の警告音が、すぐ後ろで鳴った。\n\n＊\n\n襟元をつかまれた。\n\n今度は、横へ引かれた。\n\n靴底が歩道の端を擦った。\n\n律は反射的に腕を上げた。\n\n「こっちだ」\n\n英語だった。\n\n背の高い男が、間へ入った。\n\nサングラス。濃い色の上着。\n\n男は律を見ず、相手へ短く何かを言った。\n\n律には、やめろ、と聞こえた。\n\n刃を持つ手が止まる。\n\n後ろから別の男が来た。\n\n店員が扉を開け、人を中へ戻す。\n\n襲撃者は一歩退き、それから走った。\n\n律は壁へ手をついた。\n\n追おうとは思わなかった。\n\n車の音が、まだ身体の近くに残っていた。\n\n### 三　ミーシャ\n\n店員が椅子を出してくれた。\n\n律は座り、上着の裂けたところを見た。\n\n下の服に血はない。\n\n手の甲からは、血が出ていた。\n\nサングラスの男は同行者へ指示を出してから、律の前に立った。\n\n「けがは」\n\n短い日本語だった。\n\n「手だけ、たぶん」\n\n男は眼鏡を外した。\n\n「ミハイロ」\n\n姓と会社名が続く。\n\n律は会社名を聞き直した。\n\nさっき、運営から引継ぎ先として示された会社だった。\n\n「ミーシャでいい」\n\n男は英語で言い、律を見た。\n\n「今回の接続について、話を聞く予定だった」\n\n律は、どこから、と聞こうとした。\n\nだが相手には、どこへ、と聞こえたらしい。\n\n事務所の所在地を答え始める。\n\n「違う、どうして僕がここにいると」\n\n言い直しても、すぐには合わなかった。\n\nミーシャが同行者へ手を出す。\n\n彼は端末を開き、通訳を起動した。\n\n滑らかな日本語が、乾いた声の後へ続いた。\n\n「勤務先へ連絡しました。ご本人は移動中だと聞き、面談を申し込むため近くまで来ていました」\n\n律は、保存した受理番号を見せた。\n\nミーシャの端末にも、同じ番号がある。\n\n運営へ報告してから、まだ一時間も経っていなかった。\n\n「それで、さっきの人は」\n\nミーシャは男が逃げた方を見た。\n\n「調べます」\n\n訳された声は丁寧だった。\n\n本人の声には、ほとんど抑揚がなかった。\n\n＊\n\n警察官が来るまで、ミーシャはその場に残った。\n\n律は聞かれた順に答えた。\n\n何を受け取った、と言われたこと。\n\n相手が自分の名前を知っていたこと。\n\n知らない人物だったこと。\n\nミーシャは律の代わりに答えず、自分に聞かれたことへ答えた。\n\n同行者が近くに車を停めている、と言う。\n\n律はその車を見た。\n\n黒い普通の車だった。\n\n普通の車を、ひどく特別なものに見せる人間がいるのだと思った。\n\n＊\n\n手を処置してもらう間に、秋山が来た。\n\n最初に律の手を見て、次にミーシャの身元を確かめた。\n\n「病院から聞いたんじゃないですよね」\n\n「僕が電話しました」\n\n律が答えると、秋山はようやく椅子へ座った。\n\n「今日は帰っていい」\n\n「先に話を聞きたいです」\n\n秋山は裂けた上着を見た。\n\n「じゃあ、一人では聞かない」\n\nミーシャは、律たちの事務所で話すことに同意した。\n\n律は彼の会社の公開情報を開き、氏名と役職を照合した。\n\nニューヨークの民間セキュリティ企業。役員。\n\n写真には、今と同じ顔があった。\n\n経歴の中には、暗号解析についての論文も並んでいた。\n\n律は画面を閉じた。\n\n情報機関の人間だったら、こういう経歴を出すのだろうか。\n\n考えても確かめられないことへ、頭を使い始めていた。\n\n今は、目の前の男が何を答えるかを聞くしかなかった。\n\n### 四　誰に見せたか\n\n事務所の打合せ机には、展示入口の模型が出たままだった。\n\n小さな人影が中へ入り、別の扉から戻ってくる。\n\n律は模型の横へ、破れた上着を置いた。\n\nミーシャは向かいへ座った。\n\n「まず、最後の接続について」\n\n律は首を振った。\n\n「僕を襲った人を、知っているんですか」\n\n通訳が終わるまで、ミーシャは待った。\n\n「接続先に関係する者の可能性はある」\n\n「さっき、何て言ったんですか」\n\n「やめろ、と」\n\n「それで、やめた」\n\n「人も集まっていた」\n\n確かにそうだった。\n\nそれだけで納得することもできなかった。\n\n秋山が、運営からの通知を机に出した。\n\n「こちらへ引き継いだ範囲を確認させてください。本人の報告と接続記録だけですか」\n\n「提供された画像と、案件の連絡先です」\n\n「御社の内部で、誰が見られますか」\n\nミーシャは、通訳された文を一度読み直した。\n\n「担当を確認して、回答する」\n\n「では、保全もお願いします」\n\n彼は頷いた。\n\n律は、ラーナの顔が映った数秒を思い出した。\n\n「彼女にも、何か起きるんですか」\n\nミーシャの目が律へ向いた。\n\n「なぜ」\n\n「あの男は、僕がどこへ入ったか知っていた。彼女から何か受け取ったかって。向こうにも同じ考えの人がいるなら」\n\n「今、確認している」\n\n「連絡はできるんですか」\n\n「調整中だ」\n\n答えになっていない。\n\nけれど、何も知らない人の返事でもなかった。\n\n＊\n\nミーシャが自分の端末を開いた。\n\n「何か受け取ったか」\n\n律は彼を見た。\n\n「あの男と同じ質問ですね」\n\n「物だけではない。情報も含む」\n\n「話はしました。ずっと、水路の反対側にいたので、物は受け取れません」\n\nミーシャの視線が、机へ落ちた。\n\n「相手の名前は」\n\n律は答える前に聞いた。\n\n「僕が言えば、その人を特定できますか」\n\n「場所と顔は、すでに記録にある」\n\n律の指が、上着の裂け目をつまんだ。\n\n必要だと思って、自分が送った。\n\nあの場では必要だった。\n\nしかし、それを誰が見るかは、確認していなかった。\n\n「ラーナです」\n\nミーシャは名前を書いた。\n\n「どんな文字を見た」\n\n「表示です。彼女が作業していた箱の」\n\n「ほかには」\n\n「壁にもあったと思います」\n\n「誰かに見せたか」\n\n律は、ようやく質問の順番に気づいた。\n\n何を知った。\n\n何を残した。\n\n誰へ渡した。\n\n「まだ運営へ送った分だけです」\n\n「ほかの記録も、こちらへ」\n\n律は端末を伏せた。\n\n「どうして必要かを教えてください」\n\nミーシャの手が止まった。\n\n「事故の経路を確認するためだ」\n\n「区域の一覧にない場所へ、どうして入れたか。それは僕も知りたいです。でも、その人の会話を全部渡す必要がありますか」\n\n秋山が、二人の間へ机の表示を寄せた。\n\n「経路と通信状態を先に。追加が必要なら、その理由をください」\n\n＊\n\n律は三つの灯りの映像を出した。\n\nミーシャが、初めて自分から身を寄せた。\n\n「入口は、ここか」\n\n「水門の先です。補修通路って出てました」\n\n「その表示も残っているか」\n\n律は前の場面へ戻した。\n\n歴史的な石壁の前に、現代の操作用の案内が重なっている。\n\n《外部中継区間。体験記録は端末に保存されます》\n\n律は入るとき、制作確認用の別区域だと思った。\n\n業務用の体験には、そういう境目がある。\n\n秋山が尋ねた。\n\n「公開ゲームの中に、御社の試験経路があったんですか」\n\n「確認する」\n\nミーシャは言った。\n\n同じ言葉なのに、今度は、確認すべき場所が分かっている人の声だった。\n\n＊\n\n帰り際、ミーシャは再接続しないよう念を押した。\n\n「あなたの安全のためでもある」\n\n「彼女は？」\n\n律が聞くと、彼は扉の前で止まった。\n\n「居場所が分かる人に、無事か聞いてください。それだけでも」\n\nミーシャは律を見た。\n\n「連絡する」\n\n救助されたときより、今の返事の方が少し信じられた。\n\n律は助けてくれた礼を言った。\n\nその礼と、まだ答えられていない質問は、別々に残った。\n\n### 五　監修者の知らない町\n\n秋山は扉が閉まるのを待って、律へ水を渡した。\n\n「報告先と、彼の身元は一致してる。救助前から相手を知っていたかは、まだ分からない」\n\n律は頷いた。\n\n「偶然近くにいたという説明も、警察へ追加しておこう。見てた人がいるかもしれない」\n\n連絡を済ませたころ、六時を過ぎていた。\n\n澪は隣室で待っていた。\n\n予定していた監修の資料を閉じ、律の手を見る。\n\n「今日は、やめましょう」\n\n「すみません」\n\n「謝ることじゃないです」\n\n彼女は立ちかけ、机の模型を見た。\n\n「水門から先を、まだ迷っていたんですよね」\n\n「迷った先で、迷いました」\n\n律が言うと、秋山が顔をしかめた。\n\n「そういうまとめ方をしない」\n\n澪は笑わず、椅子を戻した。\n\n「どこへ入りました？」\n\n＊\n\n澪は今回の展示で、地域史と生活の監修を担当していた。\n\n主な仕事は、考古学の現地調査だという。\n\n初めて打ち合わせたとき、律の経路案を見て、住民が水を運ぶ道を来場者で塞がないようにと言った。\n\nゲームの町なのだから、時間をずらせばよいのではと律は答えた。\n\n彼女は、それでは、その町が何をしている場所か伝わらない、と返した。\n\n今なら、あのときより意味が分かった。\n\n「運営の一覧にない区域だったそうです」\n\n秋山が通知を見せた。\n\n澪は先に、履歴を確かめた。\n\n「時代の違う資料を仮につないだ場所かもしれません。でも、制作側が把握していないなら、それだけでは説明できませんね」\n\n「建物だけ、見てもらえますか」\n\n律は、人物が映っていない場面を選んだ。\n\n水路と古い壁。\n\n画面の端に、計器。\n\n澪は壁へ顔を近づけた。\n\n「その継ぎ目を、もう少し大きく」\n\n律は拡大した。\n\n線は、真っすぐには続いていない。\n\n途中で下がり、折れ、また同じ高さへ戻っている。\n\n「石の積み方ですか」\n\n「ここは、後から埋めてあります」\n\n澪は画面へ触れず、指を手前で止めた。\n\n「この奥も見ました？」\n\n「水が来て、上へ逃げました」\n\n「上の廊下へ？」\n\n「あります。映像も」\n\n最後の場面は、ラーナが大きく映っていた。\n\n律は画像の端だけを切り出した。\n\n澪の視線が、人物を除いたことより、残った壁の方へ動いた。\n\n「この先、床が一度下がっていませんでしたか」\n\n「そこまでは見てません。僕の側は、奥が閉じていて」\n\n彼女は鞄からノートを出した。\n\n画面を見ながら写すのかと思った。\n\nしかし、ノートにはすでに絵があった。\n\n細い水路と、向かい合う段。\n\n壁の折れ方も、似ていた。\n\n「どこの図ですか」\n\n律が聞いた。\n\n「私が描いたものです」\n\n澪は、ページの端を押さえた。\n\n「現地調査で？」\n\n「いいえ。記憶を整理するために」\n\n秋山が、手元の通知から顔を上げた。\n\n澪はその二人の顔を見て、言い直した。\n\n「ここに似た場所で暮らしていた記憶があるんです。ただ、今のどこに当たるのか、まだ確かめられていません」\n\n律はもう一度、図を見た。\n\n「昔、住んでたんですか」\n\n「自分が生まれる前の生活を覚えている、と言う方が正確です」\n\n律は、彼女の顔を見た。\n\n冗談を言っているようには見えなかった。\n\n「前世、ということですか」\n\n「そう呼ぶことになります。ただ、私の記憶と、今の映像がどうつながるかは、まだ分かりません」\n\n澪は画面とノートを見比べた。\n\n「画像が似ているだけで、同じ場所だとは言えないので」\n\n彼女は線の一か所を指した。\n\n「確かめられるところが、いくつかあります」\n\n### 六　読めない表示\n\n律は自分の記録へ戻った。\n\nノートと同じ壁を映す場面を探す。\n\nラーナが箱へしゃがむ直前で止めた。\n\n「この文字も、見覚えがありますか」\n\n澪は覗き込み、顔を上げた。\n\n「もう少し、正面からの画像は？」\n\n「これだけです。細い表示で、動くと潰れてしまって」\n\n律は数秒分をゆっくり送った。\n\n光が反射する。\n\n一瞬だけ、輪が二つと縦の線が見えた。\n\n澪はノートの余白へ形を描いた。\n\n「同じ字だったら、切り替えている、という意味かもしれません。画面が小さいので、断定はできませんが」\n\n律は顔を上げた。\n\nラーナが口にした言葉と、合っていた。\n\n「彼女も、そう言ってました」\n\n「誰ですか」\n\n「そこで会った人です。作業していた人」\n\n澪は、消した人物のいた場所を見た。\n\n「その方にも、聞けるといいですね」\n\n「僕も、それを先にしたいんです」\n\n＊\n\n秋山がノートと画像を並べた。\n\n「澪さんの図が、そのゲームの制作資料に使われた可能性は？」\n\n「このノートは渡していません。ただ、ほかの図はあります。制作側へ確認はできます」\n\n「お願いします。同じ場所かどうかと、画像がどこから来たかは、別に調べた方がよさそうですね」\n\n律はノートのページを撮らせてもらい、受け取った日時を記した。\n\n自分の映像とは別に保存する。\n\nどちらに合わせて、どちらを書き直したのか、後で分からなくしないためだった。\n\n澪はその作業を見ていた。\n\n「元のページも、そのまま残しておきます」\n\n律は礼を言った。\n\n彼女の説明を、信じたわけでも、退けたわけでもなかった。\n\n少なくとも、比べられるものが一つ増えた。\n\n＊\n\n「もう一つだけ」\n\n澪が言った。\n\n「入った先に、住んでいる人がいたんですよね」\n\n律は頷いた。\n\n「仕事をしている人は。でも、僕は最初、AGIか、誰かが演じている人だと」\n\n「それは、まだ分からない？」\n\n「分かりません」\n\n彼女はノートを閉じた。\n\n「では、まず、その人が無事か確かめましょう。場所の話は、そこからでも遅くありません」\n\n律は、ミーシャの連絡先を開いた。\n\n新しい図のことも、文字の訳のことも、いったん書かなかった。\n\nラーナは無事か。\n\n本人と話す方法はあるか。\n\n二つだけ書いて、送った。\n\n＊\n\n窓の外で、広告の色が変わった。\n\n律は水を飲み、ようやく、昼から何も食べていないことに気づいた。\n\n鞄の中には、買えたはずの水がなかった。\n\n駅前の歩道へ落としたままだ。\n\nラーナの鞄も流された。\n\nその中には何が入っていたのだろう。\n\n自分が記録した箱の表示を、彼女はもう見直せないのかもしれない。\n\n律は、切替表示の場面を消さずに残した。\n\n### 七　救助のあと\n\nミーシャは、車に乗って       if (block.kind === 'title' || block.kind === 'end') flush();
    }
    flush(); return pages;
  }
  function pageForAnchor(pages, rawAnchor) {
    const anchor = Number.isFinite(rawAnchor) ? Math.max(0,Math.floor(rawAnchor)) : 0;
    const i = pages.findIndex(page => page.endId >= anchor);
    return i < 0 ? Math.max(0,pages.length-1) : i;
  }
  function validAnchor(value, length) {
    const n = Number(value);
    return value !== null && value !== '' && Number.isInteger(n) && n >= 0 && n < length ? n : null;
  }
  return {parseMarkdown, paginate, pageForAnchor, validAnchor};
});
</script>
<script>(function(){
  'use strict';
  const story = JSON.parse(document.getElementById('story-data').textContent);
  const {parseMarkdown,paginate,pageForAnchor,validAnchor} = ReaderCore;
  const manuscript = parseMarkdown(story.markdown);
  const $ = id => document.getElementById(id);
  const keys={settings:'yakusoku-reader-settings-v1',progress:'yakusoku-reader-'+story.version};
  let storageAvailable=true;
  function load(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(_){return null;}}
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(_){storageAvailable=false;}}
  const stored=load(keys.settings)||{};
  const mobile=window.matchMedia('(max-width:600px)').matches;
  const allowed=[240,360,480];
  const settings={font:Number.isFinite(stored.font)?Math.max(16,Math.min(28,stored.font)):(mobile?18:21),target:allowed.includes(stored.target)?stored.target:(mobile?240:360),theme:['light','dark'].includes(stored.theme)?stored.theme:(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
  const restored=load(keys.progress)||{};
  const hashAnchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);
  const resumeAnchor=validAnchor(restored.anchor,manuscript.blocks.length);
  let pages=paginate(manuscript.blocks,settings.target);
  let pageIndex=pageForAnchor(pages,hashAnchor===null?(resumeAnchor||0):hashAnchor);
  let maxVisited=validAnchor(restored.maxVisited,manuscript.blocks.length)||0;
  let toastTimer;
  function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent='';},4000);}
  function applySettings(){document.documentElement.dataset.theme=settings.theme;document.documentElement.style.setProperty('--reading-size',settings.font+'px');$('font-value').textContent=settings.font+'px';$('font-minus').disabled=settings.font<=16;$('font-plus').disabled=settings.font>=28;$('page-size').value=String(settings.target);$('theme-toggle').textContent=settings.theme==='dark'?'紙の色にする':'夜の色にする';save(keys.settings,settings);}
  function persist(){const anchor=pages[pageIndex].startId;maxVisited=Math.max(maxVisited,pages[pageIndex].endId);save(keys.progress,{anchor,maxVisited});try{history.replaceState(null,'','#at='+anchor);}catch(_){}if(!storageAvailable)$('toast').textContent='このブラウザーでは読書位置を保存できません。';}
  function render(){
    const page=pages[pageIndex];if(!page)return;
    const chapter=manuscript.chapters[page.chapter];const part=manuscript.parts[page.part];
    $('part-label').textContent=part?part.title:story.title;
    $('chapter-title').textContent=chapter?chapter.title:'';
    $('chapter-title').hidden=!chapter;
    $('chapter-position').textContent=chapter?'第'+(page.chapter+1)+'章 / 全'+manuscript.chapters.length+'章':'';
    const fragment=document.createDocumentFragment();
    page.blocks.forEach(block=>{const p=document.createElement('p');p.textContent=block.text;if(block.kind!=='text')p.className=block.kind;fragment.appendChild(p);});
    $('prose').replaceChildren(fragment);
    $('reading-page').classList.toggle('card',page.blocks[0].kind==='title'||page.blocks[0].kind==='end');
    $('page-count').textContent=(pageIndex+1)+' / '+pages.length;
    $('previous').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;
    $('next').textContent=pageIndex===pages.length-1?'読了':'次のページ →';
    const progress=$('progress');progress.setAttribute('aria-valuenow',String(pageIndex+1));progress.setAttribute('aria-valuemax',String(pages.length));$('progress-fill').style.width=((pageIndex+1)/pages.length*100)+'%';
    document.title=(chapter?chapter.title+' | ':'')+story.title;
    persist();window.scrollTo(0,0);if(!document.querySelector('dialog[open]'))$('reading-page').focus({preventScroll:true});
  }
  function move(delta){const n=Math.max(0,Math.min(pages.length-1,pageIndex+delta));if(n!==pageIndex){pageIndex=n;render();}}
  function showDialog(id){$(id).showModal();}
  function showContents(){
    const body=$('toc-body');body.replaceChildren();
    const note=document.createElement('p');note.className='dialog-note';note.textContent='未読の章は、内容を伏せて番号だけで表示します。';body.appendChild(note);
    manuscript.parts.forEach(part=>{
      const section=document.createElement('section');section.className='toc-group';
      const heading=document.createElement('h3');heading.textContent=part.label;section.appendChild(heading);
      manuscript.chapters.filter(c=>c.part===part.index).forEach(chapter=>{
        const button=document.createElement('button');button.type='button';button.className='toc-link';button.disabled=chapter.startId===null;
        if(chapter.index===pages[pageIndex].chapter)button.setAttribute('aria-current','true');
        const mark=document.createElement('span');mark.className='toc-mark';mark.textContent=chapter.startId<=maxVisited?'✓':'';mark.setAttribute('aria-hidden','true');
        const label=document.createElement('span');label.textContent=chapter.startId<=maxVisited?chapter.title:'第'+chapter.label+'章';
        button.append(mark,label);button.addEventListener('click',()=>{pageIndex=pageForAnchor(pages,chapter.startId);$('contents').close();render();});section.appendChild(button);
      });body.appendChild(section);
    });showDialog('contents');
  }
  $('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
  $('contents-open').addEventListener('click',showContents);$('settings-open').addEventListener('click',()=>showDialog('settings'));
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('close',()=>$('reading-page').focus({preventScroll:true}));dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});});
  $('font-minus').addEventListener('click',()=>{settings.font=Math.max(16,settings.font-1);applySettings();});
  $('font-plus').addEventListener('click',()=>{settings.font=Math.min(28,settings.font+1);applySettings();});
  $('theme-toggle').addEventListener('click',()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings();});
  $('page-size').addEventListener('change',()=>{const anchor=pages[pageIndex].startId;settings.target=Number($('page-size').value);pages=paginate(manuscript.blocks,settings.target);pageIndex=pageForAnchor(pages,anchor);applySettings();render();});
  $('reading-page').addEventListener('click',()=>{if(window.getSelection()?.toString())return;move(1);});
  document.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||document.querySelector('dialog[open]'))return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable)return;
    if(event.target.closest('button')&&(event.key===' '||event.key==='Enter'))return;
    const direction=(event.key===' '?(event.shiftKey?-1:1):({'ArrowRight':1,'PageDown':1,'ArrowLeft':-1,'PageUp':-1,'Backspace':-1})[event.key]);
    if(direction){event.preventDefault();move(direction);}
  });
  window.addEventListener('hashchange',()=>{const anchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);if(anchor!==null){pageIndex=pageForAnchor(pages,anchor);render();}});
  applySettings();render();
  if(hashAnchor===null&&resumeAnchor>0)toast('前回の続きから再開しました。');
})();
</script>
</body></html>
