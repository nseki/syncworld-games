<script id="story-data" type="application/json">{"title": "The Voynich XCrossings", "edition": "全六部・第2稿", "version": "63ca738a0e119b64", "markdown": "# The Voynich XCrossings\n\n*全六部・第2稿*\n\n## 第一部　閉じられる道\n\n### 一　戻ってはいけない\n\n「戻らないで！」\n\n向こう岸の青年が叫んだ。\n\nラーナは、半分まで振り向いていた。\n\n来た道へ戻れば、階段がある。その上には記録室があり、電話があり、鍵の掛からない出口がある。\n\n青年の指は、逆を向いていた。\n\n水音が変わった。\n\nラーナは背後を見た。\n\n通路の角から、白いものが押し出されてきた。\n\n泡だった。\n\nその下に、黒い水がある。\n\n「こっちを見て。上！」\n\n手すりを握った。\n\n足元へ水が来た。\n\n最初の一波が靴をたたき、その次がすねをさらった。ラーナは壁へ肩をぶつけ、両手で手すりをつかんだ。\n\n冷たい。\n\n声が出なかった。\n\n鞄が脚の間へ入り込んだ。外そうとすると、身体まで水に向きそうになった。\n\n「そのまま！　下を向かないで！」\n\n青年が、何かを指している。\n\n彼の後ろにも水があった。\n\n二人の間の水路は、もう見えなかった。\n\nラーナは顔を上げようとした。\n\n手すりが、腕の中で鳴った。\n\n金具の一つが壁から浮いた。\n\n次が来る。\n\n角の向こうから、もっと大きな音がした。\n\nラーナは息を吸った。\n\n今度は、足の裏が床から離れた。\n\n### 二　その日の朝\n\n「その区域には、今朝から入れません」\n\n担当者は、ラーナの顔を見ずに言った。\n\n「だから、そこで働いてるんですけど」\n\n「勤務先の変更は、所属先から申請してください」\n\n「変更したいんじゃありません。昨日の点検が終わってないんです」\n\n担当者は紙の右上にある番号を入力した。\n\n待った。\n\n画面を見た。\n\n「その区域には、今朝から入れません」\n\n後ろで誰かが笑った。\n\nラーナは机へ身を寄せた。\n\n「じゃあ、点検は誰がするんですか」\n\n隣から、母が別の紙を差し出した。\n\n「移転先の希望は、こちらでいいんですね」\n\n「まだ話してる」\n\n「私の話もあるの」\n\n担当者が二枚目の用紙を出した。\n\n母は眼鏡を掛け、同居者の欄で指を止めた。\n\n「夫は、もう亡くなっていますけど」\n\n「では、不要です」\n\n母の指が、一つの欄を飛ばした。\n\nラーナは、その手を見てから、担当者へ向き直った。\n\n「点検に入るための許可は、どこで取れますか」\n\n「管理責任者です」\n\n「名前を」\n\n担当者が、ようやく顔を上げた。\n\nラーナは、自分の紙の余白へ名前を書いた。\n\nメフルダード。\n\n＊\n\n外では荷車が道を塞いでいた。\n\n母は隙間を通り抜け、焼きたてのパンを二枚買った。\n\n一枚を、ラーナへ渡す。\n\n「おかしいと思わないの？」\n\n「思うよ」\n\n「じゃあ、なんで書くの」\n\n母は、移転の用紙を鞄へしまった。\n\n「書かなかったら、好きな部屋が残ると思う？」\n\nラーナは答えなかった。\n\n「あなたが調べるのは止めない。でも、荷物はまとめる」\n\n「まだ、移るって決まってない」\n\n「決まってからまとめると、あなた、文句を言うでしょう。どうして先にやっておかなかったのって」\n\n母はパンの包みを開いた。\n\n「食べてから怒りなさい」\n\n「食べてるときに言わないで」\n\n「まだ食べてないでしょう」\n\n母が笑った。\n\nラーナは一口かじった。\n\n中は、まだ熱かった。\n\n作業所へ向かう角で別れた。\n\n母は家へ、ラーナは昨日の測定記録のある方へ歩いた。\n\n＊\n\n作業所の扉にも、紙が貼られていた。\n\n東側の設備点検を見合わせること。\n\n中では同僚が、棚卸しをしていた。\n\nラーナを見ると、工具を置かずに言った。\n\n「仕事に行っていいか、聞いてきた？」\n\n「行かないで済むなら、喜ぶところなの？」\n\n「俺の分まで怒るなよ」\n\n彼は机の引出しを指した。\n\n昨日の記録と、控え。\n\nラーナは機器を起動した。\n\n保存した図へ、閉鎖の通知を重ねる。\n\n水量の異常が出た場所と、閉じる区域の境目がずれている。\n\n家は、境目の内側だった。\n\n「この図、誰が変えた？」\n\n同僚は、小さな紙を差し出した。\n\nメフルダードの内線番号。\n\n「聞くと思った」\n\nラーナは受話器を取った。\n\n呼出音を二回聞いたところで、戸口へファリデが来た。\n\n「そこにはいない。西の倉庫」\n\nラーナが受話器を置くと、ファリデは鍵を一つ、机へ置いた。\n\n「会いに行くなら、ついでに今日の図をもらってきて」\n\n「移転先の？」\n\n「東の計量所。入れた分と戻った分が、合わない」\n\nラーナは機器から顔を上げた。\n\nファリデも、数字を見た。\n\n「あなたの家だけの話じゃないよ。畑へ送る水まで変えられると、困る」\n\n彼女は鍵を押し出した。\n\n「記録室の分。使えるうちに、記録を取ってきて」\n\n### 三　境目の仕事\n\n西の倉庫の床には、白い線が引かれていた。\n\n職員が、線に沿って仕切りを立てている。\n\nメフルダードは、その間で図面を見ていた。\n\nラーナは、通知と機器を並べて差し出した。\n\n「この境目の根拠を、知りたいんです」\n\n彼は通知を受け取らず、機器の画面を拡大した。\n\n「いつ測った？」\n\n「昨日の最後です。提出もしました」\n\n「私のところには来ていない」\n\nラーナは、反射的に言い返しかけた。\n\nメフルダードが職員を呼び、控えを取るよう指示する。\n\n彼女は言葉を飲み込んだ。\n\n「計量所へ行くそうだね」\n\n「ファリデさんに頼まれました」\n\n「記録室まではいい。奥の作業路は、別の担当が見る」\n\n「いつ？」\n\n「確認中だ」\n\nラーナは、床の白い線へ目を落とした。\n\n次に住む部屋になるかもしれない場所だった。\n\n壁は、まだなかった。\n\n「明日から入れなくなるなら、今日中に見ないと、分からないままになります」\n\nメフルダードは、彼女を見た。\n\n「分からない場所へ入るな、と言っている」\n\n「設備の故障なら、見なければ直せません」\n\n「故障だけだとは限らない」\n\nその言い方で、ラーナは顔を上げた。\n\n彼は続きを言わなかった。\n\n機器から控えを取り、返す。\n\n「記録室まで。それを越えるなら、こちらへ連絡を」\n\nラーナは機器を受け取った。\n\n「連絡したら、来てくれるんですか」\n\nメフルダードの返事を待たず、別の職員が彼を呼んだ。\n\n彼は手を上げて待たせた。\n\n「連絡を受けたことだけで、済ませはしない」\n\nそれは、窓口で聞いた返事よりは、少しましだった。\n\n＊\n\n計量所の前で、二人の男が掲示板を取り替えていた。\n\n新しい板には、赤い線が増えていた。\n\n閉鎖は、明日の朝から。\n\nラーナは時刻を確かめ、鍵を開けた。\n\n記録室には、油と紙の匂いが残っていた。\n\n作業所へ電話を入れる。\n\n「記録を取って戻る」\n\n『奥へ行くなよ』\n\n「聞いた」\n\n『ちゃんと聞いてた？』\n\nラーナは、返事の代わりに電話を切った。\n\n古い記録装置へ、読み取り機をつなぐ。\n\n最初の警告は、接続部を押さえると消えた。\n\nラーナは予備の線へ取り替えた。\n\nもう一度、読み込む。\n\n今度は警告が出ない。\n\nだが、水量の記録は、途中で飛んでいた。\n\n自分の道具の問題と、設備側の問題。\n\n二つが重なっている。\n\nラーナは昨日の控えへ印を付け、記録室の電話を取った。\n\nメフルダードの事務室へ、異常の場所と、確認する計器の番号を伝える。\n\n相手は、伝言を預かると言った。\n\nラーナは少し迷った。\n\n確認するのは、扉の先の、一番手前の計器だけ。\n\nそれなら、すぐに戻れる。\n\n奥の扉を開けると、水音が大きくなった。\n\n### 四　知らない人\n\n向こう岸に、青年がいた。\n\nラーナは扉の前で止まった。\n\n青年も、こちらに気づいた。\n\n薄い色の上着。作業者の印がない。\n\n彼はラーナを見てから、彼女の背後の扉を見た。\n\n「そこ、上へ戻れる？」\n\n「戻れるけど。そっち、入っちゃいけないんだけど」\n\n「ごめん。下りる方は開いてたんだ」\n\n青年は、自分の来た方を指した。\n\n「戻れないの？」\n\n「途中で閉じた。別の出口を探してる」\n\nラーナは手すりへ近づいた。\n\n水路を挟んだ向こう側にも、作業路がある。\n\n青年の方から、こちらへ渡る道は、ずっと先だった。\n\n「勝手に奥へ行かないで。仕事が終わったら、出口を教える」\n\n「分かった。ここで待つ」\n\n彼は、本当に止まった。\n\nラーナは計器の前へしゃがんだ。\n\n針が、ゆっくり動いている。\n\n昨日の値より高い。\n\n機器をつなぎ、記録する。\n\n「それ、上がってる？」\n\n青年が聞いた。\n\n「見えるの？」\n\n「赤いところへ近づいてる」\n\n「水が戻ってないの。入った量と、出た量が合わない」\n\nラーナは蓋の下を見た。\n\n上の系統から来る管に、弱い振動がある。\n\n自分の機器では、その値が安定しない。\n\n「そっちから、この箱の裏、見える？」\n\n青年は少し位置を変えた。\n\n「見える」\n\n「下の細い表示。消えたら言って」\n\nラーナが機器を動かした。\n\n「消えた」\n\n数値が跳ねた。\n\n差し込みを押さえる。\n\n「今は？」\n\n「点いてる」\n\nラーナは、唇を結んだ。\n\n昨日の控えにも、こちらの誤差が入っていた。\n\nそれを差し引いても、水位は上がっている。\n\n彼女は線を替え、確かな値だけを残した。\n\n青年が、水路の先を見た。\n\n「音、さっきからこうだった？」\n\nラーナは手を止めた。\n\n細い、硬い音が混じっていた。\n\n少し離れたところで、小石が跳ねた。\n\n二人とも、黙った。\n\nもう一つ、小石が落ちた。\n\nラーナは機器を外した。\n\n「戻る。あなたも、来た方へ」\n\n青年が頷いた。\n\nラーナは記録室の扉を振り返った。\n\nその足元から、水が出てきていた。\n\n＊\n\n最初は、靴を避ければ済むと思った。\n\n扉へ近づく間に、流れが速くなった。\n\n上の階段から、水が下りてきている。\n\nラーナは立ち止まった。\n\n戻れば、流れへ向かって上ることになる。\n\n階段の幅は狭い。踏み外せば、そこで止まれない。\n\n向こうで青年が何か言った。\n\n水音に消された。\n\nラーナは、口元へ手を当てた。\n\n「上が、だめ！」\n\n青年は頷き、周囲を見回した。\n\n自分の側の通路を数歩進み、曲がり角の向こうを見た。\n\nその姿が、壁に隠れた。\n\nラーナは、計器へ目を戻した。\n\n針は、もう赤いところへ入っていた。\n\nさっきの電話。\n\n記録室へ戻れば、助けを呼べる。\n\nラーナは水を踏み、入口の方へ向き直った。\n\n「戻らないで！」\n\n向こう岸から声がした。\n\n青年が戻ってきていた。\n\n彼の指は、入口ではなく、もっと奥の壁を指していた。\n\n背後で、水音が変わった。\n\n### 五　上を見ろ\n\n足が浮いた。\n\nラーナは手すりへ胸を押し付けた。\n\n上着が引かれる。\n\n鞄の紐が、首の横へ食い込んだ。\n\n手すりの金具が、また鳴った。\n\n「鞄、離して！」\n\n青年の声がした。\n\n機器が入っている。\n\n鍵も、記録も。\n\nそう思った瞬間に、次の水が来た。\n\nラーナは肩から紐を抜いた。\n\n鞄が流された。\n\n胸の圧迫が、一つ消えた。\n\n両足を壁へ押し当て、低い出っ張りを探す。\n\n靴底が、一度滑った。\n\n二度目に、何かへ掛かった。\n\nラーナは顎を上げた。\n\n青年が、向こうから叫んでいる。\n\n「君の左！　管が曲がってるところ！」\n\nラーナは左を見た。\n\n太い管が、水路をまたぐように曲がっている。\n\nその陰は暗かった。\n\n「何があるの！」\n\n「足場。壁に、段がある！」\n\nラーナは腕を伸ばした。\n\n届かない。\n\n「そこまで、行けない！」\n\n青年が、彼女の足元を見た。\n\n手すりの上流側の金具が、壁から抜けかけている。\n\n「つかまってるところ、上は離さないで。下の横棒は？」\n\nラーナは手の位置を変えず、膝を寄せた。\n\n水の中で、横棒へ靴が当たった。\n\n「ある！」\n\n「そこへ乗れる？」\n\n「……乗る」\n\nラーナは片足を掛けた。\n\n身体を上げる。\n\n膝が手すりの上へ出た。\n\n水が、上着の裾をたたいた。\n\n青年は、もう一段高い通路へ進んでいた。\n\nこちらを見下ろしている。\n\n「上の壁、四角い穴がある。そこから、細い段が下まで！」\n\nラーナは顔を上げた。\n\n配管の向こうに、小さな開口部があった。\n\n点検用だ。\n\n普段は暗く、ここから見えるとは思わなかった。\n\n管を支える受けの隣に、鉄の段が続いている。\n\n一つ下は、水に隠れていた。\n\n「あった」\n\n声が、ほとんど出なかった。\n\n青年が頷いた。\n\nラーナは手を伸ばした。\n\n最初の段へ、指が掛かった。\n\n引く。\n\n動かなかった。\n\n今度は、この金具を信じるしかなかった。\n\n腕へ体重を移した。\n\n片足を、手すりの上から離した。\n\n水が靴を引いた。\n\n歯を食いしばった。\n\nもう片方の手を上げる。\n\n二つ目の段。\n\n脚を曲げる。\n\n膝が、壁へぶつかった。\n\n痛みが走った。\n\nだが、足は段へ載った。\n\nラーナは身体を持ち上げた。\n\n背後で、手すりが大きな音を立てた。\n\n振り返らなかった。\n\n＊\n\n開口部の蓋は、押すと少し動いた。\n\n引き戸だった。\n\nラーナは指を掛け、横へずらした。\n\n動く。\n\n途中で止まる。\n\n溝に、古い屑が詰まっている。\n\n肘で身体を支え、腰の道具へ手を伸ばした。\n\n一つは流されていた。\n\nもう一つは、帯に留まっていた。\n\n短い金属片を隙間へ入れ、屑をかき出す。\n\n指が震えた。\n\n落とせば終わる、と思って、いったん手を止めた。\n\n深く息を吸う。\n\n吐く。\n\nもう一度、差し込む。\n\n向こう岸の青年が、口を動かしかけ、黙った。\n\n急がせなかった。\n\n蓋が動いた。\n\nラーナは工具を帯へ押し戻し、肩を穴へ入れた。\n\n肘をつく。\n\n身体を引く。\n\n腰が引っ掛かった。\n\n上着の裾を引き上げ、片脚を入れる。\n\n腹ばいになり、奥へ進んだ。\n\nようやく、両足が水から出た。\n\n＊\n\n中は、低い点検廊だった。\n\n水路を見下ろす隙間が、壁に沿って続いている。\n\nラーナは膝をつき、少し進んだ。\n\nすぐに立たなかった。\n\n床へ手をつく。\n\n冷たかった。\n\n動かなかった。\n\nそこで、ようやく息が出た。\n\n下では、まだ水が流れていた。\n\nだが、もう、身体を引かれてはいなかった。\n\n向こう側にも、同じ高さの退避廊がある。\n\n青年が、その入口から姿を見せた。\n\nラーナは彼を見た。\n\n彼は手を上げた。\n\n彼女も、手を上げようとした。\n\n腕が持ち上がらなかったので、頷いた。\n\n### 六　そこにいた人\n\nラーナは壁へ背を付けた。\n\n指が、なかなか開かなかった。\n\n青年は、水路を挟んだ向こう側で待っていた。\n\n「こっち、まだ水より上だ」\n\n彼が言った。\n\n「そっちの奥、出口はある？」\n\nラーナは後ろを見た。\n\n暗い廊下が続いている。\n\n角の上に、小さな点検灯があった。\n\n「あると思う。上の連絡路につながってる」\n\n「じゃあ、下へ戻らなくていい」\n\nラーナは頷いた。\n\nそれが分かっただけで、少し身体が軽くなった。\n\n膝を見る。\n\n上着と脚の間に、赤いものが付いていた。\n\n「けが、した？」\n\n「ぶつけた」\n\n「歩けそう？」\n\nラーナは足首を動かした。\n\n膝も、少し曲げる。\n\n「歩く」\n\n青年が頷いた。\n\n自分が何か言えば、彼女が歩けるようになると思っている顔ではなかった。\n\nその顔を見て、ラーナは少し安心した。\n\n「そっちは？」\n\n「平気」\n\n「……よかった」\n\n彼は答えなかった。\n\nラーナは水路へ目を向けた。\n\n下の流れは、さっきほど高くはなっていない。\n\n一時的に、どこかから大量に来たのかもしれない。\n\nだとしても、戻って確かめるつもりはなかった。\n\n「さっき、どうして見えたの」\n\n青年が顔を上げた。\n\n「あの段」\n\n「向こうの曲がり角へ行ったら、管の後ろが見えた。高いところに、乾いた布が引っ掛かってて」\n\nラーナは、開口部の脇を見た。\n\n古い布の端が、管へ巻き付いていた。\n\n普段の点検で、振動を抑えるためのものだった。\n\n「そこなら、水が来てないと思った。外へ出られるかは、分からなかったけど」\n\n「賭けたんだ」\n\n「戻る方よりは」\n\n彼は言いかけて、やめた。\n\nラーナは頷いた。\n\n怖くなかったとは、言ってくれなかった。\n\nそれでよかった。\n\n＊\n\n部屋の中で、電話が鳴った。\n\nサングラスを掛けた男が、受話器を取った。\n\n机の上に、通路の映像が出ていた。\n\n水の流れる場所と、その上に退避した二人。\n\n男は、別の画面へ視線を移した。\n\n『ミーシャ。接触は、まだ続いています』\n\n「接続元は」\n\n『確認中です』\n\n彼の指が止まった。\n\n「回線を切れ」\n\n＊\n\nラーナは立ち上がろうとして、壁へ手をついた。\n\n青年が、動きを止めた。\n\n「待って。急がなくていい」\n\n「出口まで、行かないと」\n\n「少し休んでからでいい。僕も、上へ戻る道を見たい」\n\nラーナは、もう一度座った。\n\n対岸は狭かった。\n\n青年の後ろには、 ーシャは待合室にいた。\n\n律は、彼から少し離れた椅子へ座った。\n\n上着の裂けたところを、指でつまむ。\n\nミーシャが聞いた。\n\n「相手に、名前を言われたか」\n\n「あの女、とだけ」\n\n「あなたの名前は？」\n\n「最初に、リツかって」\n\nミーシャは頷いた。\n\n端末へ何か書く。\n\n律は、その画面を見ようとはしなかった。\n\n「さっき、あの人に何て言ったんですか」\n\nミーシャの指が止まった。\n\n「やめろ、と」\n\n「知っている人だったんですか」\n\nミーシャは顔を上げた。\n\n「接続先に関わる者の可能性はある」\n\n「関わる？」\n\n「今は、断定できない」\n\n律は彼を見た。\n\n答えているようで、答えていない。\n\nそれは分かった。\n\nそれでも、彼は逃げずに残った。\n\n警察にも名を伝え、律が診察を受けるのを待っていた。\n\n他に、誰が事情を知っているか、律には分からなかった。\n\n彼は端末で会社の公開窓口を開き、ミハイロという名と役職を確かめた。\n\n身元は合っていた。\n\n合っていたことが、何を保証するかまでは、分からなかった。\n\nミーシャは、その確認を止めなかった。\n\n「身分を確かめるのは、正しい」\n\n彼は言った。\n\n律は、返事の代わりに、処置された手を見た。\n\n「何が、起きてるんですか」\n\nミーシャは端末を伏せた。\n\n「あなたが、どこまで接続したかを知りたい」\n\n律は顔を上げた。\n\n「知りたいことが、こっちと逆ですね」\n\nミーシャは笑わなかった。\n\n### 四　聞かれる順番\n\n秋山には、律から電話した。\n\n最初に、けがは大したことがないと伝えた。\n\n次に、警察へ話したと伝えた。\n\nそれでも、彼女はすぐに来た。\n\n待合室へ入るなり、律ではなく、ミーシャへ向き直る。\n\n会社と、氏名を確かめた。\n\nそれから、律へ言った。\n\n「今日は帰っていい」\n\n「話を聞きたいんです」\n\n「仕事の話じゃないでしょう」\n\n「だから、自分で」\n\n秋山は、裂けた上着を見た。\n\n口を開きかけ、閉じた。\n\n「じゃあ、一人で聞かない」\n\nミーシャは、場所を変えようと提案した。\n\n彼の会社の事務所ではなく、律たちの会社で。\n\n秋山は頷いた。\n\n＊\n\n事務所へ戻ると、展示の入口の模型が、机の上で回っていた。\n\n小さな人影が入っては、出てくる。\n\n律はその前を通り、打合せの席へ座った。\n\n秋山が、水を置いた。\n\nミーシャは向かいに座った。\n\n「まず、接続が切れる前に見たものを」\n\n通訳の声がした。\n\n律は、順番を変えた。\n\n「先に、僕を狙った人のことを聞きたいです」\n\nミーシャは彼を見た。\n\n「相手は、接触してはならないという考えを持っている可能性がある」\n\n「誰と、誰が？」\n\n「あなたと、向こう側の者が」\n\n「彼女にも、危険がある？」\n\nミーシャは、すぐには答えなかった。\n\n律は、もう一度聞いた。\n\n「僕が渡した記録で、彼女が誰か分かるんですか」\n\n「顔と、場所は映っている」\n\n胸の辺りが冷えた。\n\nラーナが自分から呼んだわけではない。\n\n道を間違えた律へ、帰れと言っただけだ。\n\n彼女の仕事場へ入り込んだのは、律だった。\n\nその記録を、知らない誰かへ渡したのも。\n\n「彼女のいる方へ、連絡できますか」\n\n「確認を進めている」\n\n「僕の報告が理由で、彼女に何かするなら、止めてください」\n\nミーシャは、一度、律の脇へ目を向けた。\n\n裂けた上着は、脱いであった。\n\n「あなた自身の安全も、考えてほしい」\n\n「考えてます。だから、何が起きてるかを聞いてるんです」\n\n秋山が、黙って椅子を引き寄せた。\n\nミーシャは、問いを変えた。\n\n「何か、受け取ったか」\n\n律は眉を寄せた。\n\n「さっきの男も、それを聞きました」\n\n「重要な点だ」\n\n「受け取ってません。ずっと、水路の反対側にいたので」\n\nミーシャの指が、わずかに止まった。\n\n「文字は見たか」\n\n「札なら」\n\n「ほかには」\n\n律は、壁の計器を思い出した。\n\nラーナの機器。\n\n管の番号。\n\n退避廊の、古い壁。\n\n「あるかもしれません。全部は覚えてない」\n\n「誰かに見せたか」\n\n「運営へ送ったもの以外は、まだ」\n\nミーシャは頷いた。\n\n質問の順番に、決まりがある。\n\nそう感じた。\n\n普通の事故調査なら、何を操作したか、何を壊したかを聞くのではないか。\n\nこの男は、何を知り、誰へ伝えたかを聞いている。\n\n律は端末を伏せた。\n\n「僕からも、一ついいですか」\n\nミーシャが頷いた。\n\n「ラーナは、誰かが演じている人なんですか」\n\n秋山が律を見た。\n\nミーシャは表情を変えなかった。\n\n「なぜ、そう思う」\n\n「僕が困っていても、自分の仕事をしてたからです。僕のために説明する人じゃなかった」\n\nミーシャは、しばらく黙っていた。\n\n「見えたものだけで、相手の事情を決めない方がいい」\n\n律は、その言葉を聞いた。\n\n正しかった。\n\n正しいことだけを言って、答えを避けていた。\n\n＊\n\nミーシャは、当面、同じ接続を試さないようにと告げた。\n\n安全を確かめ、話せる情報をまとめて連絡する。\n\n会社の窓口も示した。\n\n秋山が、その連絡先を受け取った。\n\n帰り際に、彼は律へ言った。\n\n「今日は、一人で帰らないでほしい」\n\n律は頷いた。\n\nそこは、逆らう理由がなかった。\n\n助けてくれたことには、礼を言った。\n\nミーシャは短く答え、事務所を出た。\n\n律は、その背中を見ていた。\n\n信用していい人だとは、まだ思わなかった。\n\n少なくとも、自分を襲った男よりは、話ができる。\n\nそのくらいの距離に、いったん置いた。\n\n### 五　送ったもの\n\n秋山が、ミーシャの置いていった連絡先を机へ置いた。\n\n「会社は、取引先で合ってる。設備の契約にも名前がある」\n\n律は頷いた。\n\n「ただ、事故調査の人が、街であなたを襲う人間と同時に現れた。そこは、偶然だったで済ませず、警察にも話しておこう」\n\n「話します」\n\n「今、電話して。その後で、送った記録を見よう」\n\n律は担当の窓口へ連絡し、ミーシャに聞いた説明を追加した。\n\n身元を調べてもらうことと、助けてもらったことは、別だった。\n\nどちらかを隠す必要はなかった。\n\n秋山は、律が話し終わるまで待った。\n\nその間に、隣室に人がいることへ気づいた。\n\nガラスの向こうで、女性が資料を閉じている。\n\n澪だった。\n\n四時から、展示の確認を頼んでいた。\n\n律は時計を見た。\n\n過ぎていた。\n\n「すみません。澪さんに――」\n\n「事情は伝えた。今日は確認をやめると言ってある」\n\n秋山が先に答えた。\n\n「帰ってもらってもよかったんだけど、けがの程度だけ、分かるまで待つって」\n\n律は椅子から立った。\n\n＊\n\n澪は、律の手を見てから、顔を見た。\n\n「大きなけがじゃなくて、よかったです」\n\n「すみません。待たせてしまって」\n\n「謝ることではないです。今日はやめましょう」\n\n律は頷いた。\n\n彼女は鞄へ資料を入れた。\n\n表紙に、今日見てもらう予定だった町の名前があった。\n\n海沿いの暮らし。\n\n港と、工房と、水門。\n\nその先で、何が起きたかを、彼女はまだ知らない。\n\n「一つだけ、聞いてもいいですか」\n\n澪の手が止まった。\n\n律は椅子へ戻り、彼女にも座ってもらった。\n\n「今日確認するはずだった場所で、予定にないところへ入ったんです。それで、会った人がいて」\n\n「出演者ですか」\n\n「分かりません。誰かが操作してるのかもしれない。でも、運営は、その区域を用意してないそうです」\n\n澪は、少し眉を寄せた。\n\n秋山が、運営から来た通知を出した。\n\n通常提供している体験内容ではない。\n\n調査中。\n\n律は、その二行を読んだ。\n\n「資料を作るとき、こういうところってありますか。町の中へ、仮の場所をつないでおくとか」\n\n澪は考えた。\n\n「制作途中なら、あります。別の資料から持ってきた建物や、まだ検証していない道を、仮に置くことは。ただ、公開する前には分けるはずですが」\n\n「それが、混ざった？」\n\n「実物を見ないと、何とも」\n\n律は端末を見た。\n\n全体を見せるべきではない。\n\nラーナの顔と声を、これ以上、知らないところへ配りたくなかった。\n\n建物だけなら、何か分かるかもしれない。\n\n律は、人が映っていない場面を選んだ。\n\n最初に水路へ出たときの、数秒。\n\n「顔や会話は、今は見せられないんです。ここだけで、地域や時代の見当はつきますか」\n\n澪は頷いた。\n\n律は画像を出した。\n\n水路。\n\n手すり。\n\n古い壁。\n\n澪の視線が、その一か所へ止まった。\n\n律は説明を続けかけ、やめた。\n\n彼女は画面を指で広げた。\n\n配管でも、計器でもない。\n\n壁の継ぎ目だった。\n\n途中で折れ、一段下がって、また続いている。\n\n「これ、どの資料から作ったんですか」\n\n澪が尋ねた。\n\n「分からないんです」\n\n彼女は、もう一度壁を見た。\n\n「ここへ入った経路は、残っていますか」\n\n律は、履歴の空白を出した。\n\n澪の顔が、少し変わった。\n\n名前のない場所を見て、驚いたというより、そこへ何かを書き込みたいような顔だった。\n\n「その先は？」\n\n彼女が聞いた。\n\n「水が来ました」\n\n「いえ、壁の向こう側です。そちらの映像はありますか」\n\n律は、記録を進めた。\n\nラーナが出る直前で止める。\n\n壁の先は、画面から切れていた。\n\n「ここまでです」\n\n澪は頷いた。\n\nすぐに、もう一度聞いた。\n\n「上へ行ったときは？」\n\n律は彼女を見た。\n\n退避した話は、まだしていなかった。\n\n澪も、それに気づいた。\n\n「壁沿いに、上の点検廊がありませんでしたか」\n\nゆっくり言い直した。\n\n律は頷いた。\n\n「ありました」\n\n彼女は何も言わなかった。\n\n律は最後の場面を開き、ラーナを画面の外へ除いた。\n\n白い壁と、水路の上の空間。\n\n澪は、それを見つめた。\n\n＊\n\n律は、机の上で手を組んだ。\n\n処置されたところが、引っ張られた。\n\n今日まで、彼女は、歴史に詳しい監修者だった。\n\n画像を見せれば、何かの時代や地方の名前を答えてくれると思っていた。\n\n今は、その彼女が、律の説明していない道を知っていた。\n\n「ここ、知ってるんですか」\n\n澪は、すぐには答えなかった。\n\n秋山も黙っていた。\n\n廊下で、人が通った。\n\nいつもの事務所の音だった。\n\nその音の中で、澪が聞いた。\n\n「この壁を、反対側から見たいんです。もう一度、そこへ行く方法を探せますか」\n\n律は端末へ目を落とした。\n\n再接続できない区域。\n\n何を持って帰ったかと尋ねた襲撃者。\n\n文字を見たかと尋ねたミーシャ。\n\nそして、見ていないはずの道を知っている澪。\n\n全部が同じことにつながっているとは、まだ限らない。\n\nだが、別々の話として片づけられるとも、思えなかった。\n\n「探します」\n\n律は言った。\n\n「でも、先に確かめたい人がいます」\n\n澪が顔を上げた。\n\n「一緒に、水から逃げた人です。彼女が無事で、話していいと言うなら」\n\n澪は、ゆっくり頷いた。\n\n「分かりました」\n\n律は連絡先を開いた。\n\nミーシャの名前があった。\n\n彼が何を知っているか、聞きたい。\n\nただ、今ここで澪が話したことまで、一度に渡す必要はなかった。\n\nまず、ラーナは無事か。\n\nそれを、律は書いた。\n\n### 六　救助のあと\n\nミーシャは、事務所へ戻る車の中で通知を受け取った。\n\n律からだった。\n\n彼は最後まで読み、端末を下ろした。\n\n前の席の男が、別の通話をつないだ。\n\nミーシャは受話器を取った。\n\n『終わりました』\n\n相手が言った。\n\n昼間、店の前にいた男の声だった。\n\nミーシャは窓の外を見た。\n\n「彼へ、もう一度近づくな」\n\n『何も受け取っていないと言っていました』\n\n「本人から聞いた」\n\n『では、こちらの役は』\n\n「終わりだ」\n\nミーシャは、少し間を置いた。\n\n「命じた範囲から外れたことは、後で聞く」\n\n向こうが黙った。\n\n『あの男は、逃げるより先に、女の名前へ反応しました』\n\n「何と呼んだ」\n\n『口にはしませんでした。何か言いかけて、やめた』\n\nミーシャは目を閉じた。\n\n律の顔を思い出した。\n\nラーナをどうするつもりかと聞いたときの顔。\n\n恐怖が収まっていないのに、そちらを先に尋ねた。\n\n「これからは、私が聞く」\n\n彼は言った。\n\n通話を切る。\n\nしばらく、次の操作をしなかった。\n\n窓の向こうを、人が歩いていた。\n\n誰も、自分がその歩道で何を起こしたかを知らない。\n\nミーシャは、律の体験記録を開いた。\n\n水路の上に、二人がいた。\n\n向こう側と、こちら側。\n\nまだ、お互いの名前も知らない二人。\n\n彼は、その場面を止めた。\n\n律へ送る返事の欄には、何も書かれていなかった。\n\n---\n\n*第二部・了*\n\n---\n\n## 第三部　呼び戻す者\n\n### 一　消えた人の名前\n\n点検廊の出口は、内側から開いた。\n\nラーナは蓋を押し、腕を外へ出した。\n\n誰かが叫んだ。\n\n足音が来た。\n\n今度は、手が届いた。\n\n引き上げられ、乾いた床へ座らされたところで、膝の痛みが戻ってきた。\n\n作業所の同僚だった。\n\n彼はラーナの顔と、その後ろの穴を交互に見た。\n\n「何人いる」\n\nラーナは振り返った。\n\n「向こう側に、一人」\n\n同僚が壁の連絡器を取った。\n\nラーナは、その腕へ手を掛けた。\n\n「でも、いなくなった」\n\n彼が顔を向けた。\n\n「流されたのか」\n\n「違う。水より上にいた。話してた」\n\n自分でも、上手く説明できなかった。\n\n同僚は、それ以上聞かなかった。\n\n連絡器へ、対岸の退避廊も確認するよう伝える。\n\nラーナは、壁へ頭を付けた。\n\n目を閉じると、青年の顔があった。\n\nリツ。\n\n名前を聞いておいて、よかった。\n\nそう思った後で、何の役に立つのか分からなくなった。\n\n＊\n\n確認の人間が来た。\n\n水の入った場所と、まだ通れる場所。\n\n壊れた手すり。\n\nラーナが出てきた点検廊。\n\nメフルダードも来た。\n\nラーナの前へしゃがみ、最初に歩けるか聞いた。\n\n彼女が頷くと、今度は、誰が一緒にいたかを尋ねた。\n\n「リツという人」\n\nメフルダードの顔が止まった。\n\nほんの少しだった。\n\nラーナは見逃さなかった。\n\n「知ってるの？」\n\n「どこで、その名前を」\n\n「本人から聞きました。今、そう言ったでしょう」\n\nメフルダードは彼女の後ろを見た。\n\n壁際に、もう一人、男が立っている。\n\n式の日に、上の席へ座っている男だった。\n\n彼が、一歩近づいた。\n\n「何を受け取りました」\n\nラーナは顔を上げた。\n\n「何も」\n\n「言葉でも、物でも」\n\n「逃げる場所を教えてもらった」\n\n男は、メフルダードを見た。\n\nラーナは、二人の間を見た。\n\n「いたんでしょう、あの人。私だけに見えたんじゃないんでしょう」\n\n返事の前に、別の係が来た。\n\n対岸の廊下に、誰もいなかった。\n\n外へ出た人間も確認できない。\n\n上の席の男が、声を落とした。\n\n「接触について、ここで話を広げないように」\n\nラーナは、自分の手を見た。\n\n指の間に、手すりの錆が残っている。\n\n膝は、まだ痛かった。\n\n「話を広げる前に、あそこへもう一度、人が入らないようにしてください」\n\nメフルダードが頷いた。\n\n「それは、やっている」\n\n「じゃあ、次に。何が起きたのか、私にも教えてください」\n\n上の席の男が、口を開きかけた。\n\nメフルダードが先に答えた。\n\n「水の記録を確認する。あなたも、覚えていることを書いてほしい」\n\n「機器、流されました」\n\n言ってから、喉の奥が詰まった。\n\nさっきは、捨てなければ生きていられなかった。\n\n今は、自分が何を確かめたか、誰にも見せられない。\n\n男が言った。\n\n「では、まずは、あなたの話として」\n\nラーナは彼を見た。\n\nその言い方を、覚えておこうと思った。\n\n＊\n\n家へ戻ると、母が待っていた。\n\n何をしていたのかとは、すぐに聞かなかった。\n\n濡れた靴を見て、腰掛けを出す。\n\nラーナが座ると、片方の靴を、ゆっくり脱がせた。\n\n「戻ってきたから、怒るのはあとにする」\n\n母が言った。\n\nラーナは顔を上げた。\n\n母は笑っていなかった。\n\n靴の中から、水が床へ落ちた。\n\n「ごめん」\n\nその言葉だけは、すぐに出た。\n\n母は頷き、濡れた靴を脇へ置いた。\n\n### 二　答えを待たない\n\n東京では、ミーシャから、まだ返事が来ていなかった。\n\n律は端末を机へ置いた。\n\n澪と秋山が、隣にいた。\n\n「待つ間に、できることはあると思います」\n\n律が言うと、澪が顔を上げた。\n\n「ただ、僕が知らないことを、先に教えてください。どうして、上の廊下を知ってたんですか」\n\n澪は、鞄から薄い紙挟みを出した。\n\nすぐには開かなかった。\n\n律は待った。\n\n「壁に、見覚えがあります」\n\n「どこの壁ですか」\n\n「場所を、まだ地図の上で示せません」\n\n秋山が、わずかに椅子を動かした。\n\n律は、澪の顔を見た。\n\n「それは、分からないんですか。それとも、言えないんですか」\n\n澪は、少し考えた。\n\n「地図の上では、分かりません。覚えている道はあります。ただ、それを今の地名へ置き換えられていないんです」\n\n彼女は紙挟みを開いた。\n\n鉛筆で描いた図があった。\n\n道らしい線が二本。\n\n壁の折れ。\n\n高さの違う、四角い形が二つ。\n\n律は、退避したときの画像を隣へ置いた。\n\n同じだとは、まだ言えない。\n\nだが、澪の指は、画像に隠れた先を指していた。\n\n「壁の向こうに、低い台があります。二つ。一方は、少し高い」\n\n「それを、見たいんですね」\n\n「はい」\n\n「なかったら？」\n\n「私の考えを、見直します」\n\n律は頷いた。\n\n信じろと言われるより、その返事の方が、今は頼りになった。\n\n秋山が、紙の端の日付を見た。\n\nかなり古かった。\n\n澪は隠さなかった。\n\n「描き直したものです。もっと前のものもあります」\n\n律は、それを調べるのは後にした。\n\n目の前には、確かめられる形の手掛かりがある。\n\nその前に、確かめたい相手がいる。\n\n彼は、接続の履歴へ戻った。\n\n＊\n\n記録の再生はできた。\n\n同じ場所への接続は、できなかった。\n\n履歴にある空白の区域を選んでも、利用できないと返ってくる。\n\n律は、一つ前の水門を選んだ。\n\n画面に、接続の準備が出た。\n\n秋山が、手を上げた。\n\n「今は、何をするつもり？」\n\n「入った道が、どこで止められてるか見ます」\n\n「一人ではやらない」\n\n「はい」\n\n律は自分の接続具を机へ置き、表示を共有した。\n\n会社の展示用設備は使わなかった。\n\n澪が、紙を手元へ寄せた。\n\n律は接続した。\n\n水門には、昨日と同じ作業員がいた。\n\n昨日ではない。\n\n数時間前だ。\n\nその短さを、今になって思った。\n\n作業員は律を見ると、手を振った。\n\n「戻ってきたんだね。どうだった？」\n\n「東で、水が来た」\n\n作業員の眉が寄った。\n\n「東のどこ？」\n\n律は説明した。\n\n計量所。\n\n二本の通路。\n\n水路。\n\n作業員は首をかしげた。\n\n知らないのだった。\n\n律が地図を出すと、そこには、東の計量所がなかった。\n\n染織工房の裏は、倉庫で終わっていた。\n\n律は工房へ回った。\n\n階段はある。\n\n扉もある。\n\nだが、その先へ進もうとすると、視界の端へ案内が出た。\n\n《この先の環境は提供されていません》\n\n扉を開けることも、できなかった。\n\n律は、触れたつもりの手を下ろした。\n\nこの扉の先から、彼は入った。\n\n今は、町の図からも、その先が抜け落ちていた。\n\n「澪さん、見えてますか」\n\n「はい」\n\n「町の中の人には、起きたことが伝わってません。ここから先だけ、切り離されてる」\n\n澪は少し黙った。\n\n「その壁の方へ、もう少し向けてください」\n\n律は顔を動かした。\n\n「違います。今見ているこの町には、私の知っている壁がない」\n\n彼女は言った。\n\n「入口を境に、別の資料へ切り替わっています」\n\n律は、閉じた扉を見た。\n\n同じ町の続きだと思ったから、入った。\n\nその前提から、確かめ直す必要があった。\n\n### 三　なくした記録\n\nファリデが来たとき、ラーナは乾いた服へ着替えていた。\n\n膝には布が当ててある。\n\nファリデは、顔を見てから、机へ紙を置いた。\n\n配水の記録だった。\n\n「今朝から、こっちへ来た分」\n\nラーナは椅子を寄せた。\n\n「上は？」\n\n「上の分は、出てこない」\n\nファリデは、別の紙を出した。\n\n浸水についての、最初の報告。\n\n立入りを控えるよう指示した区域で、水があふれた。\n\n原因は調査中。\n\n被害を受けた機器と、通路。\n\nラーナは、最後まで読んだ。\n\n「私が、何か動かしたことになってる？」\n\n「まだ、そうは書いてない。だから、そうなる前に、何をしたか残す」\n\nファリデは、空いた紙を置いた。\n\nラーナは筆記具を取った。\n\n記録を読んだ。\n\n接続の悪い線を替えた。\n\n奥の扉を開けた。\n\n計器へつないだ。\n\nそこまで書き、手を止めた。\n\n「図が、違ってた」\n\nファリデが顔を上げた。\n\n「上の管が、記録の図には載ってなかった。そこから、音がした」\n\n「どの管？」\n\nラーナは描いた。\n\n水路の上を通り、途中で曲がる、太い管。\n\nその下に、計器。\n\nファリデが、自分の図と比べた。\n\n「その戻り、こっちへ来るはずだった」\n\n「来てない」\n\n「ええ」\n\n二人は、紙を見た。\n\n閉鎖することと、水が増えることは、同じではない。\n\n誰かが、どこかで流れを変えた。\n\n故障なのか、作業なのか。\n\nそれを知りたかった。\n\nラーナは、紙の端へ、もう一人いたことを書いた。\n\n対岸の青年。\n\n水の来る前から、そこにいた。\n\n「その人に、見たことを聞ける？」\n\nファリデが尋ねた。\n\n「分からない。どこから来たのかも」\n\n「名前は？」\n\n「リツ」\n\nファリデは、その名を紙へ書いた。\n\nそこだけ、聞こえた音を写した、不慣れな形になった。\n\nラーナは、その字を見た。\n\nどこかに、本人がいる。\n\nその人は、こちらで何が起きたかを見ていた。\n\n自分の機器が流れても、向こうが見たものまでは、流れていないかもしれない。\n\n＊\n\n同僚が、貸し出した工具を取りに来た。\n\nラーナが無事か確かめに来たのだと、本人は言わなかった。\n\n「上から、呼ばれるらしいぞ」\n\n彼は、戸口で言った。\n\n「何の話？」\n\n「おまえが会った人のこと。連絡室の係が、写真を持ってた」\n\nラーナは顔を上げた。\n\n「写真？」\n\n「知らない男の顔。服が普通じゃない。見かけた人間がいないかって」\n\nファリデも、同僚を見た。\n\n「連絡室は、どこが使ってるの」\n\n「今は、上の担当。機械を入れ替えたときから」\n\nラーナは母を見た。\n\n母は、二人の紙を読んでいた。\n\n娘が立ち上がる前に、口を開いた。\n\n「今日は、もう濡れるところへは行かないで」\n\n「行かない」\n\nラーナは答えた。\n\nそれから、少し考えて付け加えた。\n\n「誰かに知らせてから、行く」\n\n母はファリデを見た。\n\nファリデが頷いた。\n\n「私も、一緒に行く」\n\n### 四　呼ぶ側の部屋\n\n連絡室の扉は、閉まっていなかった。\n\n中で、係が配線を取り替えていた。\n\n床に、外した板が重ねてある。\n\nその奥に、低い台と、椅子が三つ。\n\nラーナは、式の前に人が集まる部屋だと知っていた。\n\n仕事で入ったのは、初めてだった。\n\nファリデが係へ、配水の記録を取りに来たと伝えた。\n\n係は、ラーナを見た。\n\n顔を知っているようだった。\n\n本人より先に、何かが来ている。\n\nその理由は、机の上にあった。\n\nリツの写真。\n\n薄い色の上着を着て、少し上を見ていた。\n\n「その人」\n\nラーナは言った。\n\n係は写真を裏返しかけた。\n\nラーナは手を伸ばした。\n\n押さえはしなかった。\n\nただ、彼の手と、写真を見た。\n\n「水が来たとき、私と一緒にいた人です」\n\n係が手を止めた。\n\n「聞いています」\n\n「だったら、その写真を、私に見せない理由はないでしょう」\n\n係は、ゆっくり写真を置いた。\n\nファリデが、横からのぞいた。\n\n「その人は、今、どこにいるの」\n\n「こちらには、いません」\n\n「それは分かる。だから聞いてる」\n\n係は、返事に困った顔をした。\n\n壁の電話が鳴った。\n\n彼は、そちらへ逃げるように受話器を取った。\n\nラーナは机の画面を見た。\n\n写真と同じ青年の顔が、そこにもあった。\n\n横に、小さな印。\n\n応答待ち。\n\nその下に、今日の時刻が二つ。\n\n最初は、計量所で彼と会ったころ。\n\n次は、名前を言いかけて、消えたころ。\n\nラーナは一歩、画面へ近づいた。\n\n通話中の係が、こちらを見た。\n\n「触らないでください」\n\n「ここから、話せるの」\n\n係は、受話器を押さえた。\n\n「担当が、確認しています」\n\n「見たことを、聞きたい。その人も水路を見た。私の機器は流れたけど、その人の見たものが残っていたら――」\n\n受話器から、声がした。\n\n係は、もう一度耳へ当てた。\n\n何度か頷く。\n\n「ええ。います。本人が」\n\nラーナの方を見た。\n\n「はい。ファリデさんも」\n\n返事を聞き、姿勢を直した。\n\n「ミーシャへ、お伝えください」\n\n聞き慣れない音だった。\n\nラーナは、その音を覚えた。\n\n係は電話を切った。\n\n「接触の確認をします。相手が応答すれば、短い時間ですが」\n\nラーナは、写真を見た。\n\n待っていれば戻ってくるのではない。\n\nここから、呼べる。\n\n「誰が話すの」\n\n「まず、担当が」\n\n「その人が見たものを知ってるのは、私です」\n\n係が答える前に、ファリデが紙を置いた。\n\n上から来た量と、戻ってこなかった量。\n\n「この確認もしてもらう。何を聞いたかは、私も記録する」\n\n係は、二人の顔を見た。\n\n受話器を見た。\n\n次の指示を待ちかけた。\n\nその前に、画面の印が変わった。\n\n接続準備。\n\nラーナは、椅子ではなく、立っている場所を確かめた。\n\nあの人が、どこへ現れるのかを。\n\n＊\n\n東京では、律の端末に通話が来ていた。\n\nミーシャだった。\n\n「ラーナは無事だ」\n\n最初に、そう言った。\n\n律は椅子の背から身体を離した。\n\n「本人と話したんですか」\n\n「現地の担当から、確認を取った」\n\n「直接、話せますか」\n\n「今、試行を準備している。相手も、あなたへ聞きたいことがある」\n\n律は秋山と澪を見た。\n\n二人とも、通話を聞いていた。\n\nミーシャの声が続いた。\n\n「会話は、こちらでも確認する」\n\n律は頷いた。\n\n「彼女に、そちらも聞いていると伝えてください」\n\n「伝える」\n\n「こちらにも人がいます。先ほどの職場です」\n\n「分かった」\n\n律は接続具を取った。\n\n澪が、紙を机の上へ置いた。\n\n壁と、その向こう。\n\n律はそれを見てから、顔を上げた。\n\n「まず、彼女の話を聞きます」\n\n澪は頷いた。\n\n通話が切れ、接続の要求が来た。\n\n律は、今度は自分で、応答を選んだ。\n\n### 五　返してほしいもの\n\n水の音がしなかった。\n\n律は周囲を見た。\n\n部屋だった。\n\n台と、椅子。\n\n配線の出た箱。\n\n床の一部だけ、色が違う。\n\nその先に、ラーナがいた。\n\n立っていた。\n\n膝の辺りに、布が当ててあった。\n\n律は彼女を見たまま、息を吐いた。\n\n「よかった」\n\n声が出た。\n\nラーナは、少し顔を上げた。\n\n「生きてる？」\n\n律は驚いた。\n\n「え？」\n\n「あなたが。あの後、どこへ行ったか、誰も知らなかったから」\n\n律は頷いた。\n\n「生きてる。急に、こっちとの接続が切れた」\n\n「接続」\n\n彼女が言い直した。\n\n律が部屋を見回すと、係が一人、画面の前にいた。\n\nもう一人の女性が、紙を持って立っている。\n\nその人も、律を見ていた。\n\n物珍しいものを見るだけの顔ではなかった。\n\n使えるかどうか、見ている顔だった。\n\n「今日は、こっちから呼んだ」\n\nラーナが言った。\n\n「見てる人がいるんだって。あなたの方にも」\n\n「いる」\n\n律は答えた。\n\n「ここにも、一緒に見てる人がいる。場所のことが分かるかもしれない人」\n\nラーナは、係を見た。\n\n係が何か言いかける前に、律へ向き直った。\n\n「分かった。それより、返してほしいものがある」\n\n律は手を下ろした。\n\n何も持っていない。\n\n「何を？」\n\n「見たもの。水が来る前の、計器」\n\nラーナは、流された機器のことを話した。\n\n記録がなくなった。\n\n自分が何をしていたかは話せるが、見ていた値を、誰にも示せない。\n\n「あなたが見てたなら、残ってない？」\n\n律は、体験記録を呼び出した。\n\nラーナに見える場所には出なかった。\n\n彼女が、彼の顔を見ている。\n\n律は、表示を脇へ寄せる癖を止めた。\n\n「残ってる。今、探してる」\n\nラーナの肩が、少し下がった。\n\n係が、机から声を掛けた。\n\n「こちらへ、画像を送れますか」\n\n視界の端に、送付先が出た。\n\n律は記録を戻した。\n\nラーナがしゃがむ。\n\n箱を持ち上げる。\n\nその向こうの計器が、短い間だけ映っている。\n\n律は止めた。\n\n「これ？」\n\n画像を送る。\n\n係の画面へ届いた。\n\nラーナが駆け寄った。\n\n彼女の口から、短い声が漏れた。\n\n「そう。これ」\n\n隣の女性も、近づいた。\n\nラーナは記録紙へ、数字を書き写した。\n\n「その少し前は？」\n\n律は戻した。\n\n「止めて」\n\n別の画像を送る。\n\n上の管と、小さな表示が映っていた。\n\n女性が、ラーナの紙を指した。\n\n二人の間で、律の知らない言葉が交わされた。\n\n訳が追いつく前に、二人は同じ場所を見ていた。\n\n「何が、分かったの？」\n\n律が聞いた。\n\nラーナは画像を指した。\n\n「上の系統が、切替中になってる。私が何かする前から」\n\n女性が言った。\n\n「この分は、こっちへ戻るはずだった。来ていない」\n\nラーナは頷いた。\n\n「水が来たのは、私の計器の故障だけじゃない」\n\n係が立ち上がった。\n\n「その記録は、こちらで預かります」\n\nラーナは書き終えた紙を持った。\n\n「写しを、作業所にも残します」\n\n係は、少し黙った。\n\n女性が彼を見た。\n\n「同じ水を、こっちも使ってるの。原因を知らずに、明日の量を決められない」\n\n係は座り直し、画像を紙へ出した。\n\nラーナは、それを受け取った。\n\n流されたものと、同じものではない。\n\nそれでも、自分の手元へ、記録が戻ってきた。\n\n彼女は律を見た。\n\n「ありがとう」\n\n今度は、彼の方が、少し遅れて頷いた。\n\n＊\n\n「あなたも、何か聞きたい？」\n\nラーナが言った。\n\n律は、彼女の膝を見た。\n\n「けがは？」\n\n「歩ける」\n\n「ちゃんと、見てもらった？」\n\n「母に、すごく」\n\n律は少し笑った。\n\n笑ってから、昼間の男の顔が戻ってきた。\n\nラーナが、彼の手を見た。\n\n「そっちも、けが？」\n\n「少し」\n\n「水のところで？」\n\n律は首を振った。\n\n「戻ってから、人に襲われた」\n\nラーナが動かなくなった。\n\n隣の女性も、顔を上げた。\n\n「誰に」\n\n「知らない人。君から、何を受け取ったか聞かれた」\n\nラーナは、係へ顔を向けた。\n\n係は何も言わなかった。\n\nその沈黙だけで、律は、彼女にも同じ質問があったのだと分かった。\n\nラーナが小さく聞いた。\n\n「どうして、そんなことを」\n\n「分からない」\n\n律は答えた。\n\n「でも、僕がここへ入ったことに、関係してると思う」\n\n「私は、何も渡してない」\n\n「分かってる」\n\nラーナは彼を見た。\n\nその返事で、ようやく口元の力が少し抜けた。\n\n律は、次の言葉を考えた。\n\nここが作り物の場所で、彼女は誰かが演じている人なのかもしれない。\n\nそれでも、目の前で記録を取り返し、母に怒られ、知らない誰かに疑われている相手へ、役の説明を求める気にはなれなかった。\n\n先に、知りたいことがあった。\n\n「水が来た理由、調べるんだよね」\n\nラーナが頷いた。\n\n「僕に見えるものは、返す。ほかにも、欲しいところがあれば言って」\n\n彼女は、受け取った紙を折った。\n\n「じゃあ、私が知ってることも、話す」\n\nそう言ってから、短く息を吸った。\n\n「あなたがいなくなるのは、この機械を使ってる人が、切るからだって」\n\n律は係を見た。\n\n彼は、画面を見ていた。\n\nラーナが続けた。\n\n「ミーシャ、って人が、指示を出すんだって」\n\n律は、彼女の顔へ目を戻した。\n\nその名を、ラーナも知っている。\n\n昼間、目の前へ現れた男が、こちら側にもいる。\n\n隣の澪が、息を止めた気配がした。\n\n### 六　壁の裏へ\n\n係が、残り時間を告げた。\n\nラーナは振り返った。\n\n「まだ、聞きたいことがある」\n\n「接触は、定めた時間で」\n\n「設備の記録を、戻してもらってるところです」\n\n彼女は、紙を持ち上げた。\n\n係は、電話へ手を伸ばした。\n\n律は、それを見ながら、ラーナへ聞いた。\n\n「今、言った名前。その人と、会ったことは？」\n\n「ない。声も、直接は聞いてない」\n\n律は頷いた。\n\n自分が助けられた話を、どこまで言うか迷った。\n\nその間に、耳元へ澪の声が来た。\n\n「律さん。一つ、聞いていただけますか」\n\n彼は顔を少し動かした。\n\nラーナも、それに気づいた。\n\n律は隠さずに伝えた。\n\n「一緒に見てる人から、質問がある。あの退避廊の壁の向こうへ、行けるかって」\n\n「何を見たいの？」\n\n「低い台。二つあるか、確かめたい」\n\nラーナが眉を寄せた。\n\n隣の女性が、顔を上げた。\n\n「木材を置いてるところ？」\n\nラーナが振り返った。\n\n女性は、二人の顔を見た。\n\n「東の物置の、古い床。片方だけ高くなってるでしょう。あそこ？」\n\n澪の声が来なかった。\n\n律は、少し待った。\n\n「澪さん？」\n\n「……その場所を、見たいです」\n\n今度の声は、ラーナにも聞こえるように送った。\n\n彼女は、初めて聞く声へ目を上げた。\n\n誰もいない、律の肩の辺りを見た。\n\n「ファリデさんなら、入れる」\n\n彼女は言った。\n\nファリデが、係を見た。\n\n「物置は、さっき点検が終わった。通れるのは、乾いた方の道だけ。あの人の映る場所を、そっちへ替えられる？」\n\n係は、返事をしなかった。\n\n受話器を耳へ当てる。\n\n律は、視界の端の表示を見た。\n\n利用時間は、もうほとんど残っていなかった。\n\n次の表示が出る。\n\n《接続先を変更します》\n\n係が、ゆっくり受話器を置いた。\n\n「点検用の場所へ、移します。現地の機器には、触れないように」\n\nラーナは、律を見た。\n\n彼も、その条件の意味を、完全には知らなかった。\n\nここにいるように見えるのに、触れないものがある。\n\n彼女が膝をぶつけた壁と、彼の立っている床は、同じではないかもしれない。\n\nラーナは、ファリデに続いた。\n\n「行こう。下へは戻らないから」\n\n＊\n\n律の景色は、一度暗くなった。\n\n次に見えたのは、壁際の狭い廊下だった。\n\nラーナはまだ、そこにいなかった。\n\n数秒後、角から二人が現れた。\n\nラーナが律を見て、立ち止まった。\n\n「先に来てる」\n\n律は後ろを見た。\n\n通ってきたはずの道は、分からなかった。\n\nファリデは彼を見て、何も言わずに鍵を出した。\n\n物置の戸を開ける。\n\n中には、板と、角材と、古い容器が積まれていた。\n\n律が近づくと、移動できる範囲の端が光った。\n\nそこより奥へは、行けなかった。\n\n「ここまでしか、見られない」\n\n律が言うと、ラーナは振り返った。\n\n「だったら、そこで待ってて」\n\n彼女は、ひざの痛まない方へ体重を掛け、棚の横を抜けた。\n\nファリデが荷物を一つ、移した。\n\n低い石の部分が見えた。\n\nその奥に、もう一つ。\n\n高さが、違った。\n\n律は、自分の隣の空間を見た。\n\nそこには、誰も映っていない。\n\nでも、澪が見ている。\n\n返事が来る前に、それが分かった。\n\n彼女の息が、急に浅くなった。\n\n「ありましたね」\n\n律は言った。\n\n「はい」\n\n短い声だった。\n\nラーナが、石の台を見た。\n\n「これを、どこで知ったの？」\n\n律も、同じことを聞きたかった。\n\n澪は、すぐには答えなかった。\n\nラーナは、荷物をもう一つ動かした。\n\n下の壁へ、灯りが当たる。\n\n文字があった。\n\n手書きの札ではない。\n\n石へ、直接刻まれていた。\n\n「この字、今のと少し違う」\n\nラーナが言った。\n\n「古い式の言葉だって聞いたことがあるけど」\n\n律の視界の補助が、文字の周りへ枠を作った。\n\n《判読できません》\n\n澪が言った。\n\n「灯りを、少し右へ」\n\nラーナは律を見た。\n\n彼が頷くと、灯りを動かした。\n\n「何て書いてあるの？」\n\nラーナが聞いた。\n\n澪は、文字を追っていた。\n\nやがて、静かに口を開いた。\n\n「この先は、家の中。供え物は、外へ置くこと」\n\nラーナは灯りを下ろしかけた。\n\n「家？」\n\n「はい」\n\n澪は答えた。\n\n「ここへ来る人が、物を渡すときの、注意書きです」\n\nファリデが壁を見た。\n\n「物置にする前から、誰かの家だったとは聞いてる。でも、そんな昔の字まで読めるの」\n\n澪は答えなかった。\n\n律の視界へ、別の通知が出た。\n\n《音声接続》\n\nミーシャの声がした。\n\n「今、読んだのは誰だ」\n\n律は身体を固くした。\n\nラーナも顔を上げた。\n\n同じ声が、こちらにも届いている。\n\n彼女の方は、初めて聞く声だった。\n\n「一緒にいる人です」\n\n律は答えた。\n\n「名前を聞きたい」\n\n「どうして」\n\n「その文字について、話したい」\n\n律は黙った。\n\n助けてもらった相手だった。\n\nこちらのことを、何も知らない相手でもなかった。\n\nだからといって、隣にいる人の名前を、自分が渡す理由にはならない。\n\n澪が、先に言った。\n\n「私から、ご連絡します。今の映像は、保存してください。壁と、台の位置が分かるものを」\n\nミーシャは、少し黙った。\n\n「話せる時間は」\n\n「今夜でも」\n\n「では、接続が終わった後に」\n\n律は、残り時間の表示を見た。\n\n終わる直前だったはずの数字が、変わっていた。\n\n話す相手が見つかると、時間は増える。\n\n律は、そのことを覚えた。\n\n### 七　読めないはずの本\n\n接続が終わる前に、ラーナが律を呼んだ。\n\n石の台から、少し離れた場所だった。\n\n「今度も、急に消えるの？」\n\n「先に、言う」\n\n律は答えた。\n\nミーシャの声は、もう聞こえなかった。\n\n聞いていないとは、限らない。\n\nそのことは、二人とも分かっていた。\n\nラーナは紙を持ち直した。\n\n「今日の記録は、こっちで残す。ファリデさんも持つ」\n\n「僕の方にもある」\n\n「あなたに聞かないと分からないことが、また出るかもしれない」\n\n「そのときは、呼んで」\n\nラーナは、少しだけ口元を動かした。\n\n「呼ぶのにも、いろいろあるの。今日、分かった」\n\n「こっちも」\n\n二人は、短く笑った。\n\n水から逃げたときとは違う、短い息だった。\n\nラーナが、彼の手を見た。\n\nまだ、白いものが巻いてある。\n\n「一人で、知らない人に会わないで」\n\n律は頷いた。\n\n「君も、濡れるところへ、一人で行かないで」\n\nラーナは、自分の膝を見た。\n\n「言われた」\n\n「誰に？」\n\n「母」\n\n律は、少し笑った。\n\n終わりの表示が出た。\n\n彼はラーナへ顔を向けた。\n\n「そろそろ、切れる。僕から、戻る」\n\nラーナは頷いた。\n\n彼が手を上げると、彼女も上げた。\n\n今度は、返事を見てから、接続を終えた。\n\n＊\n\n会社の会議室は、暗くなりかけていた。\n\n秋山が灯りを足した。\n\n律は接続具を外した。\n\n澪は、まだ画面を見ていた。\n\n保存した壁の文字が、出ている。\n\n律は端末を手元へ寄せた。\n\n「さっきの字、こちらでは読めない表示でした」\n\n澪が顔を上げた。\n\n「この字について、調べているんですか」\n\n「調べています」\n\n「公開されている資料は、ありますか」\n\n澪は、少し考えた。\n\n「同じ系統と思うものは、あります。ただ、今見たものを、それだけで説明できるわけでは――」\n\n律の端末に、検索の候補が出た。\n\n彼が自分で、壁の画像を照合に回していた。\n\n文字と見なせる部分だけを、選んだ。\n\n候補の上位へ、古い本が現れた。\n\n植物の絵。\n\n丸い形と、長く伸びた線。\n\n律は二つを並べた。\n\n表題を見た。\n\nヴォイニッチ手稿。\n\nその下に、未解読という説明があった。\n\n律は澪へ画面を向けた。\n\n彼女は、知らない本を見る顔をしなかった。\n\n「これですか」\n\n「はい」\n\n澪が答えた。\n\n「知っています」\n\n律は壁の文字へ目を戻した。\n\n彼女は、読めた。\n\n書かれた場所の向こうに、何があるかも知っていた。\n\nそれなのに、その場所を、地図の上では示せないと言う。\n\n秋山が、静かに尋ねた。\n\n「澪さん。その図、何を見て描いたんですか」\n\n澪は机の紙へ手を置いた。\n\n「覚えているものを、描きました」\n\n律は彼女を見た。\n\n「現地へ行ったことが、あるんですか」\n\n澪は、少しだけ目を伏せた。\n\n「私には、そこで暮らした記憶があります」\n\n部屋が静かになった。\n\n秋山も、律も、すぐには返事をしなかった。\n\n澪は続けた。\n\n「ただ、今のあの町を知っているわけではありません。今日の管も、機械も、ラーナさんたちも、私は知りませんでした」\n\n律は、地図と画像を見比べた。\n\n今の町へ行ったことはない。\n\n古い場所に、暮らした記憶がある。\n\n答えを一つにまとめるには、まだ足りなかった。\n\n澪は、その先を話そうとした。\n\n端末が鳴った。\n\nミーシャからだった。\n\n律ではなく、澪へつなぐための通話。\n\n彼女は、画面を見た。\n\n律へ向き直る。\n\n「この話は、続けます。先に、彼が何を知っているか、私も聞きたいです」\n\n律は少し考え、頷いた。\n\n「僕も、同席します」\n\n「お願いします」\n\n澪は自分の紙を、机の真ん中へ置いた。\n\n律は、ラーナから受け取った記録の写しを、その隣へ出した。\n\n壁の画像と、読めないはずの本が、画面に残っている。\n\n秋山が、もう一脚、椅子を引いた。\n\n澪が通話を開いた。\n\nミーシャの声がした。\n\n「あなたは、あの文字を、どこで覚えた」\n\n---\n\n*第三部・了*\n\n---\n\n## 第四部　助けた理由\n\n### 一　質問を返す\n\n「あなたは、あの文字を、どこで覚えた」\n\nミーシャの声がした。\n\n澪は机の上の画像を消さなかった。\n\n「あなたは、あの場所がどこにあるか知っていますね」\n\n通話の向こうが、少し静かになった。\n\n律は、二人の間にある画面を見た。\n\n読めない本と、ラーナの暮らす場所。\n\n片方は文字を知り、片方は行き方を知っている。\n\n「知っている」\n\nミーシャが答えた。\n\n「では、私も知りたいです」\n\n「先に、あなたの資料を見たい」\n\n澪は首を振った。\n\n「写真だけ渡して、後は調査中、と言われるのは困ります」\n\n律は、自分の端末を手前へ寄せた。\n\n「僕からも、聞きたいです。ラーナは、誰かが演じている人じゃないんですね」\n\nミーシャは黙った。\n\n律は続けた。\n\n「水の記録を返してほしいと言われました。ゲームの話じゃなくて、仕事の記録を。彼女は、それを失うと困るんです」\n\n「……そうだ」\n\n「人が、暮らしている場所なんですね」\n\n「そうだ」\n\n秋山が、ゆっくり椅子へ座り直した。\n\n律は画面を見た。\n\n分かっていたつもりだった。\n\nそれでも、言葉にされると、違った。\n\n「だったら、その人の家を、どうして僕が歩けたんですか」\n\nミーシャは、接続の図を出した。\n\nゲーム。\n\n外部の環境を取り込む中継。\n\nその先の、名前のない施設。\n\n「実際の場所を送るための設備だ。景色だけではない。向こうにも、あなたの姿を示す」\n\n律は、自分の立っていた四角い範囲を思い出した。\n\n「触れないのは、身体を送っていないから」\n\n「そうだ。通常のゲームでは、触れたという感覚を補う。現地の物を動かす力はない」\n\n「それを、ゲームにつないだのは？」\n\n「接触先を選ぶ試験の入口が、公開の経路へ載った」\n\n「事故ですか」\n\n「公開を許可した覚えはない」\n\n律は、少し前の答えを思い返した。\n\nミーシャは、事故だとは言わなかった。\n\n「場所を、教えてください」\n\n澪が言った。\n\n「図の一部は、当てられた。でも、全体を当てる試験を続けたいわけではありません」\n\nミーシャは、彼女を見た。\n\n「会って話したい」\n\n澪は頷いた。\n\n「今夜、行けます」\n\n律は顔を上げた。\n\n彼女は律へ向き直った。\n\n「一緒に、来てください」\n\n断るつもりはなかった。\n\n律は秋山を見た。\n\n彼女は机の端の鍵を取った。\n\n「私が送る。帰りも」\n\n### 二　明日の分の水\n\nラーナが家へ戻ると、母は箱を一つ、閉じていた。\n\n娘の手にある紙を見て、顔を上げる。\n\n「取り返したの」\n\n「見てた人が、持ってた」\n\nラーナは紙を机へ広げた。\n\n水が来る前の、上の管と、計器。\n\n図のないところから来た水が、自分のいた通路へ入った。\n\n母はしばらく見ていた。\n\nそれから、空いている椅子を指した。\n\nラーナが座ると、包んでいなかった器へ食事をよそった。\n\n「食べながら、話せる？」\n\n「うん」\n\nラーナは、その人がどこへ戻ったかを話した。\n\nどこかは、まだ分からない。\n\nただ、身体は別のところにあって、こちらへ来るときは、機械を使っている。\n\n「じゃあ、あの人も、あなたがどこにいるか知らないのね」\n\n母が言った。\n\nラーナは手を止めた。\n\nそれは、まだ聞いていなかった。\n\n＊\n\n食事の後、ラーナはファリデの待つ配水所へ戻った。\n\nラーナは持ってきた写しを置いた。\n\nファリデの前には、上の区画の作業予定があった。\n\nまだ、ほとんど空欄だった。\n\n「これしか出てこない」\n\nファリデが言った。\n\nラーナは二枚を並べた。\n\n切替試験。\n\n使用中の区域。\n\n使っていないことになっている、戻りの道。\n\n「ここ、私たちの通路」\n\n「その先は、家だね」\n\n二人は顔を見合わせた。\n\n見なければ分からない図だった。\n\n見てもなお、違っていた。\n\nメフルダードが来た。\n\nラーナは、彼へ紙を渡した。\n\n「これで、合ってますか」\n\n彼は作業予定を見た。\n\n画像の管を見た。\n\nもう一度、作業予定へ戻った。\n\n「その試験は、止めるよう伝える」\n\n「やったことは、消えません」\n\n「分かっている」\n\nメフルダードは近くの係を呼んだ。\n\n今朝の流量と、戻り側の水位を測るよう指示した。\n\n自分は電話を取った。\n\n上の席の男の名を呼ぶ。\n\nアザド。\n\nラーナは、初めてその名を聞いた。\n\n「試験の条件と、使った範囲の図を出してほしい」\n\nメフルダードが言った。\n\n「こちらの図と、合っていない」\n\n返事は、ラーナには聞こえなかった。\n\n彼の手だけが、受話器を握り直した。\n\n「人が住んでいる。空の通路ではない」\n\nラーナは、自分の家の方を見た。\n\n試験を止めたら、それで終わるのか。\n\n昨日の水が来た場所へ、今日も同じように水を送って大丈夫なのか。\n\nメフルダードは電話を置くと、彼女へ向き直った。\n\n「戻り側を、あなたにも見てほしい。安全な位置から。上の数字だけでは、もう決められない」\n\nラーナは機器を受け取った。\n\n今度は、予備も持った。\n\n### 三　戻る場所へ印を\n\nミーシャは、東京の事務所で待っていた。\n\n受付に名を告げると、会議室へ通された。\n\n秋山は、同じ階の待合室へ残った。\n\nミーシャが澪へ挨拶した。\n\n澪は英語で答えた。\n\n律は、言葉よりも、彼女の歩き方が少し遅くなったことに気づいた。\n\nミーシャが席を勧める。\n\n紙を一枚出した。\n\n二本の線を引く。\n\n一方の端を、小さく囲んだ。\n\n「ここを、現在の接続点とする」\n\n訳の声が、少し遅れて届いた。\n\n澪は、その印を見ていた。\n\nミーシャは、線の先へ、別の場所を足した。\n\n接続できる区域と、できない区域。\n\n研究のための建物と、生活する人々の区域。\n\nその境目は、律がゲームの中で見た町の境目とは違った。\n\n「現地の施設を、あなたの会社が管理しているんですか」\n\n律が尋ねた。\n\n「中継の保守と、安全性の調査には関わっている。現地の権限は、それとは別だ」\n\n「でも、あなたは、切れる」\n\n「切れる」\n\nミーシャは否定しなかった。\n\n澪が、自分の地図を出した。\n\n「では、この先を、見せてください」\n\n低い二つの台から、奥へ続く線。\n\nミーシャは、そこへ顔を近づけた。\n\n「その図は、いつのものだ」\n\n「古いものです」\n\n「何年前？」\n\n澪は少し黙った。\n\n「その答えを、今ここで信じていただけるとは思いません。先に、現地と合うか確かめてほしいです」\n\nミーシャは地図を見直した。\n\n「その区域は、後から広がった場所だ。私が確認した範囲の外になる」\n\n澪の手が止まった。\n\n「壁の向こうも、見ていないんですね」\n\n「見ていない」\n\n「そこに、昔の入口があったことは？」\n\n「塞がれた入口なら、ほかにもある」\n\n澪は、紙の線へ指を置いた。\n\n律は二人を見た。\n\n同じことを話しているのに、片方だけが、別の返事を待っている。\n\nそう見えた。\n\n澪が、顔を上げた。\n\n「私に、見覚えはありますか」\n\nミーシャは彼女を見た。\n\nすぐには答えず、少し考えた。\n\n「ない」\n\n澪は頷いた。\n\n「分かりました」\n\n声は落ち着いていた。\n\n指だけが、紙の端を強く押さえていた。\n\n＊\n\nミーシャは、現地への行き方を示した。\n\n東地中海の空港から、工事の調査拠点へ。\n\n死海の近くを通る、新しい運河事業の関連区画。\n\n澪が仕事をしている地域だった。\n\n「ここから、通れるんですか」\n\n澪が聞いた。\n\n「あなたの調査区画からは、まだ許可されていない道がある。私が同行する」\n\n律は、図を見た。\n\nゲームの中の、見知らぬ町。\n\n現実の地図へ、入口が付いた。\n\n「ラーナにも、行きたいと伝えてください」\n\n彼が言うと、ミーシャは顔を向けた。\n\n「何のために？」\n\n「会うためです」\n\nミーシャは、少し間を置いた。\n\n「接続で、話せる」\n\n「彼女は、自分のいる場所しか見られない。僕は、帰るときに消える。次は、自分の足で行きたいです」\n\nミーシャは、囲んだ印を見た。\n\nそれから、別の紙へ時刻を書いた。\n\n翌日の便だった。\n\n### 四　聞こえる声\n\nその夜、律はもう一度ラーナと話した。\n\n中庭だった。\n\n機器を試すための、短い接続。\n\nラーナは作業をしながら、彼へ言った。\n\n「どこに住んでるの」\n\n「東京」\n\n彼女は、その名を繰り返した。\n\n「どの辺？」\n\n律は答えかけて、止めた。\n\n地図の前提が違う。\n\n「君のところから、道をたどれる場所。今日、行き方を聞いた」\n\nラーナが顔を上げた。\n\n「本当に？」\n\n「明日、出発したい」\n\n彼女は、手元の工具を置いた。\n\n「どうして」\n\n律は、用意していた答えが、少し違うと気づいた。\n\n記録のため。\n\n状況を知るため。\n\nそれもあった。\n\n「会いたいから」\n\nラーナは、しばらくこちらを見た。\n\nそれから、空いた手を伸ばした。\n\n律も手を出した。\n\n指が重なり、止まらずに、少し先へ行った。\n\n二人とも、すぐに引いた。\n\n「今、いないんだね」\n\n「身体は、別のところにある」\n\n「じゃあ、来たら、触れる？」\n\n「たぶん」\n\n「そこは、たぶんじゃ困る」\n\n律は、少し笑った。\n\nラーナも、口元だけ動かした。\n\n中庭へ、ファリデが来た。\n\nラーナの足元へ、食事の包みを置く。\n\n「話してる間も、食べて」\n\n「あとで」\n\n「あとで、が多すぎる」\n\nラーナは包みを開けた。\n\n一つ差し出しかけ、律の手を見た。\n\n「来てから」\n\n彼女は言った。\n\n「うん」\n\n律は頷いた。\n\n「そういえば、旅をしたことは？」\n\nラーナは、食べ物を置いた。\n\n「ここ以外へ？」\n\n「うん」\n\n「ない。あなたは？」\n\n「学生のころ。いろいろ」\n\n律は、乗るバスを間違えて、知らない町で夕食を食べた話をした。\n\n世話になった人へ手紙を送り、宛先を間違えて戻ってきたことも。\n\n「それで終わり？」\n\n「二回目は、返事が来た」\n\n「二回で済んだんだ」\n\n「そこを褒めて」\n\nラーナは笑った。\n\n律は、思い出せる範囲で返事の内容を話した。\n\n今度は道を間違えずに来い。\n\n来たら、先に知らせろ。\n\nそれだけだった。\n\n「戻ってきた人の話は、いいね」\n\nラーナが言った。\n\n「どうして」\n\n「道が、片方だけじゃないから」\n\n律は彼女を見た。\n\n「今度、その手紙を持っていく」\n\nラーナが頷いた。\n\n「それと、歩ける靴で来て」\n\n「分かった」\n\n「こっちへ来たら、消えて帰れないよ」\n\nその言い方には、少し、確かめる響きがあった。\n\n律は、今度は笑わなかった。\n\n「自分で、帰る道も覚える」\n\n### 五　先に来ていた人\n\n接続を終えたとき、秋山が廊下から戻った。\n\n電話を持っていた。\n\n律は、その顔を見て立ち上がった。\n\n「何か」\n\n「警察から。店の記録を、別の角度からも確認できたって」\n\n彼女は電話を渡した。\n\n律は話を聞いた。\n\n聞かれた人物を、知っていた。\n\nミーシャと一緒にいた男。\n\n通報し、律へ通訳の端末を渡し、診療所まで付いてきた人間だった。\n\n律が歩道へ出る前から、その男は店の近くにいた。\n\n襲撃者と、短く接触していた。\n\n警察は経緯を確かめている。\n\n映像の人物に見覚えがあるか、律にも確認したいという。\n\n律は椅子へ座った。\n\nついさっきまで、明日の靴のことを考えていた。\n\n今は、足の裏が、あの縁石のない場所を探していた。\n\n電話を終え、秋山へ返す。\n\n澪が、何も聞かずに隣へ来た。\n\n律はミーシャへ、通話をかけた。\n\n彼はすぐに出た。\n\n「同行していた人が、襲った男と、先に会っていたそうです」\n\n律は言った。\n\n「説明してください」\n\nミーシャは黙った。\n\n画面の外へ、目を向けなかった。\n\n誰かへ答えを確かめる必要はない。\n\nその沈黙で、律には、もう一つ分かった。\n\n「知ってたんですね」\n\n「知っていた」\n\n「危ない人を見張っていた、ということですか」\n\n自分で、逃げ道を差し出した。\n\nそれに気づいて、律は口を閉じた。\n\nミーシャは、その道を使わなかった。\n\n「あなたに近づくよう、私が指示した」\n\n秋山が、ゆっくり椅子から立った。\n\n澪は動かなかった。\n\n律は画面を見ていた。\n\n「あれを、あなたが」\n\n「そうだ」\n\n「助けに来るところも？」\n\nミーシャは頷いた。\n\n律は手を見た。\n\n傷の上の白いもの。\n\n机へ置いた、裂けた上着。\n\n「何を、知りたかったんですか」\n\n「何を見て、誰へ伝えたか。何かを受け取ったか。こちらの用意した説明を知っているか」\n\n「聞いたでしょう、全部」\n\n「普通に尋ねて、答えるとは限らないと思った」\n\n律は笑いかけた。\n\n笑う形に、口が動いただけだった。\n\n「怖がらせたら、信用すると思ったんだ」\n\nミーシャは答えなかった。\n\n「助けてもらったから、話を聞こうと思いました。少なくとも、あの男からは守ってくれるんだと」\n\n声が、一度詰まった。\n\n律は、水を飲まなかった。\n\n「その相手を、あなたが作った」\n\n「そうだ」\n\n「僕が、車の方へ倒れたときも、見てたんですね」\n\nミーシャの顔が変わった。\n\n「見ていた」\n\n「僕が何を知っているかと、僕がけがをするかを、同じところへ並べた」\n\nミーシャは、否定しなかった。\n\n後ろで、秋山が短く言った。\n\n「今の話を、捜査の担当にも、してください」\n\nミーシャは頷いた。\n\n律は画面を消しかけた。\n\nその前に、ラーナの顔が浮かんだ。\n\nこちらの事情を知らず、明日の道を待っている。\n\n彼は指を止めた。\n\n「ラーナには、何をするつもりですか」\n\n「接触したことを理由にした処分は、させない」\n\n「あなたの約束だけでは、もう足りません」\n\nミーシャは、少し目を伏せた。\n\n「必要な条件を、出してほしい」\n\n律は、すぐには答えなかった。\n\n＊\n\n通話をいったん切った。\n\n律は、処置された手を机へ置いた。\n\n秋山が言った。\n\n「現地へ行く話は、取りやめよう」\n\n律は頷きかけた。\n\nそれから、首を振った。\n\n「彼の車に乗って、彼の選んだ場所へ行くのは、やめます」\n\n澪が顔を上げた。\n\n律は彼女を見た。\n\n「調査の拠点へ、入れますか。そちらの人にも、道を見てもらって」\n\n澪は、すぐに答えなかった。\n\n自分の端末を開き、現地の同僚へ連絡した。\n\n地図を出す。\n\n工事用の通路と、その先にある、別の入口。\n\n相手は途中で質問を返し、資料を求めた。\n\n澪は、ミーシャの名前だけで通そうとはしなかった。\n\n話が終わると、律へ向き直った。\n\n「明日の到着後、外側の担当と会えます。通路の確認は、そこから。一緒に入る人も、こちらで付けます」\n\n律は頷いた。\n\n秋山は、二人の顔を見た。\n\n「それでも、私は止めたい」\n\n「分かってます」\n\n「帰る予定も、連絡先も残す。それと、襲われた件は、出発で終わったことにしない」\n\n律は頷いた。\n\nそうするつもりだった。\n\n同じ相手に会いに行くことと、その相手を許すことを、一緒にする必要はない。\n\n### 六　切る人を変える\n\nミーシャへ、もう一度連絡した。\n\n彼は、別の場所にいた。\n\n自分の同行者と、会社の担当を呼んでいるという。\n\n捜査へ伝える内容も、書面にしていた。\n\n律は、それが終わるのを待たなかった。\n\n「現地へは、澪さんの調査拠点から入ります。あなたの用意した案内だけでは、入りません」\n\n「分かった」\n\n「接続も、あなたへ頼むだけの形には戻さないでください。ラーナが呼びたいとき、現地の担当と決められるように」\n\nミーシャは、少し考えた。\n\n「現地に、連絡窓口を作る。保守の担当も共有する。私の指示を待つ運用は、変える」\n\n「本人に伝えてください。僕を納得させるためだけじゃなく」\n\n「伝える」\n\n律は、画面の中の男を見た。\n\nここで従っている理由も、分からない。\n\n澪の知識が必要だからかもしれない。\n\n自分たちを、手元から逃がしたくないのかもしれない。\n\nそれでも、彼以外の者が使える道は、一つずつ作れる。\n\n「僕へしたことは、それで終わりにはしません」\n\n「分かっている」\n\nミーシャは答えた。\n\n彼の声は、昼間より、少し低かった。\n\n澪が口を開いた。\n\n「なぜ、そこまでして隠すんですか」\n\nミーシャは彼女を見た。\n\n「外から入る人間が増えれば、あの暮らしが壊れる」\n\n「暮らしを、誰が決めるんですか」\n\n彼は答えなかった。\n\n澪は続けた。\n\n「場所を知らないままでは、帰れない人もいます」\n\nミーシャの指が止まった。\n\n彼は顔を上げた。\n\n「帰る？」\n\n「必要な人には、行き来する方法を知らせてください」\n\n澪は言った。\n\n「私も、そのために、探していました」\n\nミーシャは、長い間彼女を見た。\n\nその表情だけでは、何を考えているか、律には分からなかった。\n\n＊\n\n通話の後、律は澪へ尋ねた。\n\n「彼を、知っているんですか」\n\n澪は少し黙った。\n\n「そうかもしれないと、思いました」\n\n「顔で？」\n\n「いいえ」\n\n彼女は、自分の地図を出した。\n\n「戻る場所へ先に印を付ける人が、いました。迷ったら、そこまで戻る。行き先よりも、それを先に決める人でした」\n\n律は、ミーシャの紙の丸を思い出した。\n\n「ただの癖かもしれません。でも、確かめたくなりました」\n\n「だから、見覚えがあるか聞いた」\n\n澪は頷いた。\n\n「ないと、言われましたね」\n\n律が言うと、澪は目を伏せた。\n\n「今の私の姿を、知っているとは限らないんです」\n\n律は彼女を見た。\n\n曖昧なまま進むには、もう大きすぎる言葉だった。\n\n「どういう意味ですか」\n\n澪は、今度は話を止めなかった。\n\n### 七　別の人生の地図\n\n澪は、幼いころから描いてきたものを出した。\n\n今の家とは違う部屋。\n\n窓のない壁。\n\n道と、台と、水路。\n\n書いたときには、誰にも読めなかった文字。\n\n律は、紙と画像を並べた。\n\n澪は、その一枚を指した。\n\n「私が、今の身体で見に行った場所ではありません」\n\n律は黙って聞いた。\n\n「別の身体で、生きていたときの記憶です」\n\n秋山も、口を挟まなかった。\n\n「生まれ変わり、という意味ですか」\n\n律が聞くと、彼女は頷いた。\n\n「はい」\n\n彼は、紙の上の線を見た。\n\nすぐに信じられる話ではなかった。\n\nだが、今日、彼女が示した場所には、二つの台があった。\n\n読めない文字を、彼女は読んだ。\n\nそれを、聞かなかったことにもできなかった。\n\n「どうして、そうなるんですか」\n\n「私のいた社会では、ある食事と、次の人生で記憶が残ることの関係が、知られ始めていました。私が最後にいたころには、食べるかどうかを選ぶ人も」\n\n澪は、手稿の植物画を開いた。\n\n「似たものが、ここに描かれています。名前を読めるものもある。でも、今の実物を見ずに、何が育てられているかは決められません」\n\n律は頷いた。\n\n正しいと証明されたわけではない。\n\nそれでも、確かめる道ができていた。\n\n「探しているのは、場所だけですか」\n\n澪は少し黙った。\n\nやがて、首を振った。\n\n「そこへ来て、帰ってしまった人がいました。場所を知らないまま、帰った人です」\n\n彼女は、古い地図を見た。\n\n「その人へ、道がつながっていると知らせたかった。私が見つけられなくても、あの場所が地上へ知られれば、いつか伝わると思って」\n\n律は、ラーナと話したばかりの中庭を思い出した。\n\n会うには、道が要る。\n\n気持ちだけでは、扉が開かない。\n\n「ミーシャが、その人かもしれないと？」\n\n澪は、答えるまで時間を掛けた。\n\n「そうなら、覚えていないのかもしれません。私にも、あの場所にも、反応しませんでした」\n\n「話せば、分かるかも」\n\n「今の人生に、私が覚えている人生まで背負わせていいのか。それは、まだ分かりません」\n\n律は、彼女の言葉を聞いた。\n\n自分とは、待ってきた時間も、失うものも違う。\n\nそれでも、問いは残った。\n\n「じゃあ、場所を見てから、もう一度、聞きましょう」\n\n澪は彼を見た。\n\n「先に決めなくてもいいと思います。忘れたかどうかも、同じ場所かどうかも」\n\n彼女はゆっくり頷いた。\n\n＊\n\nその夜、律は鞄へ靴を入れた。\n\n着替え。\n\n接続具。\n\n破れた上着は、証拠として残した。\n\n代わりの上着を、椅子から取る。\n\n最後に、古い手紙の写しを入れた。\n\n住所と名前を隠し、ラーナへ見せるために用意したものだった。\n\n秋山から連絡が来た。\n\n引継ぎを確認した。\n\n帰る便を共有すること。\n\n着いたら、最初に連絡すること。\n\n律は返信した。\n\n次に、ラーナへの連絡を開いた。\n\n接続の窓口は、今度は、彼女の作業所へつながっていた。\n\n《明日、出発する。着いたら、また呼ぶ》\n\nすぐには返事が来なかった。\n\n荷物を閉めるころに、短い返事が来た。\n\n《道を間違えないで》\n\n律は笑った。\n\nその後に、もう一行、届いた。\n\n《こっちの水は、まだ戻ってこない》\n\n彼は地図を開いた。\n\n機械の中では、名前のなかった場所。\n\n今は、現実の道の先に、待っている人がいた。\n\n---\n\n*第四部・了*\n\n---\n\n## 第五部　帰る場所は、ここにあった\n\n### 一　同じ便の、別の席\n\nミーシャは、搭乗の少し前に来た。\n\n書面を一つ、律へ渡した。\n\n襲撃について、自分が何を命じたか。\n\n同行者と、相手の男との関係。\n\n自分の氏名と、連絡先。\n\n捜査へ説明した内容の写しだった。\n\n律は最後まで読み、自分の端末へ保存した。\n\n礼は言わなかった。\n\n「現地で何か分かっても、これがなくなるわけではありません」\n\n「分かっている」\n\nミーシャは答えた。\n\n澪が、現地の担当者との連絡を終えた。\n\n迎える人の名と、入る場所を全員へ示す。\n\n案内を、ミーシャ一人の手元へ戻さなかった。\n\n彼は、一行の後ろへ付いた。\n\n＊\n\n飛行機で、律は少し眠った。\n\n目が覚めると、澪は地図を見ていた。\n\n今の地図と、彼女が描いた地図。\n\nその間に、ラーナから受け取った記録があった。\n\n「眠れました？」\n\n彼が聞くと、澪は首を振った。\n\n「私が知っている人たちが、もう、あそこにはいないことを考えていました」\n\n律は黙って聞いた。\n\n画面の中の、物置の石の台。\n\nそこには角材が載っていた。\n\n誰かが座って話す場所ではなくなっていた。\n\n「でも、ラーナさんたちが、そこへ住んでいることまで間違いにしたくないんです」\n\n澪が言った。\n\n「私の記憶と違うものを取り除けば、元へ戻るわけではないので」\n\n律は頷いた。\n\n「僕が勝手に決めそうになったら、言ってください」\n\n「私にも、お願いします」\n\n彼女は、そこで少し笑った。\n\n＊\n\n食事が下げられた後で、澪が自分の記録を出した。\n\nいくつもの人生。\n\nその間の空白。\n\n律は、生きていた年数を目で追った。\n\n「直前の一生の分だけ、待つんじゃないんですね」\n\n「覚えている人生の分が、積み重なります」\n\n澪は、今の出生年の手前にある、長い空白を指した。\n\n「私が帰ってこなかった間に、町がなくなるだけの時間が、過ぎていたのかもしれません」\n\n律は、数字から目を離した。\n\n数時間で、知らない人の名前と命を気にするようになった。\n\nその時間とは、比べられなかった。\n\n彼は自分の鞄を見た。\n\n手紙の写しが入っている。\n\n今、自分が持っていけるものを、持っていくしかなかった。\n\n### 二　名前のある道\n\n現地の調査拠点では、澪の同僚が待っていた。\n\n運河の本線から離れた、調査と排水のための区画だった。\n\n壁に、工事の進行図が出ている。\n\nその一部で、澪は仕事をしていた。\n\n同僚が現状を説明し、彼女が質問を返した。\n\n律は、初めて見る彼女の働き方を見ていた。\n\n分からない場所を、知っているつもりで通り過ぎない。\n\n古い図と現状が違えば、どちらかを消す前に、現地へ聞く。\n\nミーシャも、自分の管理していた図を出した。\n\n外の担当者は、そこで初めて知った建物へ印を付けた。\n\n「この先へ、人がいるんですね」\n\nそう聞かれたとき、ミーシャは一度、澪を見た。\n\n彼女は代わりに答えなかった。\n\n「いる」\n\n彼が言った。\n\n「後から広がった区域の図も、取り寄せる」\n\n外の担当者は頷いた。\n\n知らないことがあると分かれば、仕事の進め方を変えられる人だった。\n\n＊\n\n車を替えた。\n\n長い通路へ入った。\n\n途中から、壁の断面が変わった。\n\n掘削の跡ではない、古い面が現れる。\n\n電灯の付け方も変わった。\n\n律は、来た道を端末へ残した。\n\n二つ目の扉の前で、ミーシャが現地の言葉を話した。\n\n受話器を付ける前だった。\n\n聞こえるのに、意味が分からない。\n\n車で遠くへ来たときより、強く、知らない場所へ来たと思った。\n\n扉の向こうで、年配の男が頭を下げた。\n\n自分より若い身体へ挨拶しているだけではない、深い動きだった。\n\n澪が息を止めた。\n\n律は、小さく聞いた。\n\n「何て？」\n\n「お戻りを、お待ちしていました、と」\n\n男は顔を上げ、ミーシャへ何かを尋ねた。\n\n彼が短く答える。\n\n男の肩が、ほっとしたように下がった。\n\n「前に会ったときの話です」\n\n澪が言った。\n\n「ただし、今の二人の人生より、前のことを」\n\n律は、ミーシャを見た。\n\n澪は、もう彼から目を離さなかった。\n\n### 三　そこにいる\n\n通路を抜けると、明るかった。\n\n律は上を見た。\n\n空はなかった。\n\n高いところに岩があり、その下に、光を送る設備がある。\n\n明るい場所と、暗い場所。\n\nその下に、畑と、家と、道。\n\n小さな通りの曲がり角に、見覚えのある箱があった。\n\n中庭。\n\n配電盤。\n\n自分が立てた、四角い敷石。\n\nそこだけを見て、町を知ったような気になっていた。\n\n「上を見たこと、なかったでしょう」\n\n声がした。\n\nラーナが、庭の入口にいた。\n\n律は、そちらへ歩いた。\n\n彼女は足元を見てから、彼の顔を見た。\n\n「歩ける靴」\n\n「言われたから」\n\nラーナが首をかしげた。\n\n通じていなかった。\n\n受話器を付けると、訳が遅れて来た。\n\n同じ声ではなかった。\n\n彼女が笑うより先に、訳の声が笑った調子になった。\n\n律は受話器を片耳から外した。\n\n「ラーナ」\n\n名前は、訳さなくても言えた。\n\n彼女は、ゆっくり近づいた。\n\n手を出す。\n\n律も出した。\n\n指がぶつかった。\n\n二人とも、その手を見た。\n\n「いるね」\n\n訳が来る前に、意味が分かった気がした。\n\n「いる」\n\n律は頷いた。\n\nラーナは、今度はすぐに手を引かなかった。\n\n＊\n\n彼は鞄から、手紙の写しを出した。\n\nラーナは紙をつまみ、裏返した。\n\n少し薄い紙だった。\n\nそれでも、人も紙も消えなかった。\n\n彼女は、名前と宛先を隠してある部分を見た。\n\n「ちゃんと、返事が来たんだ」\n\n「うん」\n\n「これ、持ってていい？」\n\n「そのために持ってきた」\n\nラーナは折り、上着の内側へしまった。\n\nそれから、律の手の白いものを見た。\n\n「痛い？」\n\n「少し」\n\n彼女は、うなずいただけだった。\n\n触って確かめなかった。\n\n律も、彼女の膝を見た。\n\n「無理して歩かないで」\n\n「今日は、乾いてる方から行く」\n\n「案内してくれる？」\n\nラーナは、来た人々へ目を向けた。\n\nミーシャと、視線が合った。\n\n彼女は軽く頭を動かした。\n\n敬意よりも、知っている顔だと示す動きだった。\n\nそれから、律へ向き直った。\n\n「行こう。見たいものが、あるんでしょう」\n\n### 四　古い場所の、新しい使い方\n\n調査に向かったのは、荷物を置いた後だった。\n\nラーナが先を歩き、メフルダードがその横へ付いた。\n\n澪の同僚も、持ち込んだ図へ、通った場所を記していた。\n\nファリデは、物置から人と荷物を動かしていた。\n\n角材をどけた跡に、低い台が見えている。\n\n澪は、その前で立ち止まった。\n\nすぐには触れなかった。\n\nラーナが振り返った。\n\n「上に載ってたのは、全部どかしました。向こう側も見ます？」\n\n澪は現地の言葉で礼を言った。\n\nラーナが顔を上げた。\n\n驚いていた。\n\n澪はもう一度、少しゆっくり言った。\n\n今度は、ラーナが頷いた。\n\n「言い方は少し変だけど、分かる」\n\n律には、受話器を通してそう届いた。\n\n澪は、少しだけ笑った。\n\n「古い言い方を、習ったので」\n\nラーナは、それ以上尋ねなかった。\n\n変な人が来ることにも、少し慣れた顔をしていた。\n\nミーシャは、台ではなく壁を見ていた。\n\n補修の違い。\n\n後から足された柱。\n\n配管と、配電の線。\n\n施設の状態を確認する目だった。\n\nメフルダードが、拡張の記録を示した。\n\n最初に人が住んだ区域から、少しずつ生活の場所が広がっている。\n\nこの物置は、後から家と作業所が増えた区域の端にある。\n\nミーシャが知っている研究棟からは、離れていた。\n\nラーナが、図の一つを指した。\n\n「私が子供のときも、ここはありました。その前は、ファリデさんが知ってる」\n\n「私が子供のときも、あった」\n\nファリデが、角材を抱えたまま答えた。\n\n「誰かが見つけたばかりのものじゃないよ。ずっと、物を置くのに使ってた」\n\n澪は頷いた。\n\nそれでいい、と言うような頷き方だった。\n\n彼女は台の低い方へ回った。\n\nひざを曲げ、下の部分を見た。\n\n律もしゃがみかけた。\n\nラーナが彼の袖を引いた。\n\n「そこ、汚れる」\n\n律は止まった。\n\n澪は気にしなかった。\n\n台の側面を、持ってきた灯りで照らす。\n\n「残ってる」\n\n小さな声だった。\n\nミーシャが顔を向けた。\n\n澪は、台の裏側を指した。\n\n「見ていただけますか」\n\nミーシャが、膝を折った。\n\n石の上に、短い線があった。\n\n線ではなかった。\n\n細長い舟の形だった。\n\n先の尖ったところが、途中で折れている。\n\n後ろには、余分な線が三本ある。\n\n律には、子供が描いた絵に見えた。\n\nミーシャは、動かなくなった。\n\n澪も、何も言わなかった。\n\n灯りの丸い縁だけが、石の表面を少し揺れた。\n\nミーシャが、指を近づけた。\n\n触れる前に止めた。\n\n「三本では、沈む」\n\n古い言葉だった。\n\n律には、訳が来るまで分からなかった。\n\n澪が答えた。\n\n「櫂じゃない。乗っている人の髪だって、言ったでしょう」\n\nミーシャの手が止まった。\n\n顔を上げる。\n\n澪は、その目を見ていた。\n\n長い間、誰も動かなかった。\n\n律は、ラーナの手が自分の袖をつかんだままだと気づいた。\n\n彼女も、会話の言葉より、その間にあるものを見ていた。\n\nミーシャが立ち上がった。\n\n「誰から、聞いた」\n\n澪は答えなかった。\n\n代わりに、石の舟の下を指した。\n\n「あなたが書いた名前は、間違っていた。あれでは、人の名前じゃなくて、舟を引く道具になるから。直したのは、私です」\n\nミーシャは、もう一度、石を見た。\n\n削った跡が、一つだけ深い。\n\nそこにだけ、別の文字の形が残っていた。\n\n「サーラ」\n\n彼が呼んだ。\n\n澪は、目を閉じた。\n\nそれから、開いた。\n\n「今は、澪です」\n\n声が少しかすれていた。\n\n「でも、その名前で呼んでも、分かります」\n\nミーシャは何も言わなかった。\n\n彼女の顔を見ていた。\n\n初めて見る人を、初めて見るまま、知っている人として見ようとしていた。\n\nやがて、彼はかすかに首を振った。\n\n「君は、あそこに――」\n\n言葉が続かなかった。\n\n澪は一歩、近づいた。\n\n「あなたも、覚えていたんですね」\n\n彼は頷いた。\n\n「ずっと」\n\n澪の唇が、少し震えた。\n\n「忘れたんだと、思っていました」\n\nミーシャが、彼女を見た。\n\n「君を？」\n\n澪は頷いた。\n\nそれ以上、説明しなかった。\n\n彼は手を伸ばしかけた。\n\nその手を、澪が取った。\n\nどちらも、確かめるように握っていた。\n\n### 五　待っていたのは誰か\n\nラーナが、物置の外へ人を出した。\n\n床と壁を確認するので、少し待ってほしい。\n\nそれは嘘ではなかった。\n\nファリデは何も聞かず、運び出した角材を数え直し始めた。\n\n律も、ラーナに続いて外へ出た。\n\n戸口で振り返ると、ミーシャはまだ、澪の手を離していなかった。\n\n＊\n\n「君は、死なないのだと」\n\nミーシャが言った。\n\n澪は、彼を見た。\n\n「同じ身体のまま？」\n\n彼は頷いた。\n\n澪は息を吸い、ゆっくり吐いた。\n\n「違います。身体は、死にます」\n\n彼の指が、少し強くなった。\n\n「私が、どれだけ年月がたっても覚えていると言ったから？」\n\nミーシャは頷いた。\n\n「君が私の知らない昔のことを、自分の暮らしとして話したからだ。同じ場所に、同じ君が、ずっといるのだと思っていた」\n\n「私は、何度か、生まれ直していました」\n\n澪は、今の自分の手を見た。\n\n「これも、あのときの身体ではありません」\n\nミーシャの目が、彼女の手と顔の間を動いた。\n\n若い身体だった。\n\n自分が探していた身体ではなかった。\n\nだから、今の今まで、探している人ではないと決めていた。\n\n「地上で会うとは、思わなかった」\n\n彼が言うと、澪は頷いた。\n\n「私も、あんな部屋で会うとは」\n\n笑おうとして、うまくいかなかった。\n\n「あなたが、あの壁を知らないと言ったから。舟も、台も、もう覚えていないんだと思いました」\n\n「壁は、変わっていた」\n\n「ええ」\n\n「私は、この地域を、自分たちが後から広げた居住区だと……」\n\n言葉が止まった。\n\nミーシャは、石の舟を見た。\n\n澪は、まだ、彼に全てを話していなかった。\n\n彼もまた、何を作ってきたかを、彼女へ伝えていなかった。\n\nそれでも、今、尋ねたいことは一つだった。\n\n「待っていたのか」\n\n澪は首を振った。\n\nミーシャの顔が変わった。\n\n彼女は、手を離さなかった。\n\n「最後まで、あそこにいたわけではありません」\n\n「どこへ」\n\n「あなたを、探しに」\n\n澪は、戸口の方を見た。\n\n今は、人の声がする。\n\n道があり、灯りがあり、誰かが戻る時間を待っている。\n\nあのときは、そうではなかった。\n\n「あなたが帰った後で、考えたんです。私が知らせなければ、あなたはここへ戻れない。場所が分からないんですから」\n\n「どうやって、地上へ出ようとした」\n\n「古い道を使いました」\n\n彼女は一度、目を伏せた。\n\n「途中で、通れなくなっていました。戻ることも、できませんでした」\n\nミーシャは、何も言わなかった。\n\n「何日も、考えました。あなたに、どう伝えればよかったのか。最初から、何を隠さなければよかったのか」\n\n彼は、彼女を見た。\n\n澪は、今度は目をそらさなかった。\n\n「私は、道を知っていました。地上へ続く道を。あなたがそれを知ったら帰ってしまうと思って、見せなかった記録があります」\n\n彼の手が、動かなくなった。\n\n「地上へ？」\n\n「ここから、地上へ」\n\n澪は言った。\n\n「別の星ではありませんでした。あなたが来た世界と、地続きでした」\n\nミーシャは、彼女の言葉を聞いた。\n\n聞いた言葉を、頭の中で、知っている場所に結び付けようとした。\n\n約束の地。\n\n手稿。\n\n栽培。\n\n同じ姿で、自分を待っている人。\n\n長い間、離れ離れでも、相手の時間だけは失われないと思っていた。\n\nだから、次の人生へ、先延ばしにできた。\n\n「私は、君がそこにいると思って」\n\nそこまで言って、やめた。\n\n澪は頷いた。\n\n今は、慰める言葉を言わなかった。\n\n「私は、あなたの帰る道を隠しました」\n\n彼女は言った。\n\n「そのことは、再会できたからといって、なくなりません」\n\nミーシャは、握っている手を見た。\n\n「私にも、話さなければならないことがある」\n\n彼は顔を上げた。\n\n「待っている人のためだと思って、ここで暮らす人間に、待つことを教えてきた」\n\n澪は彼を見た。\n\n「律さんへしたことも、聞いています」\n\nミーシャは頷いた。\n\n「あなたが覚えていると分かったことと、その話は、別です」\n\n「分かっている」\n\n「私たちの昔の事情を、あの人へ理由として差し出さないでください」\n\n彼は、もう一度頷いた。\n\n今の自分を、知ってもらう仕事も残っていた。\n\n戸口の向こうで、台車が動いた。\n\nラーナの声がした。\n\nそこには、彼の考えていた目的とは別に、続いてきた生活があった。\n\nミーシャは、ようやく彼女の手を少し緩めた。\n\n「まず、君が何を知っているか聞かせてほしい。その後で、私が何をしてきたかを話す」\n\n澪は頷いた。\n\n「今度は、分かったつもりで終わらせないでください」\n\n「そうする」\n\n彼は答えた。\n\n### 六　できていたもの\n\n研究区画へ行くために、全員が引き返した。\n\nラーナは、途中の扉で止められた。\n\n係が許可証を見て、首を振る。\n\nミーシャが、後ろから声を掛けた。\n\n短い会話があった。\n\n係は道を譲った。\n\nラーナはすぐには歩かなかった。\n\n「今日だけですか」\n\nミーシャは彼女を見た。\n\n澪が訳した。\n\n「ここにある設備を調べるなら、私も知っておく必要があります。水の数字だけ、外で合わせろと言われても困ります」\n\nミーシャはメフルダードを呼んだ。\n\n必要な設備への出入りを、作業に応じて認めること。\n\n今日の命令だけで済ませず、記録へ残すこと。\n\nメフルダードは、許可証を受け取った。\n\nラーナは、その場で書き換えが終わるのを待った。\n\n律も、一緒に待った。\n\n＊\n\n栽培室の中は、暖かかった。\n\n葉の間に、細い管が通っている。\n\n壁には古い図があり、その隣に、新しい計測器が取り付けられていた。\n\nラーナは、水の戻りを確かめた。\n\n律は、植物から距離を取った。\n\n澪だけが、入口で立ち止まっていた。\n\nミーシャは、係へ収穫の記録を出させた。\n\n育てた量。\n\n加工した量。\n\n口にした人間の名。\n\n彼は、それを澪の前へ並べた。\n\n「同じものか」\n\n澪は株を見た。\n\n葉の裏を確かめる。\n\n小さな実が付いた枝を、許可を得て持ち上げた。\n\n「似たもの、ではありません」\n\n彼女は言った。\n\n「私が食べていたものです」\n\n律は植物と、澪を見た。\n\n前の夜に聞いた話が、実物のある話になった。\n\nミーシャは頷いた。\n\nその返事を、長く待っていたような頷き方だった。\n\nだが、澪は続けた。\n\n「何をするために、育てていたんですか」\n\nミーシャが、手稿の複製を開いた。\n\n栽培と加工のページ。\n\n古い言葉へ、自分で付けた訳。\n\n身体を戻す。\n\n名を置く。\n\n故郷へ帰るための支度。\n\n澪は、その訳を読んだ。\n\nそれから、長い間、文字を見つめた。\n\n「違います」\n\n声は小さかった。\n\nミーシャは、顔を向けた。\n\n澪は、書かれた言葉を一つずつ指した。\n\n「ここで戻るのは、死んだ後の、次の身体です。継ぐのは、覚えていたこと。これは、場所をつなぐ方法ではありません」\n\nミーシャは画面を見た。\n\n何度も読んだ言葉だった。\n\n今も、読める言葉だった。\n\n「この食事をした人は、次の人生で、前の人生を覚えている」\n\n澪が言った。\n\n「私のいたころに、分かり始めていました。私は、それを残したくて、このページをあなたに見せました」\n\nミーシャは彼女を見た。\n\n「君と、同じようになれるのだと」\n\n「ええ。覚えたままで、また生まれるという意味で」\n\n彼は、画面へ視線を戻した。\n\n「私は、身体を変えれば、君のいる場所へ戻れるのだと」\n\n澪は何も言わなかった。\n\n否定するための言葉は、もう全てそこにあった。\n\n記録を持ってきた年配の男が、静かに口を挟んだ。\n\n修養と、接触の恩恵について。\n\n澪は顔を上げた。\n\n「あなたも、覚えているんですね」\n\n男は頷いた。\n\n「ここ以外の、約束の地へ行ったことは？」\n\n男は、ミーシャを見た。\n\n「ありません」\n\n「それでも、覚えている」\n\n男はもう一度頷いた。\n\nミーシャが、机の上の記録へ手を置いた。\n\n栽培の確認に戻った人生。\n\n食べて、待って、死んだ人生。\n\n接続できなかったから、失敗だったと記した人生。\n\nその次に、彼は、全てを覚えて生まれていた。\n\n「できて、いたのか」\n\n誰へともなく、言った。\n\n澪が頷いた。\n\n「あなたが求めていたものとは、違う働きですが」\n\nミーシャは目を閉じた。\n\n自分だけが、かつて到達した恩恵を持っているのではなかった。\n\n自分の後へ続こうとした者が、修養によって近づいたのでもなかった。\n\n食べた者に、起きていた。\n\nそれを食べさせなかった者には、確かめる機会さえ与えなかった。\n\nラーナが、記録を見た。\n\n「ここにいる人だけが、ずっと覚えていたんですか」\n\n誰もすぐには答えなかった。\n\n彼女は、葉の間へ伸びる管を見た。\n\n自分たちの水が、ここへ来ている。\n\n作物の収量も、水の行き先も、外側には詳しく知らされていなかった。\n\n「私たちは、選ばれた人だから、先に行けるんだと教わりました」\n\n澪は彼女へ向き直った。\n\n「私の知っている暮らしでは、食べるかどうかを、自分で選び始めていました」\n\n「こっちでは、食べるかどうかを選べることも、知りません」\n\nラーナの声は、静かだった。\n\nミーシャは、その言葉を最後まで聞いた。\n\n「説明が必要だ」\n\n彼は言った。\n\n「ここにいる者だけへの説明ではなく」\n\nラーナは彼を見た。\n\n頷かなかった。\n\n言っただけで終わるかどうかを、まだ見ていた。\n\n＊\n\n記録を整理する間に、澪が一つのページを開いた。\n\n下の余白に、短い書き込みがある。\n\n本文とは、少し字の癖が違った。\n\nミーシャが、その場所を指した。\n\n「これは、君の字か」\n\n澪は頷いた。\n\n「私の手元の本でしたから」\n\n律は二人を見た。\n\n澪が本を見つめていた理由が、ようやく分かった。\n\n文明の本が一冊、生き残っただけではなかった。\n\n人の手を渡り、表紙を替えられ、遠い場所へ運ばれた、その一冊にしかない書き込みが残っていた。\n\nミーシャは、自分が付けた訳を示した。\n\n地上の名を置く日を、責めない。\n\n澪は、その横へ別の訳を書いた。\n\n私を覚えていることを、やめてもいい。\n\n彼は、二つの文を見た。\n\n澪が言った。\n\n「忘れることを、裏切りにしたくなかったんです。いつか、覚えている方が苦しくなったら、選んでいいと」\n\nミーシャは、長い間、答えなかった。\n\n彼が地上の名を捨てるための教えだと思ったものは、別の人生を生きていいという、相手からの言葉だった。\n\n「私は、これを、帰るための命令にした」\n\n彼は言った。\n\n澪は首を振った。\n\n「命令ではありませんでした」\n\n「ああ」\n\n彼は、彼女の書いた訳を消さなかった。\n\n### 七　運ばれてこなかった石\n\n水路の壁へ戻る前に、ミーシャは、石の台の来歴を確認させた。\n\n別の場所から運んだものではないか。\n\n古い構造材を、後から組み直したものではないか。\n\nそれは、疑うために疑う問いではなかった。\n\nここで自分の見たいものを見れば、また誰かを巻き込む。\n\n今度は、確かめる必要があった。\n\n澪は、その確認を待った。\n\nラーナが物置の古い修繕記録を持ってきた。\n\nファリデは、木材の台を外した後の床を見せた。\n\n台は、床の岩とつながっていた。\n\n壁の基礎にも、同じ層が続いていた。\n\nミーシャは、自分の手で、その境目をたどった。\n\n石の舟だけを、誰かが持ってきたのではない。\n\n描かれた石を含む、この場所そのものが、ここに残っていた。\n\n澪は低い台の横へ立った。\n\n「私が隠していた記録は、こちらです」\n\n全員で、壁の裏側へ回った。\n\n上には棚があり、下は薄い板で覆ってあった。\n\nラーナが、係へ取り外していいか確かめた。\n\nメフルダードが頷く。\n\n棚をどけ、留め具を外す。\n\n板の向こうに、浅い窪みがあった。\n\n文字が並んでいた。\n\n一方は、手稿に似ている。\n\nもう一方は、違う形だった。\n\n澪が灯りを向けた。\n\n古い地上の言葉と、そこで使われていた言葉。\n\n通路の名。\n\n井戸。\n\n倉庫。\n\n物を受け渡す場所。\n\nどちらから来た人間にも分かるように、二つの言葉が対応している。\n\n「昔、地上と行き来した人のために残されたものです」\n\n澪は説明した。\n\n「それより後にも、外へ続く道の記録は、別にありました。あなたが知りたがったときに、私は、こちらも、そちらも見せませんでした」\n\nミーシャは、並んだ文字を見た。\n\nここにある言葉の全てを、自分一人では読めなかった。\n\nだが、分かるものがあった。\n\n知らない世界を訪れたと思う前から、地上で見たことのある文字の形だった。\n\n澪は、今度は隠さなかった。\n\n自分が知っている範囲と、確かでない範囲を分けて話した。\n\n逃れてきた人々。\n\n閉じた道。\n\n外の土地の名だけが残っても、そこで生まれた人々には、もう見たことのない場所になっていたこと。\n\nミーシャは、最初に訪れた日のことを話した。\n\n気を失っていた時間。\n\n見たことのない食べ物。\n\n昔のことを、自分の記憶として話す人々。\n\n帰るときにも、自分で道をたどれなかったこと。\n\n世界が違うのだと思った。\n\nそう思ってからは、その説明に合うものばかりを、集めてきた。\n\n澪が、今の調査図を広げた。\n\n外の掘削地点。\n\n今日通ってきた経路。\n\n水路と、低い二つの台。\n\n古い対照表だけで、位置が決まったのではなかった。\n\n現在の道が、実際につながっていた。\n\n運ばれていない岩が、同じ場所を支えていた。\n\n二人しか知らない絵が、その岩に残っていた。\n\nミーシャは、少し離れて壁を見た。\n\nここへ戻るために、別の場所を作ったのだと思っていた。\n\n似た暮らしを整え、同じものを育て、人間の身体が変わる日を待てば、いつか道が開くのだと。\n\nだが、今、見えている壁は、模倣ではなかった。\n\n「同じところに、いたのか」\n\n彼は言った。\n\n澪は答える前に、水路の向こうを見た。\n\n今は、その先に、知らない家がある。\n\n知らない人たちが、知っている材料と、知らない道具で暮らしている。\n\n「全てが、同じではありません」\n\n彼女は言った。\n\n「私たちの町は、もう、ありません。でも、この場所は、残っていました」\n\nミーシャは頷いた。\n\n自分が作った共同体は、失われた文明の、別の端から広がっていた。\n\n後に人が増え、通路が開かれ、誰かの家と物置が増えた。\n\nその日々が、二人のいた場所まで戻ってきた。\n\n彼が、遠くへつながることばかり考えている間に。\n\n壁の前で、誰もすぐには動かなかった。\n\n最初に動いたのは、ラーナだった。\n\n「ここ、写しを取ります」\n\n全員が、彼女を見た。\n\n「次に分からなくなったとき、また、誰か一人だけが知っている状態にしたくないので」\n\nミーシャは頷いた。\n\nメフルダードも、止めなかった。\n\n澪は灯りを持ち直し、文字に影が落ちない位置へ立った。\n\n\n### 八　地図に残っていた空白\n\n最初に電話を取ったのは、澪の同僚だった。\n\n外側の技術担当へ、確認した図を送っていた。\n\n受話器を持ったまま、ラーナを呼ぶ。\n\n戻り側の水位を、もう一度知りたいという。\n\nラーナは、今朝の記録を出した。\n\n相手が時刻と場所を確かめる。\n\nメフルダードが、別の計器を読ませるため、人を向かわせた。\n\n図を重ねると、同じ場所に、違う線があった。\n\n内側の図には、家と畑がある。\n\n外側の図では、使われていない古い空洞になっている。\n\nミーシャは、自分の端末を開いた。\n\nその外側の図の元になった、古い範囲図を出す。\n\n研究棟と、保守のための通路。\n\n後から広がった居住区は、その外だった。\n\n「私は、全体を出さなかった」\n\n彼は言った。\n\n「栽培環境を守るためだ。影響が出れば、個別に調整できると思っていた」\n\n澪は、返事をしなかった。\n\nラーナが、地図を自分の方へ回した。\n\n「ここにも、人がいる」\n\n自分の家を指す。\n\n「昨日も、今日も」\n\n律は、二枚の図を見た。\n\n閉鎖の線の内側へ、誰かが勝手に家を入れた。\n\nそう思っていた。\n\n実際には、家があること自体が、外側へ届いていなかった。\n\nメフルダードが、切替試験の記録を並べた。\n\n外の工事に伴って、水の戻り方が変わる。\n\n上の区画では、栽培への供給を保つため、流路を切り替えた。\n\n使わないはずの戻り側へ、水が入った。\n\n「それが、私のいた通路へ来た」\n\nラーナが言った。\n\nメフルダードは頷いた。\n\n「閉鎖したという連絡で、作業する側は、人がいないと判断した」\n\n「記録室までは、入れた」\n\n「そうだ」\n\n彼は答えた。\n\n自分の指示を、なかったことにしなかった。\n\n「だから、図と、作業の範囲を、もう一度確かめる必要があった」\n\n電話から、声がした。\n\n新しい計測値が届いた。\n\n外の本工事は、到着時の情報を受けて止まっている。\n\nだが、その前に行った水位調整の影響が残っていた。\n\n古い出口へ、細かな土砂が入り込んでいる。\n\n戻るはずの水が、戻らない。\n\n内側で流入を減らしても、すぐには止まらない。\n\nラーナは、数字を見た。\n\n今日は、自分の機器の誤差ではなかった。\n\n予備の計器も、同じ変化を示していた。\n\n澪の同僚が、外側へ状況を伝えた。\n\n技術班が、入口の拠点へ来る。\n\nこちらからも、安全な位置の値を送り続ける。\n\n「どこへ、逃がせますか」\n\nラーナが聞いた。\n\nメフルダードは、古い流路を指した。\n\n研究区画の下。\n\n今は、その一部が、栽培室になっている。\n\n仕切りを外せば、別の低い場所へ流せる可能性がある。\n\n代わりに、長く保ってきた土と、水と、温度を失う。\n\n係が、ミーシャを見た。\n\n誰も、すぐには動かなかった。\n\nラーナは、その返事を待たず、家の並びを見た。\n\n誰を、どこへ動かすか。\n\n歩きにくい人は、どの家にいるか。\n\n台車を、どこへ集めるか。\n\n律が隣へ来た。\n\n「何をすればいい？」\n\nラーナは彼を見た。\n\n今度は、向こう岸ではなかった。\n\n「母のところへ、一緒に来て」\n\n彼女は言った。\n\n「荷物はあとにしてって、言わないと。あの人、最後まで片づけようとするから」\n\n律は頷いた。\n\n二人が出ていくと、ミーシャは栽培室の図を見た。\n\n澪が隣にいた。\n\nもう、遠くではなかった。\n\n彼は、古い流路へ指を置いた。\n\n「開くには、何を動かす」\n\n係が、顔を上げた。\n\n「移せる株と、移せないものを分けてくれ。人を残さず、作業できるように」\n\n澪が、自分の覚えている流路を、今の図へ重ねた。\n\nミーシャは、それを見た。\n\n帰るために作った場所で、今ここから出る道を、二人で探し始めた。\n\n---\n\n*第五部・了*\n\n---\n\n## 第六部　明日の約束\n\n### 一　持って出るもの\n\n母は、食器を包んでいた。\n\nラーナは戸口で、少しだけ笑ってしまった。\n\n母が顔を上げた。\n\n「何」\n\n「そうしてると思った」\n\n「だったら、手伝って」\n\n律が、ラーナの後ろから入った。\n\n母は手を止め、彼を見た。\n\nラーナは、名前を伝えた。\n\nそれから、必要なことだけを言った。\n\n荷物より先に、人を移す。\n\n家へ戻れるかは、まだ決まっていない。\n\n西の倉庫ではなく、その先の、高い方の広場へ行く。\n\n母は、包みかけていた器を見た。\n\n「今度は、確かめたのね」\n\nラーナは頷いた。\n\n「みんなで」\n\n母は布をほどいた。\n\n器を棚へ戻す。\n\nラーナは、置いていくものを自分で選ぶ母の手を見ていた。\n\n母は小さな鞄を取った。\n\n薬と、書類と、眼鏡。\n\n亡くなった父の小さな写真。\n\nそれから、一番上の棚を指した。\n\n「あれだけ、下ろして」\n\nラーナが背を伸ばすより先に、律が手を伸ばした。\n\n古い金属の箱だった。\n\n母は受け取り、開けなかった。\n\nラーナが尋ねた。\n\n「何が入ってるの」\n\n「お金と、あなたの最初の作業許可」\n\n「そんなの、置いていけば」\n\n母は返事をせず、鞄へ入れた。\n\nラーナも、それ以上言わなかった。\n\n外へ出ると、隣人が大きな袋を抱えていた。\n\nその後ろで、父親らしい人が足元を確かめながら、段差を下りようとしている。\n\n律が荷物へ手を伸ばした。\n\n隣人は首を振り、奥の小さな椅子を指した。\n\n律は、相手の言葉を聞き取れないまま、そちらへ行きかけた。\n\nラーナが止めた。\n\n「その人が座るもの。荷物じゃない」\n\n律は頷いた。\n\n椅子を外へ出すのではなく、父親のそばへ持っていった。\n\n座って、靴の留め具を直す。\n\nそれから立つ。\n\nほんの少し待つ方が、急がせるより早かった。\n\nラーナは隣人へ道順を説明した。\n\n律は母の鞄を受け取った。\n\n今度は、取る前に、持っていいか確かめた。\n\n＊\n\n広場には、すでに人が集まっていた。\n\nファリデが、移転用の台車を並べ替えている。\n\n食料を載せる予定だった一台に、背の低い腰掛けが二つ固定されていた。\n\n歩けない人を運ぶためだった。\n\nラーナは母を、顔見知りの家族のそばへ案内した。\n\n律は広場の入口を見た。\n\n来る人と、迎えに戻る人が、同じ狭い道を使っている。\n\n一台が止まると、後ろも止まる。\n\n彼はファリデへ声を掛け、別の道を使えるか尋ねた。\n\nラーナが訳した。\n\nファリデは、広場の裏手を指した。\n\n荷車には狭いが、手ぶらの人間なら通れる。\n\n戻る人をそちらへ回す。\n\n入口には、近所の顔を知っている人を立たせる。\n\n律が一人で声を張り上げる代わりに、ラーナとファリデが、それぞれ知っている人へ頼んだ。\n\n流れが、少しずつほどけた。\n\n律は自分の端末に地図を出しかけ、やめた。\n\n広場の壁へ、紙を貼る。\n\n実際に歩いてきた道を一本ずつ描く。\n\nどの道を、誰が確かめたかも書く。\n\nラーナが横から、地元の名前を足した。\n\n二つの言葉で、同じ曲がり角を指した。\n\n### 二　止めても、止まらない\n\n外側から、事前の水位調整も止めたと連絡が来た。\n\nメフルダードは、しばらく机へ手を付いていた。\n\n終わったのではなかった。\n\n操作を止めても、すでに変わった流れが、すぐ元へ戻るわけではない。\n\n水位は上がっている。\n\n壁際から流れ込む濁った水も、減っていない。\n\n澪の同僚が、外の技術担当と線をつないだ。\n\n新しい図へ、観測値が重なった。\n\n研究区画を通る古い流路を使い、その下の、居住に使っていない部分へ逃がす。\n\n外から来る班が、さらにその先の排水経路を確保する。\n\n内側だけでも、外側だけでも、確認できないところがあった。\n\nミーシャは、その連絡を聞きながら、栽培室の平面図を開いた。\n\n「全部を移す時間は」\n\n係が答えた。\n\n今ある容器へ移せる株は、一部。\n\n土と微生物、水の状態、長く測り続けた環境は、部屋ごと運ぶことはできない。\n\n記録は持ち出せる。\n\n同じように育つかは、外で確かめるしかない。\n\n上の席にいた男、アザドが、彼を見た。\n\n「ここへ至るまで、何人が待ったと思っているのですか」\n\nミーシャは顔を上げた。\n\n「知っている」\n\n「いいえ」\n\nアザドは、初めて、すぐに言い返した。\n\n「あなたは、会えた。私たちは、何を待っていたのですか」\n\n澪は、二人の間へ入らなかった。\n\nミーシャは、アザドを見た。\n\n相手の怒りは、今日初めて生まれたものではなかった。\n\n公開してはならない入口を、外へ開いた。\n\n誰かが答えれば、長く続いた待機が終わると思った。\n\n正しい手順を守っているだけでは、自分たちの人生が、そのまま終わってしまう。\n\n彼もまた、行動していた。\n\n「私は、会いたい人がいた」\n\nミーシャは言った。\n\n「そのために作った場所へ、人を集めた。再びつながれば、人間は本来の状態へ戻れると、私自身が信じていた」\n\nアザドは黙っていた。\n\n「ここで暮らすだけで、救われた人もいた。それは、私一人の力ではない。だが、それを理由に、私の目的を全員の目的として残した」\n\n「では、それをやめると？」\n\n「私のために、次の世代へ待機を命じることは、やめる」\n\nミーシャは栽培の記録を指した。\n\n「これを失いたくないのは、私も同じだ。残せるものは残す。だが、人を逃がすための流路を、私の許可が出るまで閉じておく必要はない」\n\nアザドは、メフルダードを見た。\n\n今度は、彼が答えた。\n\n「水を流す判断は、内と外の担当で行います。ここに人を残したままでは、始められません」\n\nアザドは、しばらく図を見ていた。\n\nやがて、栽培室の係を二人呼んだ。\n\n「持ち出す株を選ぶ。記録と、現物の番号を合わせろ。誰が持ったかも残せ」\n\n声は、まだ硬かった。\n\n彼はミーシャに礼を言わなかった。\n\n許したわけでもなかった。\n\nそれでも、手を動かし始めた。\n\n＊\n\n澪は、古い流路の注意書きを書き写した。\n\n水位が低かったときにしか使われなかった道。\n\n開ける順序。\n\n今の図では欠けていた、下流側の連絡口。\n\n記憶だけで、今も安全だと言わなかった。\n\n外の担当者が読み取れる言葉にし、現場で確かめる箇所へ印を付けた。\n\n若い係が、石の舟を残した台のことを尋ねた。\n\n流れが変われば、その辺りまで水が来る可能性がある。\n\n保存を優先するか。\n\n澪は地図へ目を落とした。\n\n「記録を取れる分だけ、取ってください。人を戻して守らないで」\n\n言ってから、少しの間、筆が動かなかった。\n\nミーシャが、隣へ来た。\n\n澪は顔を上げた。\n\n「もう一度見られました」\n\n彼は頷いた。\n\n彼女は、残っている文字を書き終えた。\n\n### 三　向こう側へ行く仕事\n\n律が配水所へ戻ったとき、机の上には三枚の図があった。\n\n古い流路。\n\n今の配管。\n\n外から来る作業班の経路。\n\n共通の場所には同じ印を付けていたが、見る方向が違うだけで、会話は止まった。\n\n澪が通訳し、ラーナが線を足している。\n\n外の担当者が、現在の水位を尋ねた。\n\nラーナが答える。\n\n相手は、同じ名前の別の計器を見ていた。\n\nすぐに気づき、問い直す。\n\n間違いは直せた。\n\nだが、そのたびに時間が掛かった。\n\n律は、水路の断面を見た。\n\n「ここ、最初にラーナが、上の点検廊へ逃げた場所ですよね」\n\nラーナが頷いた。\n\n「今は、床のあるところにも水が来てる」\n\n「映像は、まだ送れる？」\n\nラーナは係へ確かめた。\n\n低い位置の設備は使えない。\n\n上の壁にある送受信部は、別の線につながっている。\n\n保守のための視野が、残っていた。\n\n律はミーシャを見た。\n\n「外側の人たちと、同じものを見られるようにしたいです。人を一人ずつ送って、見たことを言い直すより」\n\nミーシャは端末を開いた。\n\n「技術班への接続を作る。経路を確認する人間が必要だ」\n\n「僕が行きます」\n\nラーナが、顔を向けた。\n\n律は、彼女の方を見た。\n\n「外へ戻って、向こうの人たちに、ここまでの道を説明する。誰がどこを見てるかも、合わせる」\n\n「リツが、機械を動かすの？」\n\n「動かさない。分かる人に見てもらう。僕は、君がどこで何をしてるか、向こうに伝える」\n\nラーナは、もう一度図を見た。\n\n「私が、こっちから話せばいいんじゃない」\n\n「そうできるなら、その方がいい。でも、向こうは、ここへ来たことがない。まず、向こう側に、ここを見た人間が一人ほしい」\n\n澪が、外の担当者へ確認した。\n\n研究区画から外へつながる通路は、まだ使える。\n\n作業班が到着する地点まで、一人を送れる。\n\nただし、その間に、別の通路は閉じられる。\n\n戻るには、現場の指示が必要になる。\n\n律は、ラーナを見た。\n\n彼女は答えなかった。\n\n嫌なのだと分かった。\n\n彼自身も、嫌だった。\n\n来て、すぐに、また向こうへ行く。\n\n「勝手にいなくならない」\n\n律は言った。\n\n「今、ここで言ってから行く。向こうへ着いたら、まず君につなぐ」\n\nラーナは彼の靴を見た。\n\nそれから、頷いた。\n\n「道を間違えないで」\n\n「今日は、案内してもらう」\n\n彼女は笑わなかった。\n\n彼の鞄から、接続具を取り出した。\n\n渡す前に、表と裏を確かめる。\n\nこれを使って、あの男が目の前に来た。\n\nそれを、今は自分の手で、送り出そうとしていた。\n\n「着いたら、私の名前を呼んで」\n\n「分かった」\n\n今度は、守るための道順を持って、答えた。\n\n### 四　扉を開ける人\n\n律が出発した後、研究区画の通路が、避難の経路へ組み込まれた。\n\n外へ通じる扉の前で、最初の集団が止まった。\n\n係が名簿を持っていた。\n\n住民の名簿ではない。\n\n出入りを認められた者の、名簿だった。\n\nメフルダードが、係から受け取った。\n\n脇へ置く。\n\n代わりに、広場で作った紙を出した。\n\n何人がこちらへ来たか。\n\n誰が、まだ途中にいるか。\n\n「今は、通る資格を調べる場所ではない。通った人を、確かめる場所だ」\n\n係は、紙を受け取った。\n\nラーナの母が、その前へ来た。\n\n名前を言う。\n\n連れの家族を指す。\n\n係が印を付けた。\n\n母は通路の向こうへ歩き始め、途中で振り返った。\n\nラーナは別の入口に立っていた。\n\n母は戻ってこなかった。\n\n鞄を持ち直して、先へ行った。\n\nラーナは、それを見送った。\n\n＊\n\nミーシャの端末で、外部への接続が何度も止まった。\n\n回線そのものは、生きている。\n\n新しく来た作業班へは、現地の映像と配置の資料を、そのまま渡せなかった。\n\n隠すために作った区切りが、まだ残っていた。\n\nミーシャは会社の担当者へ連絡した。\n\n復旧ではない。\n\n新しい相手への接続を作る。\n\n作業に必要な資料と中継を、内外の責任者が同じ条件で使えるようにする。\n\n担当者は、外へ出る資料を一覧にした。\n\n人が暮らす範囲。\n\n建物の位置。\n\n水路。\n\nこれまで公にされていなかった施設の配置。\n\n彼だけが持っていた地図は、その一覧の中へ入った。\n\n「後から、元には戻せません」\n\n担当者が言った。\n\nミーシャは頷いた。\n\n「受け取る者と、用途を確かめてくれ。住民の名は、点呼に必要な担当へだけ渡す。配置は、作業する全員へ」\n\n窓口を彼一人に戻さないことも、付け加えた。\n\n手続きが進む。\n\n今までは、許可を出す人間が増えると、秘密が守れなくなると思っていた。\n\n今は、その人間を増やさなければ、道が開かなかった。\n\n電話を置くと、アザドが栽培室から出てきた。\n\n小さな容器を、二つ持っている。\n\nほかの係も、記録と、運べるだけの株を持っていた。\n\n空になった棚が、見えた。\n\nミーシャが道を譲った。\n\nアザドは立ち止まった。\n\n「私は、あなたのためだけに育てたわけではありません」\n\n「あなたの仕事を、私の恩恵として記録しないでほしい」\n\nミーシャは答えた。\n\n「そのために出す資料も、私が一人で選ばない」\n\nアザドは返事をしなかった。\n\n容器を抱え直し、外へ続く道へ向かった。\n\nミーシャは栽培室へ入った。\n\n誰もいないことを、係と一緒に確かめる。\n\n水を流すために外す仕切りへ、自分の荷物を置いたままにしなかった。\n\n### 五　もう一度、こちらへ\n\n外へ出たとき、律は風の冷たさに驚いた。\n\n自分のいた場所と、空気の動きが違う。\n\n通路の出口から、作業班の待つ区画まで歩く。\n\n靴が重かった。\n\n途中で、一度だけ振り返った。\n\n今はもう、入口からラーナは見えなかった。\n\n作業班の責任者は、彼の名を聞くと、すぐに机へ呼んだ。\n\n律が説明を始めるより先に、図を指す。\n\nどこを通ったか。\n\n水を見た場所はどこか。\n\n今いる人が、直接確かめたのはどこまでか。\n\n律は、分かるところだけ答えた。\n\n「機械のことは、分かりません」\n\nそう言うと、相手は頷いた。\n\n「それでいい。見た順番で、話してください」\n\n律は、話した。\n\nゲームの話は、必要なところだけにした。\n\n映像の中でしか見られなかった区域。\n\n身体で通れた道。\n\nそれを、別々の線で示す。\n\n技術班の画面へ、現地から資料が届き始めた。\n\n人のいる範囲が、表示された。\n\n先ほどより、多かった。\n\n誰かが小さく息を吐き、別の担当へ連絡した。\n\n律は接続具を出した。\n\n外の責任者が、現地と通話する。\n\n律は、保守用の視野の動かし方を教わった。\n\n歩いて行ける場所を選ぶのではない。送受信部が捉えている範囲から、見る位置を選ぶ。\n\n最初に逃げた通路を、自分の身体で歩いたつもりにならないようにした。\n\n双方の担当がそろったのを確かめてから、律へ頷いた。\n\n「入れます」\n\n＊\n\n水音がした。\n\n律は、すぐに呼んだ。\n\n「ラーナ」\n\n少し間があった。\n\n「聞こえる」\n\n声が来た。\n\n姿は、まだ見えなかった。\n\n「着いた。こっちに、作業する人たちがいる。同じ映像を見てる」\n\n「分かった」\n\n「君は、どこ？」\n\n「赤い輪の管より上。乾いてる側。係もいる」\n\n律は、送られてきた視野を動かした。\n\n手すりが見えた。\n\nその上に、ラーナの顔があった。\n\n濁った水の近くへ、律だけが出ている。\n\nラーナは手を伸ばしかけ、止めた。\n\n「今は、身体は向こうなんだね」\n\n「うん。ここには、手を貸せない」\n\n彼女は頷いた。\n\n「じゃあ、見てて。私たちが見られない方を」\n\n律は視野を変えた。\n\n下流の表示板がある。\n\n半分に、水滴が付いていた。\n\n外の担当者が、見たい場所を指定した。\n\n律は勝手に意味を付けず、その場所へ寄った。\n\nラーナの持つ計器と、同じものではなかった。\n\n番号を読む。\n\n形を確かめる。\n\n相手の求めるものだと分かってから、値を伝えた。\n\n外の班が、さらに下流の出口へ到着した。\n\n人が住んでいない低い区画へ、流せる状態を作る。\n\n流した後の受け口も、そこから確認する。\n\n律の見ている下流側と、ラーナのいる上流側が、一つの画面の中へ並んだ。\n\n澪の声が来た。\n\n古い注意書きの、現地で確かめられた部分だけを伝える。\n\n外の担当が、今の設備で行う順序へ置き換える。\n\nラーナが、自分のする作業を言い直した。\n\n分かった、だけでは終わらなかった。\n\n＊\n\n研究区画から、人が出た。\n\nメフルダードが、最後の確認をした。\n\n残っている者はいない。\n\n持ち出す記録と作物は、受け取る側へ引き渡した。\n\nミーシャも、境目の扉から出た。\n\n上流の担当が、準備を終えた。\n\n外の責任者が、下流の確認を求めた。\n\n律は、表示板を見た。\n\n水位が変わり始めた。\n\n読み上げる。\n\n少し待つ。\n\nもう一度読む。\n\n一度見ただけの数字を、答えにしなかった。\n\n外の担当者が、現地の係へ指示を出した。\n\nラーナが、もう一つの計器を見ている。\n\n水の音が変わった。\n\n「流れてる」\n\n律が言った。\n\n外から、問いが来た。\n\nどちらへ。\n\n律は視線を動かした。\n\n昨日まで水のなかった、古い流路の方へ。\n\n「研究区画の下を通る方です。向きは、図の矢印と同じ」\n\nラーナが肩の力を少し抜いた。\n\nそのとき、律の視野が揺れた。\n\n水ではなく、映像全体が、わずかに横へずれた。\n\n声も、一度途切れた。\n\n係が、送受信部の状態を伝えている。\n\n低い位置から、水が回り込んでいた。\n\nその系統は、切り離す必要がある。\n\n律はラーナを呼んだ。\n\n「映像が、切れるかもしれない」\n\n彼女は顔を上げた。\n\n「今すぐ？」\n\n「分からない。こっちの作業班との連絡は残る。僕の姿は――」\n\n声が途切れた。\n\n戻った。\n\nラーナは、まだこちらを見ていた。\n\n律は急いだ。\n\n「切れたら、僕の返事を待たないで。現地の係と、通話の担当の話を聞いて」\n\nラーナは頷いた。\n\n視界の端に、接続終了までの表示が出た。\n\n今度は、見える時間が残っていた。\n\n律は、水の流れをもう一度確かめた。\n\n「僕は、向こうにいる。今は、そっちへ帰れないけど」\n\nラーナは何か言った。\n\n最初の音が、訳されずに届いた。\n\n続いて、言葉になった。\n\n「分かってる」\n\n彼女は言った。\n\n「今度は、分かってるから」\n\n水の向こうで、ラーナが一歩下がった。\n\n係が彼女へ、手を差し出した。\n\n彼女は、その手を取った。\n\n映像が切れた。\n\n### 六　ここにいる人を数える\n\nラーナの目の前から、リツが消えた。\n\n今度は、消える前に知っていた。\n\n足元には、本物の水があった。\n\n横には、本物の手があった。\n\nラーナは係の腕を借り、乾いた段へ上がった。\n\n連絡器の線を、壁の金具から外す。\n\n持ち帰ろうとして、係に止められた。\n\n「線は、あと」\n\n自分が母へ言ったことと、ほとんど同じだった。\n\nラーナは頷き、必要な記録だけを抜いた。\n\n残しておく機器は、その場へ置いた。\n\n上の待避所へ戻ると、ファリデが人数を確かめていた。\n\n戻った人の名へ、印を付ける。\n\nラーナの名にも、付いた。\n\n彼女は、紙を見た。\n\nまだ、空白があった。\n\n外から来た作業班と、メフルダードたちの分だった。\n\n水が逃げ始めても、全員が戻るまでは終わらない。\n\nラーナは、別の連絡器を取った。\n\n＊\n\n外側で、律も名を聞いていた。\n\nラーナは戻ったか。\n\n係は。\n\n最後の確認に行った人は。\n\n返事が来ないときには、同じ質問を何度も重ねないようにした。\n\n向こうで、答えるための作業をしているかもしれなかった。\n\nそれでも一度、立ち上がりかけた。\n\n責任者が、律の前へ図を置いた。\n\n「戻る道は、今、確認中です」\n\n律は椅子へ座り直した。\n\n道が開く前に走っても、帰れない。\n\n画面の一つに、ラーナの名が出た。\n\n係と共に、待避所へ移動。\n\n律は、机の縁をつかんでいた手を離した。\n\nその後も、名前が増えた。\n\nメフルダード。\n\nミハイロ。\n\n澪。\n\n外の作業班。\n\n最後の空白に印が付いたとき、誰かが、今夜の次の担当を呼び始めた。\n\nまだ、朝まで測り続けなければならない。\n\nそれでも、一度だけ、部屋の中の声が小さくなった。\n\n息をつく音が聞こえた。\n\n＊\n\n研究区画へ、水が入った。\n\n植えられていた場所と、持ち出した後の空いた場所を、同じように水が覆った。\n\n仕切りの外された流路を通り、下の区画へ流れていく。\n\n居住区の水位は、上がる速さが鈍り、やがて下がり始めた。\n\n一つの数字だけで安全にはしなかった。\n\n別の場所でも測り、壁の動きも確かめた。\n\n外の作業班は、その先の出口を、夜の間じゅう見ていた。\n\n大部分の家は残った。\n\n低い場所の数軒と、物置、東の作業路には、すぐに戻れなくなった。\n\n失われた記録もあった。\n\n部屋ごと保ってきた栽培の環境は、戻せなかった。\n\n持ち出した株の容器へ、係が新しい番号を付けた。\n\n場所を移した時刻。\n\nどんな状態で運んだか。\n\nここから先は、続きの記録だった。\n\n＊\n\n夜遅く、律は内側へ戻る車に乗った。\n\n途中からは、歩いた。\n\n案内された道を、今度は自分の足で覚えた。\n\n待避所の入口で、ラーナが座っていた。\n\n上着の袖が、泥で黒くなっている。\n\n彼を見ると立ち上がり、膝を少し曲げた。\n\n「痛めた？」\n\n受話器の訳が、遅れて出た。\n\n「少し。転んだだけ」\n\n律は彼女の前で、足を止めた。\n\n言いたいことが、いくつもあった。\n\n大丈夫だったか。\n\n怖かった。\n\nまた会えた。\n\n結局、最初に口から出たのは、一つだった。\n\n「戻った」\n\nラーナは彼を見た。\n\nそれから、自分の袖を見た。\n\n「汚れるよ」\n\n律は頷いた。\n\n彼女が止める前に、肩へ手を置いた。\n\n今度は、そこに重さがあった。\n\nラーナも腕を伸ばした。\n\n顔は、律には見えなくなった。\n\nしばらくして、彼女が少しだけ笑った。\n\n「ちゃんと、戻ってきた人の話だった」\n\n律は、返事をする代わりに、少しだけ強く抱き直した。\n\n\n### 七　助かった後に残るもの\n\n翌朝、ラーナは窓口へ行った。\n\n机が二つ増えていた。\n\n担当者は、最初に通知を持っていったときと同じ人だった。\n\n「ご家族は」\n\n「二人とも、います」\n\n紙へ印が付いた。\n\n「自宅は、点検が終わるまで入れません」\n\nラーナは頷いた。\n\n「いつ、誰が確かめるか、教えてください」\n\n担当者が予定表を出した。\n\nまだ埋まっていない欄もあった。\n\n「決まっていないところは？」\n\n「午後に、ここへ掲示します。変更した時刻も」\n\nラーナは、その場所を確かめた。\n\n机の横に、新しい地図があった。\n\n自分と、ファリデと、外の担当者が確かめた道。\n\n赤い囲みの中には、家の印があった。\n\n空の通路ではなくなっていた。\n\n＊\n\nミーシャが住民の前へ出たのは、その日の午後だった。\n\n食事と、当面の住まいの説明が終わった後。\n\n誰も、彼の話を聞くために、休むことを待たされなかった。\n\n彼は、コーエンという名で呼ばれてきたことを、自分で話した。\n\n何を覚えているか。\n\n何を、そうだと信じていたか。\n\n何を、自分の判断で隠してきたか。\n\n知っている現地の言葉で話し、足りない語はメフルダードへ確かめた。\n\n澪一人を、自分の説明の窓口にはしなかった。\n\n家と畑の損傷。\n\n外へ渡さなかった図。\n\n限られた者しか知らなかった食事。\n\n現地へ接触した外の人間に、自分の指示で危害を加えさせたことも、話した。\n\n律は後ろで聞いた。\n\nその説明のために、前へ立つよう求められはしなかった。\n\nミーシャは、自分の出せる費用と資料を示した。\n\n記録を受け取る住民側の窓口と、外側の担当者も紹介した。\n\n質問は、すぐには出なかった。\n\n最初に立った畑の管理者は、今日の水をどうするかと聞いた。\n\nファリデとメフルダードが答えた。\n\nミーシャは、自分の話へ戻そうとはしなかった。\n\n＊\n\nその後、律はミーシャと短く話した。\n\n澪が訳した。\n\n「帰ったら、もう一度、警察で話します。あなたの説明と違うところがないか、聞かれています」\n\n「私も、話す」\n\n「僕は、見たことを話します。昨日助かったことも、店の前で起きたことも」\n\nミーシャは頷いた。\n\n律は、片手の包帯を見た。\n\nもう、少し汚れていた。\n\n「どっちかで、もう片方を消さないでください」\n\nミーシャは、少し時間を掛けた。\n\n「消さない」\n\n「ラーナへの接続や、現地の作業は、別の担当へ連絡できますね」\n\n「できるようにした。現地の係にも、同じ連絡先がある」\n\n律は頷いた。\n\nそれを確かめたかった。\n\nミーシャは、礼を言わなかった。\n\n許すかどうかも、尋ねなかった。\n\n律は、待避所の方へ戻った。\n\nラーナが入口で待っていた。\n\n彼女は何も聞かず、隣を歩いた。\n\n＊\n\nラーナは、その夜、栽培の記録を見せてもらった。\n\n父の名は、なかった。\n\nあると思っていたわけではない。\n\nそれでも、一度は確かめたかった。\n\n母のところへ戻ると、金属の箱が開いていた。\n\n若いころのラーナの作業許可。\n\n端の紐を、父が直していた。\n\n「お父さんの名前、なかった」\n\n母は頷いた。\n\n何の記録か、説明しなくても分かった。\n\n「選べるものだったんだって。でも、知らなかった」\n\n母は、許可証を見た。\n\n「そうね」\n\nしばらく、二人とも黙っていた。\n\n知ったからといって、やり直せることではなかった。\n\n母は許可証を戻した。\n\n「今度、同じ物を食べるときには、何なのか聞けるようにしてね」\n\nラーナは頷いた。\n\n### 八　今度の火曜日\n\n数日後、澪は石の舟を見に行った。\n\n係が同行した。\n\n一人で、記憶の中の道へ入らなかった。\n\n台の下に、泥が残っていた。\n\n壁の低いところは、色が変わっている。\n\n舟は残っていた。\n\n写真を撮り、今の場所の名前と、記録した日を付けた。\n\n昔の名前だけで、資料を作らなかった。\n\n戻ると、ミーシャは、栽培の係たちと話していた。\n\n持ち出した株は、全てが残ったわけではない。\n\n状態のよいものを育て直す。\n\n加工済みの分は、量と保管の状態を確かめる。\n\nその話し合いには、一般の住民から選ばれた人もいた。\n\nアザドも、その一人として記録を説明していた。\n\n昔から知っていたことと、今はじめて分かったことを、別の欄へ書く。\n\n一人が全てを信じるか、全てを捨てるかという席ではなくなっていた。\n\n澪は、終わるまで待った。\n\nミーシャと、外の長い台へ座る。\n\n思い出の台ではなかった。\n\n隣で誰かが、空いた容器を洗っていた。\n\n「食べるか、聞かれました」\n\n澪が言うと、ミーシャが顔を向けた。\n\n「何と？」\n\n「今すぐには決めませんと。まず、ほかにも選べる人を増やす説明に、協力したいです」\n\n彼は頷いた。\n\n「私は、覚えているのが、嬉しいことばかりではありませんでした」\n\n彼女は言った。\n\n「でも、覚えていたから、ここへ来られました」\n\n「私もだ」\n\nミーシャは手元を見た。\n\n「それを、ほかの人間がどれほど欲しいかまで、私が決めていた」\n\n「これから、聞いてください」\n\n澪は言った。\n\n彼は顔を上げ、頷いた。\n\n水の音がした。\n\n昔と違う方向から、流れていた。\n\n＊\n\n「次に生まれるまでの間は、私たちで違う」\n\nミーシャが言った。\n\n澪は頷いた。\n\n覚えている人生の年数が違う。\n\n今の人生を終える時期も、同じではない。\n\n同じものを食べれば、同じ年に、同じ場所で会えるわけではなかった。\n\n「また待てばいいと、簡単には言えませんね」\n\n彼女が言うと、彼は目を伏せた。\n\n「もう、言わない」\n\n澪は、少し身を寄せた。\n\n「今は、ここにいます」\n\n彼は顔を上げた。\n\n「ええ」\n\nそれから、少し笑った。\n\n昔とは違う声だった。\n\n昔から知っている間も、あった。\n\n澪は、その両方を見ていた。\n\nミーシャも、彼女の顔を見た。\n\n「この後は？」\n\n澪は端末を出した。\n\n古い地図ではなかった。\n\n来週の予定。\n\n「火曜の午後なら、少し空いています。今は、同じ現場にいるので」\n\n彼も予定を開いた。\n\n外へ戻って説明する仕事。\n\n現地で話を聞く時間。\n\n空欄ばかりではなかった。\n\n一つの約束を、相手へ確かめて動かした。\n\n「火曜日に」\n\n彼が言った。\n\n澪は頷いた。\n\n「では、その日に」\n\n彼女が立つと、彼も立った。\n\n今度は、どちらも、相手がどの道で帰るかを知っていた。\n\n### 九　帰りの切符\n\n律が東京へ戻ると、机に、次の展示の資料が置かれていた。\n\n秋山が、隣から顔を上げた。\n\n「おかえり」\n\n「戻りました」\n\n「靴は？」\n\n律は足元を見た。\n\n替えてきていた。\n\n「大丈夫です」\n\n秋山は頷き、資料を彼の方へ回した。\n\n入口の確認。\n\nどこから来たデータか。\n\n誰が、何に使うことを認めたか。\n\n再構成と、現在の中継を、どう区別するか。\n\n律は座り、最初から読んだ。\n\nあの場所を、次の展示へ加える話にはしなかった。\n\n話すときには、話していい範囲を、相手と決める必要があった。\n\n捜査のために呼ばれた日には、会社を出た。\n\nミーシャも資料を提出し、説明を続けていた。\n\n彼は会社の執行の職を離れた。\n\n現地への支援と、起こしたことの責任は、別々に扱われていた。\n\n律は、その経過の全てを追うために、毎日を使わなかった。\n\n仕事をし、食事をし、ラーナへ連絡した。\n\n＊\n\n返事は、すぐには来ない日もあった。\n\n届く先は、個人の携帯端末ではない。\n\n作業所の、線でつながった連絡用の端末だった。\n\nラーナが仕事を終え       if (/^\*全六部/.test(line) || line === '*タイトル*') { flush(); continue; }
      if (/^\*.*完\*$/.test(line)) { flush(); boundary = true; add(line.slice(1,-1), 'end'); boundary = true; continue; }
      if (/^\*第.+部・了\*$/.test(line)) { flush(); add(line.slice(1,-1), 'note'); continue; }
      paragraph.push(line);
    }
    flush();
    return {blocks, chapters, parts};
  }
  function paginate(blocks, target) {
    const limit = Number.isFinite(target) ? Math.max(120, Math.min(1200,target)) : 360;
    const pages = []; let current = [], count = 0;
    function flush() {
      if (!current.length) return;
      pages.push({blocks:current, startId:current[0].id, endId:current[current.length-1].id, chapter:current[0].chapter, part:current[0].part});
      current = []; count = 0;
    }
    for (const block of blocks) {
      if (block.breakBefore || block.kind === 'title' || block.kind === 'end') flush();
      const size = Array.from(block.text).length;
      if (current.length && count + size > limit) flush();
      current.push(block); count += size;
      if (block.kind === 'title' || block.kind === 'end') flush();
    }
    flush(); return pages;
  }
  function pageForAnchor(pages, rawAnchor) {
    const anchor = Number.isFinite(rawAnchor) ? Math.max(0,Math.floor(rawAnchor)) : 0;
    const i = pages.findIndex(page => page.endId >= anchor);
    return i < 0 ? Math.max(0,pages.length-1) : i;
  }
  function validAnchor(value, length) {
    const n = Number(value);
    return value !== null && value !== '' && Number.isInteger(n) && n >= 0 && n < length ? n : null;
  }
  return {parseMarkdown, paginate, pageForAnchor, validAnchor};
});
</script>
<script>(function(){
  'use strict';
  const story = JSON.parse(document.getElementById('story-data').textContent);
  const {parseMarkdown,paginate,pageForAnchor,validAnchor} = ReaderCore;
  const manuscript = parseMarkdown(story.markdown);
  const $ = id => document.getElementById(id);
  const keys={settings:'yakusoku-reader-settings-v1',progress:'yakusoku-reader-'+story.version};
  let storageAvailable=true;
  function load(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(_){return null;}}
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(_){storageAvailable=false;}}
  const stored=load(keys.settings)||{};
  const mobile=window.matchMedia('(max-width:600px)').matches;
  const allowed=[240,360,480];
  const settings={font:Number.isFinite(stored.font)?Math.max(16,Math.min(28,stored.font)):(mobile?18:21),target:allowed.includes(stored.target)?stored.target:(mobile?240:360),theme:['light','dark'].includes(stored.theme)?stored.theme:(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
  const restored=load(keys.progress)||{};
  const hashAnchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);
  const resumeAnchor=validAnchor(restored.anchor,manuscript.blocks.length);
  let pages=paginate(manuscript.blocks,settings.target);
  let pageIndex=pageForAnchor(pages,hashAnchor===null?(resumeAnchor||0):hashAnchor);
  let maxVisited=validAnchor(restored.maxVisited,manuscript.blocks.length)||0;
  let toastTimer;
  function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent='';},4000);}
  function applySettings(){document.documentElement.dataset.theme=settings.theme;document.documentElement.style.setProperty('--reading-size',settings.font+'px');$('font-value').textContent=settings.font+'px';$('font-minus').disabled=settings.font<=16;$('font-plus').disabled=settings.font>=28;$('page-size').value=String(settings.target);$('theme-toggle').textContent=settings.theme==='dark'?'紙の色にする':'夜の色にする';save(keys.settings,settings);}
  function persist(){const anchor=pages[pageIndex].startId;maxVisited=Math.max(maxVisited,pages[pageIndex].endId);save(keys.progress,{anchor,maxVisited});try{history.replaceState(null,'','#at='+anchor);}catch(_){}if(!storageAvailable)$('toast').textContent='このブラウザーでは読書位置を保存できません。';}
  function render(){
    const page=pages[pageIndex];if(!page)return;
    const chapter=manuscript.chapters[page.chapter];const part=manuscript.parts[page.part];
    $('part-label').textContent=part?part.title:story.title;
    $('chapter-title').textContent=chapter?chapter.title:'';
    $('chapter-title').hidden=!chapter;
    $('chapter-position').textContent=chapter?'第'+(page.chapter+1)+'章 / 全'+manuscript.chapters.length+'章':'';
    const fragment=document.createDocumentFragment();
    page.blocks.forEach(block=>{const p=document.createElement('p');p.textContent=block.text;if(block.kind!=='text')p.className=block.kind;fragment.appendChild(p);});
    $('prose').replaceChildren(fragment);
    $('reading-page').classList.toggle('card',page.blocks[0].kind==='title'||page.blocks[0].kind==='end');
    $('page-count').textContent=(pageIndex+1)+' / '+pages.length;
    $('previous').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;
    $('next').textContent=pageIndex===pages.length-1?'読了':'次のページ →';
    const progress=$('progress');progress.setAttribute('aria-valuenow',String(pageIndex+1));progress.setAttribute('aria-valuemax',String(pages.length));$('progress-fill').style.width=((pageIndex+1)/pages.length*100)+'%';
    document.title=(chapter?chapter.title+' | ':'')+story.title;
    persist();window.scrollTo(0,0);if(!document.querySelector('dialog[open]'))$('reading-page').focus({preventScroll:true});
  }
  function move(delta){const n=Math.max(0,Math.min(pages.length-1,pageIndex+delta));if(n!==pageIndex){pageIndex=n;render();}}
  function showDialog(id){$(id).showModal();}
  function showContents(){
    const body=$('toc-body');body.replaceChildren();
    const note=document.createElement('p');note.className='dialog-note';note.textContent='未読の章は、内容を伏せて番号だけで表示します。';body.appendChild(note);
    manuscript.parts.forEach(part=>{
      const section=document.createElement('section');section.className='toc-group';
      const heading=document.createElement('h3');heading.textContent=part.label;section.appendChild(heading);
      manuscript.chapters.filter(c=>c.part===part.index).forEach(chapter=>{
        const button=document.createElement('button');button.type='button';button.className='toc-link';button.disabled=chapter.startId===null;
        if(chapter.index===pages[pageIndex].chapter)button.setAttribute('aria-current','true');
        const mark=document.createElement('span');mark.className='toc-mark';mark.textContent=chapter.startId<=maxVisited?'✓':'';mark.setAttribute('aria-hidden','true');
        const label=document.createElement('span');label.textContent=chapter.startId<=maxVisited?chapter.title:'第'+chapter.label+'章';
        button.append(mark,label);button.addEventListener('click',()=>{pageIndex=pageForAnchor(pages,chapter.startId);$('contents').close();render();});section.appendChild(button);
      });body.appendChild(section);
    });showDialog('contents');
  }
  $('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
  $('contents-open').addEventListener('click',showContents);$('settings-open').addEventListener('click',()=>showDialog('settings'));
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('close',()=>$('reading-page').focus({preventScroll:true}));dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});});
  $('font-minus').addEventListener('click',()=>{settings.font=Math.max(16,settings.font-1);applySettings();});
  $('font-plus').addEventListener('click',()=>{settings.font=Math.min(28,settings.font+1);applySettings();});
  $('theme-toggle').addEventListener('click',()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings();});
  $('page-size').addEventListener('change',()=>{const anchor=pages[pageIndex].startId;settings.target=Number($('page-size').value);pages=paginate(manuscript.blocks,settings.target);pageIndex=pageForAnchor(pages,anchor);applySettings();render();});
  $('reading-page').addEventListener('click',()=>{if(window.getSelection()?.toString())return;move(1);});
  document.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||document.querySelector('dialog[open]'))return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable)return;
    if(event.target.closest('button')&&(event.key===' '||event.key==='Enter'))return;
    const direction=(event.key===' '?(event.shiftKey?-1:1):({'ArrowRight':1,'PageDown':1,'ArrowLeft':-1,'PageUp':-1,'Backspace':-1})[event.key]);
    if(direction){event.preventDefault();move(direction);}
  });
  window.addEventListener('hashchange',()=>{const anchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);if(anchor!==null){pageIndex=pageForAnchor(pages,anchor);render();}});
  applySettings();render();
  if(hashAnchor===null&&resumeAnchor>0)toast('前回の続きから再開しました。');
})();
</script>
