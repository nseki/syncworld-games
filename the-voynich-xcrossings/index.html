<script id="story-data" type="application/json">{"title": "The Voynich XCrossings", "edition": "第一部〜第四部＋ラーナルート・第3稿", "version": "c26ec5b23835747d", "markdown": "# The Voynich XCrossings\n\n## 第一部　閉じられる道\n\n### 序　そこにいた人\n\n「戻らないで！」\n\n声が届いたときには、ラーナの右足は浮いていた。\n\n水が膝の裏を払い、身体が横を向いた。手すりに掛けた腕だけが残った。肩の奥で、何かが伸びた。\n\n来た道へ戻れば階段がある。階段を上がれば、電話がある。\n\nその道から、次の水が来た。\n\n泡の下に、折れた木箱が見えた。壁に当たり、向きを変えずに近づいてくる。\n\nラーナは身を縮めた。\n\n木箱が手すりへぶつかった。\n\n掌に振動が走る。壁に留められた金具が一つ、石ごと抜けた。\n\n「鞄を離して！」\n\n向こう岸の青年が叫んだ。\n\n記録が入っている。\n\nそう思った間に、鞄が水を受けた。紐が首の横へ食い込んだ。\n\nラーナは肩を抜いた。\n\n鞄が消えた。\n\n引かれる力が軽くなった。脚が壁に当たり、靴底が何かを擦った。足場だ。踏もうとすると、また水に剥がされた。\n\n「左の管の上。四角い穴がある！」\n\n青年は斜め上から指していた。\n\n彼の側には高い足場がある。その角度から、ラーナの背後が見えるらしい。\n\n顔を上げた。\n\n管の陰に、黒い四角があった。下へ鉄の段が続いている。一番下は水の中だった。\n\n手すりから、腕一本分。\n\n遠かった。\n\n「横棒に足を。そこの留め具は、まだ壁についてる」\n\nラーナは水の中で膝を曲げた。靴の先が横棒を探り当てた。\n\n踏む。\n\n腰が上がる。\n\n片手を離した。\n\n身体が流れへ開き、息が止まった。\n\n指先が鉄の段に掛かった。\n\n引いた。動かなかった。\n\n両手を移し、肘を曲げた。膝が石へぶつかったが、今度は足を載せる場所があった。\n\n後ろで金属が裂けた。\n\nラーナは上った。\n\n開口部の蓋は、拳一つ分しか動かなかった。\n\n横へ引く。止まる。\n\nもう一度引く。同じところで止まる。\n\n「開かない？」\n\n彼女は答える代わりに、蓋の溝へ指を入れた。\n\n砕けた石が詰まっていた。\n\n腰の工具を抜く。刃を差し込み、屑を落とす。指が震えて、金属が石に何度も触れた。\n\n青年が何か言いかけた。\n\nだが、声は続かなかった。\n\n待っている。\n\nラーナは息を吐き、もう一度差し込んだ。\n\n蓋が滑った。\n\n肩を入れる。腹を縁へ載せる。脚を引き込む。\n\n最後に靴が水から抜けた。\n\n低い廊下の床へ、這ったまま進んだ。\n\n掌の下に、動かない石があった。\n\nラーナはそこへ額を近づけ、息をした。\n\n＊\n\n水路の向こうにも、同じ高さの廊下があった。\n\n青年が、壁の隙間からこちらを見ている。\n\n「聞こえる？」\n\nラーナは頷いた。\n\n頷いただけでは伝わらないと思い、手を上げた。\n\n「そっち、出口は？」\n\n廊下の奥に、小さな灯りが見えた。\n\n「上の連絡路へ、行けると思う」\n\n「じゃあ、下へ戻らなくていい」\n\n言われて初めて、戻らなくてよいのだと分かった。\n\n膝が痛んだ。布の下に血が滲んでいた。\n\n彼女は片脚ずつ動かした。\n\n「歩ける？」\n\n「歩く。あなたは？」\n\n「こっちは大丈夫」\n\nラーナは壁へもたれた。\n\n青年の後ろには、白っぽい石の面があった。足元に狭い通路。その先は行き止まりに見える。\n\n「名前」\n\n彼が顔を上げた。\n\n「聞いてなかった」\n\n「リツ」\n\n彼は、自分を指した。\n\n「君は？」\n\n「ラーナ」\n\n＊\n\n部屋の電話が鳴った。\n\n男は受話器を取り、机の映像を見た。\n\n水路と、その上に離れて座る二人。\n\n『ミーシャ。二人とも水から上がりました。接触は続いています』\n\nサングラスの奥で、男の目が動いた。\n\n「接続元は」\n\n『まだ確認中です』\n\n「切れ」\n\n＊\n\n「ラーナ。じゃあ、上で――」\n\n青年の声がなくなった。\n\n姿も、なくなった。\n\nラーナは動かなかった。\n\n目をそらしていなかった。\n\n彼が座っていた場所に、白い壁があった。\n\n「リツ？」\n\n返事はない。\n\n人が横へ退いたのなら、狭い通路を通るはずだった。下へ落ちたのなら、水に当たる音がするはずだった。\n\nどちらもなかった。\n\n足元では、水が流れ続けている。\n\n＊\n\n男の机で、映像が閉じた。\n\nその下から、古い本の画像が現れた。\n\n黄ばんだページに、緑の葉と、絡み合う根が描かれていた。絵を避けるように、丸い輪と背の高い線が行を作っている。\n\n画面の端に、資料名があった。\n\n《Voynich Manuscript — Beinecke MS 408》\n\n---\n\n# The Voynich XCrossings\n\n*タイトル*\n\n### 一　希望欄\n\n*三時間前*\n\n「その区域には、今朝から入れません」\n\n窓口の担当者は、ラーナの勤務証を返した。\n\n「そこで働いてるんですけど」\n\n「所属先から、変更の申請をお願いします」\n\n「仕事を変えたいんじゃありません。昨日の点検が終わってないんです」\n\n担当者は机の画面を見た。\n\n同じ返事が来る前に、ラーナは記録の控えを置いた。\n\n「閉じるなら、その前に調べないと。水の量が合ってない」\n\n隣から母が別の紙を差し出した。\n\n「移転先の希望は、ここでいいんですね」\n\n「まだ話してる」\n\n「私の話もあるの」\n\n担当者の手が、母の用紙へ移った。\n\nその上端に、白い十字を抜いた赤い印がある。四本の腕の先が、それぞれ小さく割れていた。\n\n母は同居者の欄へ指を置いた。\n\n「夫は、もう亡くなっていますけど」\n\n「その欄は空けてください」\n\n母の指が、一つの欄を飛ばした。\n\nラーナは控えを引き戻した。\n\n「点検の許可を出す人の名前を教えてください」\n\n「管理責任者です」\n\n「その人の名前です」\n\nようやく、担当者が顔を上げた。\n\n＊\n\n外では、荷車の車輪が溝に落ちていた。\n\n押している少年にラーナが肩を貸すと、母は先にパンを買った。一枚を紙で包み、戻ってきた娘へ渡す。\n\n「メフルダードだって」\n\nラーナは、用紙の余白に書いた名前を見せた。\n\n「知ってる。昨日も倉庫にいた」\n\n「だったら最初から言ってよ」\n\n「その人に会いに行く間に、私は希望を出してくる」\n\n母の鞄には、もう移転先の図が入っていた。\n\n「本当に移るつもり？」\n\n「書かなかったら、好きな部屋が残ると思う？」\n\n「おかしいと思わないの」\n\n「思うよ」\n\n母はパンを折った。\n\n「だから、せめて窓のある方を選ぶ」\n\nラーナは熱いところを噛んでしまい、口を開けた。\n\n母が笑う。\n\n「食べてから怒りなさい」\n\n「今、食べてる」\n\n「じゃあ、その間は休み」\n\n角で別れるとき、母は娘の襟を直した。\n\n「帰りに油を買ってきて。荷物をまとめても、ご飯は作るから」\n\nラーナは、用紙の端へ忘れないように書いた。\n\nメフルダード。\n\n油。\n\n並べると、少し腹が立たなくなった。\n\n### 二　合わないもの\n\n作業所の扉にも、赤い印の通知が貼られていた。\n\n東側の点検を見合わせること。\n\n中で同僚が、返却された工具を並べていた。\n\n「働かなくていい日だと思ってた」\n\n「点検しないで壊れたら、直すのは誰？」\n\n「そのとき働く」\n\n「私がね」\n\n彼は笑って、机の引出しを開けた。\n\n昨日の控えが、曲がらないよう板に挟まれていた。\n\nラーナは礼を言い、読み取り機を机の端子へつないだ。\n\n画面に昨日の図を出す。閉鎖通知の境目を重ねる。\n\n水量の異常が出た場所は、境目の外だった。\n\n家は内側にある。\n\n「この線、何で決めたんだろう」\n\n「聞くと思った」\n\n同僚が、内線番号を書いた紙を置いた。\n\nラーナが受話器を取ると、戸口からファリデが言った。\n\n「そっちにはいないよ。西の倉庫」\n\n彼女は鍵を置き、ラーナの横から画面を覗いた。\n\n「その前に、こっちを見て」\n\n持ってきた紙に、取水と戻りの値が並んでいた。\n\n「送った分が、戻ってこない」\n\n「畑の方で使った分は？」\n\n「引いてある。貯めた分も」\n\nラーナは昨日の値を写した。\n\n数字の差は大きくない。だが、同じ向きの差が続いていた。\n\n「記録装置の線、接触が悪かったんです。私の値にも誤差があるかも」\n\n「こっちの計器まで、あなたの線につながってるの？」\n\nラーナは顔を上げた。\n\nファリデが鍵を押し出す。\n\n「だから、見てきて。畑へ行く水を、思い込みで減らされたら困る」\n\n＊\n\n西の倉庫では、職員が床へ白い線を引いていた。\n\nラーナはその線をまたいで、メフルダードの前へ出た。\n\n「私の家を移す根拠を知りたいんです」\n\n差し出した控えを、彼は受け取った。\n\n「昨日の点検か」\n\n「提出しました」\n\n彼の手元にある一覧には、昨日の途中までしか値がなかった。\n\nラーナは自分の控えを指した。\n\n「この後も測ってます」\n\nメフルダードは職員を呼び、写しを取らせた。\n\n「記録室へ入る許可は出す。ただし、奥の作業路には出ないように」\n\n「そこで測った値なんですけど」\n\n「今日は別の確認が入る」\n\n「設備の？」\n\n彼は答える前に、脇の電話を見た。\n\n鳴ってはいなかった。\n\n「重ねて作業をしないためだ」\n\nラーナは、床の線へ目を落とした。\n\nまだ壁のない、母と自分の次の部屋。\n\n「水は、作業の順番を待ってくれません」\n\n「分かっている」\n\nメフルダードは、紙の端へ番号を書いた。\n\n「変化があったら、ここへ。呼び出しても返事がなければ、倉庫の係へ伝える。担当の名前も聞きなさい」\n\n彼女は紙を受け取った。\n\n「電話したことだけで、終わりにしないでください」\n\n「君も、返事を待たずに奥へ行くな」\n\n倉庫を出ると、ファリデが扉の脇で待っていた。\n\n「あの人も、全部は聞かされてない顔だね」\n\n「知らないなら、閉じないでほしい」\n\n「知らないから、閉じるのかもしれない」\n\nラーナはそれ以上、言い返せなかった。\n\n### 三　境目の向こう\n\n計量所の記録室には、朝の暖かさが入ってこなかった。\n\nラーナは作業所へ到着を知らせ、装置へ線をつないだ。\n\n警告が出る。\n\n接続部を押さえると消えた。\n\nいったん抜き、予備の線に替えた。\n\n今度は出ない。\n\n同じ時間の記録を二度読む。値は一致した。だが、記録の途中に空白がある。\n\n昨夜の故障ではなかった。\n\nついさっきまで動いていた機器が、今朝、途中で止まっている。\n\nラーナはメフルダードの番号を回した。\n\n倉庫の係が出た。\n\n状況と計器の番号を伝え、名前を聞く。係は復唱してから、確認に人を出すと言った。\n\n「私はここで待ちます」\n\n電話を置いた。\n\n机の端に、今日の作業予定表があった。東側は、点検見合わせ。\n\nしかし、隣の欄には小さく《試験中》と出ている。\n\n何の試験かは書かれていなかった。\n\n水路に面した扉の窓を覗く。\n\n向こう岸に、人がいた。\n\n＊\n\n薄い色の上着を着た青年だった。\n\n扉を開けると、こちらに気づいた。\n\n「そこ、上へ戻れる？」\n\n「戻れるけど。あなた、誰？」\n\n「道を間違えた。下りる方は開いてたんだ」\n\n彼は自分の来た側を指した。\n\n「途中で戻れなくなって。別の出口を探してる」\n\nラーナは向こう岸の通路を見た。\n\n彼の後ろの扉には、赤い灯りが点いている。\n\n「今、作業してる人がいるはず。勝手に奥へ行かないで」\n\n「じゃあ、ここで待つ」\n\n青年は本当に止まった。\n\n扉の脇に、細い表示灯が三つ並んでいた。\n\n左から一つずつ灯り、全部消える。それを繰り返している。\n\nラーナが何度も通った場所だが、昨日までは消えていた。\n\n「それ、新しいの？」\n\n青年が表示灯を指した。\n\n「知らない」\n\n「さっきも、別の入口で見た」\n\n「どこの？」\n\n「広場の、水門へ下りるところ」\n\nラーナの知る広場から、ここへ直接下りる道はなかった。\n\n説明を求めようとすると、記録室の電話が鳴った。\n\n＊\n\nメフルダードだった。\n\n『記録室にいるか』\n\n「います。向こうの作業路に、知らない人がいます」\n\n少し間が空いた。\n\n『作業者か』\n\n「印はないです。道を間違えたって」\n\n受話器の向こうで、紙が擦れた。\n\n『声は聞こえるのか』\n\nラーナは窓の外を見た。\n\n青年は水路の上流を見ていた。\n\n「話してますけど」\n\n『その人を動かさないで。君も待つように』\n\n通話が切れた。\n\nラーナは、受話器を持ったままになった。\n\nまず名前を聞かれると思っていた。\n\nあるいは、けがをしていないか。\n\n声が聞こえるか、とは、どういう確認なのだろう。\n\n### 四　二つの計器\n\n記録室の扉から、青年へ待つよう伝えた。\n\n彼が頷き、水路沿いの壁を見た。\n\n「あの印、ちょっと変わってるね」\n\n古い扉の上の十字だった。\n\n「変？」\n\n「先が。僕の知ってる形と違う」\n\n「昔から、あれだけど」\n\n「そうか。僕の方が、混ぜて覚えてるのかもしれない」\n\n彼はそれ以上、説明しなかった。\n\n向こうの作業着でもないし、管理の人間でもない。ラーナの返事を待つときに、時々、何もないところへ目をやった。\n\n「ここへ来るように、誰かに言われたの？」\n\n「いいや。今日は港の方を見に来たんだ」\n\n「港？」\n\n「工房と水門を。仕事で、案内する順番を考えてて」\n\nラーナは眉を寄せた。\n\n「閉鎖する場所を？」\n\n彼は答えかけて、やめた。\n\n「閉鎖は、いつ決まった？」\n\n「私たちには、昨日」\n\n青年が、こちらを見た。\n\n今度は、何もない場所へ目を向けなかった。\n\n＊\n\n装置から短い警告音がした。\n\nラーナは机へ戻った。\n\n線は抜けていない。読み込みも止まっていない。\n\nだが、水位の値が上がっている。\n\n窓から、壁に据えた針式の計器を見た。\n\nそちらも上がっていた。\n\n違う仕組みの二つが、同じ変化を示している。\n\n彼女は電話を取り、倉庫へ伝えた。\n\n今度は返事を待たず、伝言を受けた係の名前と時刻を紙に書いた。\n\n「奥へ出るの？」\n\n青年が窓の向こうから聞いた。\n\n「ここの水位が上がってる。窓からじゃ、上の管が見えない」\n\n彼は自分の側へ寄った。\n\n「ここから、箱の横は見える」\n\nラーナは読み取り機を持ち、扉の外へ出た。\n\n階段までは数歩。計器も、そのすぐ脇だ。\n\n「私が見ている箱の、上。小さい表示は？」\n\n「点いてる。文字もある」\n\n「何て？」\n\n「……読めない」\n\nラーナは首を伸ばした。\n\n反対側へ回らなければ、表示の正面は見えない。だが青年の位置からなら見えるはずだった。\n\n「線の下に、丸い字が二つ。その隣に、縦に長いの」\n\n彼が形を言う。\n\nラーナの手が止まった。\n\n切替中。\n\nその表示が、彼女の操作前から点いていた。\n\n「私が道具を抜いても、消えない？」\n\n彼は箱を見たまま答えた。\n\n「消えない」\n\nラーナは、機器と設備をつなぐ線を外した。\n\n針は動き続けた。\n\n青年が先に音へ気づいた。\n\n「上で、何か動いた」\n\nラーナも聞いた。\n\n水音の中に、硬い、小さな音が混じっていた。\n\n記録室の床へ、水が走った。\n\n### 五　切断の前\n\nラーナは電話へ戻ろうとした。\n\n階段の方から水が来ていると分かっても、受話器がそこにあると思うと、身体がそちらを向いた。\n\n向こう岸で青年が走った。\n\n曲がり角の先へ消え、すぐ戻ってくる。\n\n「戻らないで！」\n\n彼が指した場所を、ラーナはその時、まだ見つけられなかった。\n\n＊\n\nメフルダードが記録室へ電話したとき、呼出音は返らなかった。\n\n彼は受話器を置かず、配線盤の表示を見た。\n\n東の系統が、応答なしになっている。\n\n「現場へ二人。上の連絡路から入ってくれ」\n\n職員が鍵を取った。\n\nメフルダードは別の番号を回した。\n\n＊\n\n別室の机では、水路の映像だけが動いていた。\n\nラーナが壁を上っている。\n\nもう一人は、反対側の高い通路から、彼女の手元を見ていた。\n\n電話の向こうで、メフルダードが言った。\n\n『こちらで下の電話が通じません。そちらから、二人に上の連絡路へ出るよう伝えられますか』\n\n係が、傍らの男を見た。\n\n男はすぐには答えなかった。\n\n画面の外側で、短い文字列が動いている。\n\n接続先の欄には番号があった。\n\n接続元の欄は空白だった。\n\n「そのままにしろ」\n\n男が言った。\n\n係は受話器へ向き直り、現場へ人が向かっていることだけを確認した。\n\n画面の中で、ラーナが穴へ身体を入れた。\n\n向こう岸の青年が、ようやく腕を下ろす。\n\n＊\n\n男は手元の紙へ、短い印を付けた。\n\n印は、水路の絵の入口側にあった。\n\n線を先へ延ばす前に、戻るところを囲む。\n\nそれから、係へ尋ねた。\n\n「接触は」\n\n「続いています」\n\n男が電話を取った。\n\n係は椅子を引き、切断の操作へ手を置いた。\n\n### 六　消えなかったもの\n\nラーナは、青年が消えた後もしばらく同じ場所を見ていた。\n\nそれから、自分が上ってきた穴へ顔を向けた。\n\n下へ戻って確かめることはできない。\n\nできるのは、自分の側の出口へ進むことだった。\n\n膝を立てる。立ち上がる。\n\n脚が震えた。\n\n壁に手をつき、灯りへ向かって歩いた。\n\n途中に古い配線の溝があり、細い光がいくつか点いていた。\n\nその一本が、対岸に向かう管の陰で消えていた。\n\n＊\n\n連絡路の扉を開けると、二人の職員が来た。\n\n一人がラーナの腕を支えた。\n\n今度は、触れられた。\n\n「向こうにも人がいた」\n\nラーナは先に言った。\n\n「リツって名前。上の通路に」\n\n職員がもう一人へ合図を送り、壁の電話まで走った。\n\nもう一人は、ラーナを椅子へ座らせた。\n\n「見てきてもらうから。膝を」\n\n布を当てられると、痛みが戻ってきた。\n\n＊\n\nメフルダードが来たのは、手当ての途中だった。\n\n彼はラーナの顔を見てから、濡れた勤務証を見た。\n\n「記録は？」\n\n「流された」\n\n言ってから、ラーナは顔を上げた。\n\n「けど、私が触る前から切替中だった。あの人も見てた」\n\n「向こうの人か」\n\n「リツ。知らない人だけど、箱の裏を見てくれた」\n\nメフルダードは、その名前を書いた。\n\nラーナは彼の手を見た。\n\n名前の横に、連絡先を書く余白がある。\n\nそこは空いたままだった。\n\n「どこへ行ったか、聞かないの？」\n\n彼の指が止まった。\n\n「消えたんです」\n\nラーナは言った。\n\n「目の前で。落ちたんじゃない。歩いて出てもいない」\n\nメフルダードは、何があったのかと聞かなかった。\n\nラーナは、電話での問いを思い出した。\n\n声は聞こえるのか。\n\n「何を確認してたの」\n\n彼は椅子を引いた。\n\n座る前に、廊下の職員へ言った。\n\n「この人の家へ、無事だと知らせてくれ」\n\nそれから、ラーナへ向き直った。\n\n「最初に、その人を見たところから話してほしい」\n\n＊\n\nラーナは濡れた用紙を開いた。\n\n赤い十字が滲み、余白に書いた二つの言葉だけが残っていた。\n\nメフルダード。\n\n油。\n\n母は今、荷物をまとめている。\n\nあの青年は、その母のことも知らない。\n\n名前以外、ほとんど何も知らない相手が、自分を助けた。\n\nラーナは用紙を裏返した。\n\nまだ書けるところへ、リツ、と記した。\n\n切替中。\n\n私が触る前。\n\n忘れる前に、それも書いた。\n\n---\n\n*第一部・了*\n\n\n## 第二部　助けに来た男\n\n### 一　こちら側の床\n\n《中継側から接続が終了されました》\n\n律は、ラーナのいた場所へ手を上げたままだった。\n\n水路も、白い壁も消えている。\n\n「待って。まだ、出口まで――」\n\n言葉は誰にも届かなかった。\n\n視界の隅に、再接続の項目が出た。\n\n選ぶ。\n\n《この区域は現在ご利用いただけません》\n\nもう一度選ぶ。\n\n同じ表示だった。\n\n律は終了を選んだ。\n\n机の端が戻ってきた。\n\nその向こうに、洗濯物を積んだ椅子。窓の外を、隣の建物の広告がゆっくり移動している。\n\n接続具を外した。\n\n自分の手を開く。\n\n握り直す。\n\n袖は乾いていた。床にも水はない。\n\n律は足を下ろした。\n\nさっき、ラーナの靴が何度も壁から剥がされていた。\n\nその感触を想像したせいで、自分の足を床へ載せるのにも時間がかかった。\n\n＊\n\n六月十七日、午後四時二十一分。\n\n仕事の通知が五件、私用が二件。\n\n秋山からの最後の一件を開く。\n\n《澪さん、六時。案内経路、絞れた？》\n\n律は返信した。\n\n《予定外の区域へ入りました。接続が切れて戻れません。記録を確認してから行きます》\n\nすぐに返事が来た。\n\n《体調は？》\n\n《大丈夫です》\n\nそこまで書いてから、もう一行足した。\n\n《少し、変なことがありました》\n\n＊\n\n歴史体験の履歴には、予定していた場所が順に並んでいた。\n\n広場。染織工房。水門。\n\n律の仕事は、そのどこを展示の入口にするか決めることだった。\n\n来場者が一度に入れる人数。案内を聞かずに先へ行く人がどこで迷うか。初めて接続具を使う人にも、戻る場所が分かるか。\n\n大学を出る前に旅をしていたときも、知らない街へ着くと、まず帰る駅を確かめた。\n\n今日は、戻る扉が閉じた。\n\n水門の次に、名前のない区間がある。\n\nその部分を開いた。\n\n映像は残っていた。\n\nラーナがこちらを見ている。\n\n律は音を止めた。\n\n彼女の口が動く。片手は道具の線を替えている。\n\nなぜか、怒られたときの方がはっきり思い出せた。\n\n仕事が終わるまで待って、と言われた。\n\n律が質問を重ねたせいで、彼女は一度、作業を止めた。\n\nAGIが担当する人物は、プレイヤーの見ていないところでも生活を続ける。見せ場を逃したからといって、同じ台詞で待ち直してはくれない。\n\nそれは分かっていた。\n\nけれどラーナは、律の言う港の場所さえ分からなかった。\n\n彼女は律に役割を渡そうとしていなかった。\n\n出口の邪魔になる、知らない人が来た。\n\nあの反応は、それに近かった。\n\n律は、再生位置を少し戻した。\n\n箱の上の表示が映っている。\n\nラーナに形を説明した文字。\n\n読めないまま、記録へ印を付けた。\n\n＊\n\n切断直前の通信状態を開いた。\n\n遅延の警告は出ていない。\n\n端末の接続も続いていた。\n\n終了理由だけが、通常の区域移動と違う。\n\n《中継側終了》\n\n最初に入った扉にも、中継という表示があった。\n\n水門の補修通路に、三つの灯りが並んでいたことを思い出す。\n\nラーナも同じ灯りを見て、新しいのかと聞かれて首を振った。\n\n律は体験運営の報告画面を開いた。\n\n勤務先の展示制作案件に紐づけ、区域履歴と終了理由を添える。\n\n記録の提供を求められた。\n\n全部を選びかけて、指を止めた。\n\nラーナが、家を閉じられる話をしている。\n\n仕事の事故報告へ必要なのは、そこではなかった。\n\n入口、計器、終了直前の短い場面を選んだ。\n\n彼女の顔が入る最後の場面は、状況を伝えるため残した。\n\n《接続先の人物が負傷しているように見えます。相手が実際の参加者の場合、安全確認をお願いします》\n\nそう書いて送った。\n\n受理番号が出た。\n\n律はその番号を保存し、上着を取った。\n\n### 二　知らないはずの名前\n\n駅へ向かう途中で、運営から返事が来た。\n\n《該当区域は、当社の公開コンテンツ一覧では確認できませんでした。接続基盤の担当へ照会しています。再接続はお控えください》\n\n律は歩きながら読み、足を止めた。\n\n公開されていない、ではない。\n\n一覧で確認できない。\n\n画面の下に、引継ぎ先の会社名があった。\n\n展示の設備契約で見た名前だった。\n\n秋山へ転送し、歩き出す。\n\n駅前の店で水を買った。\n\n支払いを終えたとき、男が扉の脇から離れた。\n\n「リツさんですか」\n\n律は飲み物を鞄へ入れず、持ったまま振り向いた。\n\n知らない顔だった。\n\n「どちらの方ですか」\n\n「何を持って帰りました」\n\n男の日本語は、言葉を一つずつ選んでいた。\n\n律は、出口を背にしないよう半歩ずれた。\n\n「接続の調査なら、会社を通してください。窓口は――」\n\n「遊びではない」\n\n男の声が低くなった。\n\n「招かれていない者が、あそこへ入ってはならない」\n\n律は店の中を見た。\n\n店員が、次の客の会計をしている。\n\n「誰のことを言ってますか」\n\n「あの女から、何を受け取った」\n\nラーナ。\n\n名前が出かけた。\n\n飲み込んだが、男は律の顔を見ていた。\n\n手が伸び、上着をつかんだ。\n\n「離してください」\n\n律は大きく言った。\n\n店員が顔を上げた。\n\n男の空いた手に、細い刃があった。\n\n一度、身体を引いた。\n\n袖をつかむ力が強くなる。\n\n律は持っていた水を、男との間へ押し出した。\n\n刃を持つ手がそれを払った。\n\n瓶が落ちる音がした。\n\nその間に、つかまれた腕を店の方へ引いた。\n\n上着の脇が裂けた。\n\n律は男の手首を取ろうとはしなかった。肩から逃げ、もう一度声を出した。\n\n「刃物です！　警察を！」\n\n誰かが叫んだ。\n\n人が動く。\n\n男が押した。\n\n律の踵が縁石から外れた。\n\n車の警告音が、すぐ後ろで鳴った。\n\n＊\n\n襟元をつかまれた。\n\n今度は、横へ引かれた。\n\n靴底が歩道の端を擦った。\n\n律は反射的に腕を上げた。\n\n「こっちだ」\n\n英語だった。\n\n背の高い男が、間へ入った。\n\nサングラス。濃い色の上着。\n\n男は律を見ず、相手へ短く何かを言った。\n\n律には、やめろ、と聞こえた。\n\n刃を持つ手が止まる。\n\n後ろから別の男が来た。\n\n店員が扉を開け、人を中へ戻す。\n\n襲撃者は一歩退き、それから走った。\n\n律は壁へ手をついた。\n\n追おうとは思わなかった。\n\n車の音が、まだ身体の近くに残っていた。\n\n### 三　ミーシャ\n\n店員が椅子を出してくれた。\n\n律は座り、上着の裂けたところを見た。\n\n下の服に血はない。\n\n手の甲からは、血が出ていた。\n\nサングラスの男は同行者へ指示を出してから、律の前に立った。\n\n「けがは」\n\n短い日本語だった。\n\n「手だけ、たぶん」\n\n男は眼鏡を外した。\n\n「ミハイロ」\n\n姓と会社名が続く。\n\n律は会社名を聞き直した。\n\nさっき、運営から引継ぎ先として示された会社だった。\n\n「ミーシャでいい」\n\n男は英語で言い、律を見た。\n\n「今回の接続について、話を聞く予定だった」\n\n律は、どこから、と聞こうとした。\n\nだが相手には、どこへ、と聞こえたらしい。\n\n事務所の所在地を答え始める。\n\n「違う、どうして僕がここにいると」\n\n言い直しても、すぐには合わなかった。\n\nミーシャが同行者へ手を出す。\n\n彼は端末を開き、通訳を起動した。\n\n滑らかな日本語が、乾いた声の後へ続いた。\n\n「勤務先へ連絡しました。ご本人は移動中だと聞き、面談を申し込むため近くまで来ていました」\n\n律は、保存した受理番号を見せた。\n\nミーシャの端末にも、同じ番号がある。\n\n運営へ報告してから、まだ一時間も経っていなかった。\n\n「それで、さっきの人は」\n\nミーシャは男が逃げた方を見た。\n\n「調べます」\n\n訳された声は丁寧だった。\n\n本人の声には、ほとんど抑揚がなかった。\n\n＊\n\n警察官が来るまで、ミーシャはその場に残った。\n\n律は聞かれた順に答えた。\n\n何を受け取った、と言われたこと。\n\n相手が自分の名前を知っていたこと。\n\n知らない人物だったこと。\n\nミーシャは律の代わりに答えず、自分に聞かれたことへ答えた。\n\n同行者が近くに車を停めている、と言う。\n\n律はその車を見た。\n\n黒い普通の車だった。\n\n普通の車を、ひどく特別なものに見せる人間がいるのだと思った。\n\n＊\n\n手を処置してもらう間に、秋山が来た。\n\n最初に律の手を見て、次にミーシャの身元を確かめた。\n\n「病院から聞いたんじゃないですよね」\n\n「僕が電話しました」\n\n律が答えると、秋山はようやく椅子へ座った。\n\n「今日は帰っていい」\n\n「先に話を聞きたいです」\n\n秋山は裂けた上着を見た。\n\n「じゃあ、一人では聞かない」\n\nミーシャは、律たちの事務所で話すことに同意した。\n\n律は彼の会社の公開情報を開き、氏名と役職を照合した。\n\nニューヨークの民間セキュリティ企業。役員。\n\n写真には、今と同じ顔があった。\n\n経歴の中には、暗号解析についての論文も並んでいた。\n\n律は画面を閉じた。\n\n情報機関の人間だったら、こういう経歴を出すのだろうか。\n\n考えても確かめられないことへ、頭を使い始めていた。\n\n今は、目の前の男が何を答えるかを聞くしかなかった。\n\n### 四　誰に見せたか\n\n事務所の打合せ机には、展示入口の模型が出たままだった。\n\n小さな人影が中へ入り、別の扉から戻ってくる。\n\n律は模型の横へ、破れた上着を置いた。\n\nミーシャは向かいへ座った。\n\n「まず、最後の接続について」\n\n律は首を振った。\n\n「僕を襲った人を、知っているんですか」\n\n通訳が終わるまで、ミーシャは待った。\n\n「接続先に関係する者の可能性はある」\n\n「さっき、何て言ったんですか」\n\n「やめろ、と」\n\n「それで、やめた」\n\n「人も集まっていた」\n\n確かにそうだった。\n\nそれだけで納得することもできなかった。\n\n秋山が、運営からの通知を机に出した。\n\n「こちらへ引き継いだ範囲を確認させてください。本人の報告と接続記録だけですか」\n\n「提供された画像と、案件の連絡先です」\n\n「御社の内部で、誰が見られますか」\n\nミーシャは、通訳された文を一度読み直した。\n\n「担当を確認して、回答する」\n\n「では、保全もお願いします」\n\n彼は頷いた。\n\n律は、ラーナの顔が映った数秒を思い出した。\n\n「彼女にも、何か起きるんですか」\n\nミーシャの目が律へ向いた。\n\n「なぜ」\n\n「あの男は、僕がどこへ入ったか知っていた。彼女から何か受け取ったかって。向こうにも同じ考えの人がいるなら」\n\n「今、確認している」\n\n「連絡はできるんですか」\n\n「調整中だ」\n\n答えになっていない。\n\nけれど、何も知らない人の返事でもなかった。\n\n＊\n\nミーシャが自分の端末を開いた。\n\n「何か受け取ったか」\n\n律は彼を見た。\n\n「あの男と同じ質問ですね」\n\n「物だけではない。情報も含む」\n\n「話はしました。ずっと、水路の反対側にいたので、物は受け取れません」\n\nミーシャの視線が、机へ落ちた。\n\n「相手の名前は」\n\n律は答える前に聞いた。\n\n「僕が言えば、その人を特定できますか」\n\n「場所と顔は、すでに記録にある」\n\n律の指が、上着の裂け目をつまんだ。\n\n必要だと思って、自分が送った。\n\nあの場では必要だった。\n\nしかし、それを誰が見るかは、確認していなかった。\n\n「ラーナです」\n\nミーシャは名前を書いた。\n\n「どんな文字を見た」\n\n「表示です。彼女が作業していた箱の」\n\n「ほかには」\n\n「壁にもあったと思います」\n\n「誰かに見せたか」\n\n律は、ようやく質問の順番に気づいた。\n\n何を知った。\n\n何を残した。\n\n誰へ渡した。\n\n「まだ運営へ送った分だけです」\n\n「ほかの記録も、こちらへ」\n\n律は端末を伏せた。\n\n「どうして必要かを教えてください」\n\nミーシャの手が止まった。\n\n「事故の経路を確認するためだ」\n\n「区域の一覧にない場所へ、どうして入れたか。それは僕も知りたいです。でも、その人の会話を全部渡す必要がありますか」\n\n秋山が、二人の間へ机の表示を寄せた。\n\n「経路と通信状態を先に。追加が必要なら、その理由をください」\n\n＊\n\n律は三つの灯りの映像を出した。\n\nミーシャが、初めて自分から身を寄せた。\n\n「入口は、ここか」\n\n「水門の先です。補修通路って出てました」\n\n「その表示も残っているか」\n\n律は前の場面へ戻した。\n\n歴史的な石壁の前に、現代の操作用の案内が重なっている。\n\n《外部中継区間。体験記録は端末に保存されます》\n\n律は入るとき、制作確認用の別区域だと思った。\n\n業務用の体験には、そういう境目がある。\n\n秋山が尋ねた。\n\n「公開ゲームの中に、御社の試験経路があったんですか」\n\n「確認する」\n\nミーシャは言った。\n\n同じ言葉なのに、今度は、確認すべき場所が分かっている人の声だった。\n\n＊\n\n帰り際、ミーシャは再接続しないよう念を押した。\n\n「あなたの安全のためでもある」\n\n「彼女は？」\n\n律が聞くと、彼は扉の前で止まった。\n\n「居場所が分かる人に、無事か聞いてください。それだけでも」\n\nミーシャは律を見た。\n\n「連絡する」\n\n救助されたときより、今の返事の方が少し信じられた。\n\n律は助けてくれた礼を言った。\n\nその礼と、まだ答えられていない質問は、別々に残った。\n\n### 五　監修者の知らない町\n\n秋山は扉が閉まるのを待って、律へ水を渡した。\n\n「報告先と、彼の身元は一致してる。救助前から相手を知っていたかは、まだ分からない」\n\n律は頷いた。\n\n「偶然近くにいたという説明も、警察へ追加しておこう。見てた人がいるかもしれない」\n\n連絡を済ませたころ、六時を過ぎていた。\n\n澪は隣室で待っていた。\n\n予定していた監修の資料を閉じ、律の手を見る。\n\n「今日は、やめましょう」\n\n「すみません」\n\n「謝ることじゃないです」\n\n彼女は立ちかけ、机の模型を見た。\n\n「水門から先を、まだ迷っていたんですよね」\n\n「迷った先で、迷いました」\n\n律が言うと、秋山が顔をしかめた。\n\n「そういうまとめ方をしない」\n\n澪は笑わず、椅子を戻した。\n\n「どこへ入りました？」\n\n＊\n\n澪は今回の展示で、地域史と生活の監修を担当していた。\n\n主な仕事は、考古学の現地調査だという。\n\n初めて打ち合わせたとき、律の経路案を見て、住民が水を運ぶ道を来場者で塞がないようにと言った。\n\nゲームの町なのだから、時間をずらせばよいのではと律は答えた。\n\n彼女は、それでは、その町が何をしている場所か伝わらない、と返した。\n\n今なら、あのときより意味が分かった。\n\n「運営の一覧にない区域だったそうです」\n\n秋山が通知を見せた。\n\n澪は先に、履歴を確かめた。\n\n「時代の違う資料を仮につないだ場所かもしれません。でも、制作側が把握していないなら、それだけでは説明できませんね」\n\n「建物だけ、見てもらえますか」\n\n律は、人物が映っていない場面を選んだ。\n\n水路と古い壁。\n\n画面の端に、計器。\n\n澪は壁へ顔を近づけた。\n\n「その継ぎ目を、もう少し大きく」\n\n律は拡大した。\n\n線は、真っすぐには続いていない。\n\n途中で下がり、折れ、また同じ高さへ戻っている。\n\n「石の積み方ですか」\n\n「ここは、後から埋めてあります」\n\n澪は画面へ触れず、指を手前で止めた。\n\n「この奥も見ました？」\n\n「水が来て、上へ逃げました」\n\n「上の廊下へ？」\n\n「あります。映像も」\n\n最後の場面は、ラーナが大きく映っていた。\n\n律は画像の端だけを切り出した。\n\n澪の視線が、人物を除いたことより、残った壁の方へ動いた。\n\n「この先、床が一度下がっていませんでしたか」\n\n「そこまでは見てません。僕の側は、奥が閉じていて」\n\n彼女は鞄からノートを出した。\n\n画面を見ながら写すのかと思った。\n\nしかし、ノートにはすでに絵があった。\n\n細い水路と、向かい合う段。\n\n壁の折れ方も、似ていた。\n\n「どこの図ですか」\n\n律が聞いた。\n\n「私が描いたものです」\n\n澪は、ページの端を押さえた。\n\n「現地調査で？」\n\n「いいえ。記憶を整理するために」\n\n秋山が、手元の通知から顔を上げた。\n\n澪はその二人の顔を見て、言い直した。\n\n「ここに似た場所で暮らしていた記憶があるんです。ただ、今のどこに当たるのか、まだ確かめられていません」\n\n律はもう一度、図を見た。\n\n「昔、住んでたんですか」\n\n「自分が生まれる前の生活を覚えている、と言う方が正確です」\n\n律は、彼女の顔を見た。\n\n冗談を言っているようには見えなかった。\n\n「前世、ということですか」\n\n「そう呼ぶことになります。ただ、私の記憶と、今の映像がどうつながるかは、まだ分かりません」\n\n澪は画面とノートを見比べた。\n\n「画像が似ているだけで、同じ場所だとは言えないので」\n\n彼女は線の一か所を指した。\n\n「確かめられるところが、いくつかあります」\n\n### 六　読めない表示\n\n律は自分の記録へ戻った。\n\nノートと同じ壁を映す場面を探す。\n\nラーナが箱へしゃがむ直前で止めた。\n\n「この文字も、見覚えがありますか」\n\n澪は覗き込み、顔を上げた。\n\n「もう少し、正面からの画像は？」\n\n「これだけです。細い表示で、動くと潰れてしまって」\n\n律は数秒分をゆっくり送った。\n\n光が反射する。\n\n一瞬だけ、輪が二つと縦の線が見えた。\n\n澪はノートの余白へ形を描いた。\n\n「同じ字だったら、切り替えている、という意味かもしれません。画面が小さいので、断定はできませんが」\n\n律は顔を上げた。\n\nラーナが口にした言葉と、合っていた。\n\n「彼女も、そう言ってました」\n\n「誰ですか」\n\n「そこで会った人です。作業していた人」\n\n澪は、消した人物のいた場所を見た。\n\n「その方にも、聞けるといいですね」\n\n「僕も、それを先にしたいんです」\n\n＊\n\n秋山がノートと画像を並べた。\n\n「澪さんの図が、そのゲームの制作資料に使われた可能性は？」\n\n「このノートは渡していません。ただ、ほかの図はあります。制作側へ確認はできます」\n\n「お願いします。同じ場所かどうかと、画像がどこから来たかは、別に調べた方がよさそうですね」\n\n律はノートのページを撮らせてもらい、受け取った日時を記した。\n\n自分の映像とは別に保存する。\n\nどちらに合わせて、どちらを書き直したのか、後で分からなくしないためだった。\n\n澪はその作業を見ていた。\n\n「元のページも、そのまま残しておきます」\n\n律は礼を言った。\n\n彼女の説明を、信じたわけでも、退けたわけでもなかった。\n\n少なくとも、比べられるものが一つ増えた。\n\n＊\n\n「もう一つだけ」\n\n澪が言った。\n\n「入った先に、住んでいる人がいたんですよね」\n\n律は頷いた。\n\n「仕事をしている人は。でも、僕は最初、AGIか、誰かが演じている人だと」\n\n「それは、まだ分からない？」\n\n「分かりません」\n\n彼女はノートを閉じた。\n\n「では、まず、その人が無事か確かめましょう。場所の話は、そこからでも遅くありません」\n\n律は、ミーシャの連絡先を開いた。\n\n新しい図のことも、文字の訳のことも、いったん書かなかった。\n\nラーナは無事か。\n\n本人と話す方法はあるか。\n\n二つだけ書いて、送った。\n\n＊\n\n窓の外で、広告の色が変わった。\n\n律は水を飲み、ようやく、昼から何も食べていないことに気づいた。\n\n鞄の中には、買えたはずの水がなかった。\n\n駅前の歩道へ落としたままだ。\n\nラーナの鞄も流された。\n\nその中には何が入っていたのだろう。\n\n自分が記録した箱の表示を、彼女はもう見直せないのかもしれない。\n\n律は、切替表示の場面を消さずに残した。\n\n### 七　救助のあと\n\nミーシャは、車に乗ってから律の連絡を読んだ。\n\n前席の男が、別の通話をつなぐ。\n\n画面に、駅前にいた男の顔が出た。\n\n『何も受け取っていないそうです』\n\nミーシャは答えなかった。\n\n『相手の名前には反応しました。口には出しませんでしたが』\n\n「本人から聞いた」\n\n『では、終わりですか』\n\n「彼に近づくな。勤務先にも、家にも」\n\n男は頷きかけ、画面の外を見た。\n\n『車道へ出たのは、こちらの指示では――』\n\n「お前は押した」\n\n『逃がさないようにしただけです』\n\n「刃を出させたのは私だ」\n\nミーシャは自分の手を見た。\n\n上着をつかんだ感触が、まだあった。\n\n「経緯は残せ。消すな」\n\n男が黙った。\n\n「これからは、私が聞く」\n\nミーシャは通話を切った。\n\n＊\n\n前席の男が尋ねた。\n\n「彼の記録は？」\n\n「報告に添付した分だけだ」\n\n「残りを出しませんでしたか」\n\nミーシャは、律の文面をもう一度読んだ。\n\nラーナは無事か。\n\n自分の上着が裂けた後で、まだ、向こうの相手を気にしている。\n\n彼は最初の報告へ戻った。\n\n負傷しているように見える。\n\n実際の参加者なら、安全確認を。\n\n自分が何を知ったかも分からない若者が、先に書いたのはそれだった。\n\nミーシャは現地との連絡を開いた。\n\n《ラーナという作業者の状態を知らせてほしい。救助後に何を話したかも》\n\n送る前に、後半を見た。\n\n指は、そこで一度止まった。\n\n消さずに送った。\n\n＊\n\n車の窓に、人の顔が映っては流れた。\n\nミーシャは手元の画像を開いた。\n\n古い手稿のページ。\n\n緑の葉と根の周りに、まだ読み切れない文字が並んでいる。\n\nその横へ、律から届いた小さな画像を出す。\n\n濡れた壁に、細い表示が灯っていた。\n\n同じ文字を、彼は長く追ってきた。\n\n律はそれを、数秒見ただけだった。\n\nミーシャは画像を拡大し、それから元へ戻した。\n\nラーナのいる側へ返した問いの答えは、まだ来ていなかった。\n\n---\n\n*第二部・了*\n\n\n## 第三部　呼び戻す者\n\n### 一　名前のない目撃者\n\n母が来たとき、ラーナはまだ同じ椅子に座っていた。\n\n最初に頭を抱えられた。\n\nそれから、膝を見られた。\n\n「歩けるって、言ったのに」\n\n「歩けるかどうかと、見たいかどうかは違う」\n\n母は乾いた服の包みを置いた。\n\n油の小瓶も入っていた。\n\nラーナは口を開き、閉じた。\n\n買物のことまで思い出していた自分が、おかしかった。\n\n母が肩を撫でた。\n\n「お礼は、帰ってからでいい」\n\n「まだ言ってない」\n\n「言いそうだった」\n\n廊下の向こうで、誰かがラーナを呼んだ。\n\n母の手が止まった。\n\n「話は明日にできないの」\n\nメフルダードが来た。\n\n彼の後ろに、式のとき上の席にいる男がいた。\n\nアザドだった。\n\nラーナは服の包みを膝へ引き寄せた。\n\n＊\n\n「その人から、何を受け取りました」\n\nアザドは、椅子へ座る前に聞いた。\n\n「何も」\n\n「言葉でも、物でも」\n\n「逃げる場所を教えてもらいました」\n\n彼はメフルダードを見た。\n\n母が、二人の間へ半歩入った。\n\n「その人を見つけたいんですか。それとも、この子の話を聞きたいんですか」\n\n「両方です」\n\nアザドは答えた。\n\n「では、座って聞いてください」\n\nメフルダードが椅子を出した。\n\nラーナは、青年に最初に会ったところから話した。\n\n港を見に来たということ。\n\n表示の文字を読めなかったこと。\n\n逃げ場所を、反対側から見つけたこと。\n\nアザドは、最後のところで顔を上げた。\n\n「その人が、あなたを上へ導いた」\n\n「段があると教えたんです。上ったのは私です」\n\n彼女は言った。\n\n「あの人も、出口を探してた」\n\nアザドは紙へ何か書き、折った。\n\nメフルダードがそれを受け取ろうとすると、彼は自分の上着へしまった。\n\n「確認が済むまで、接触の話は広げないように」\n\n「私を助けた人の名前も？」\n\n「名前だけで、分かることは多くない」\n\n「じゃあ、どこから消したら、分かることが増えるんですか」\n\nアザドはラーナを見た。\n\n母は娘を止めなかった。\n\n＊\n\n二人が出ていった後、ファリデが入ってきた。\n\n母の服の包みを見て、先に着替えておいでと言った。\n\n「紙は待ってる。身体は冷やすと、後で面倒」\n\nラーナが戻ると、机に配水の記録が置かれていた。\n\n「午前の戻り。さっき測り直した分も」\n\nファリデは、濡れた用紙の裏を覗いた。\n\nリツ。\n\n切替中。\n\n私が触る前。\n\n「そっちの人にも、記録が残ってないかね」\n\n「知らない。道具を持ってるところも見てない」\n\n「でも、同じ箱を見たんでしょう」\n\nラーナは、窓のない壁を見た。\n\n自分の記録は流された。\n\nあの人が見たものは、まだ、どこかにあるかもしれない。\n\n### 二　戻れない入口\n\n東京では、ミーシャから短い返事が来ていた。\n\n《作業者は救助され、歩行可能とのことです》\n\n律はその一文を二度読んだ。\n\n「よかった」\n\n声に出してから、秋山へ画面を向ける。\n\n秋山は画面を引き寄せ、次の行を読んだ。\n\n《本人との接続は調整中です。記録を保持してお待ちください》\n\n「どこへ確認したか、聞いておこう」\n\n秋山が言った。\n\n律は返信した。\n\n隣で澪が、図の線を一本、薄く引いた。\n\n「増やしたんですか」\n\n「いえ。これは、よく覚えていないところです」\n\n濃い線と、薄い線があった。\n\n「全部、同じ確かさで描くと、自分でも区別がつかなくなるので」\n\n律は机の模型を脇へ寄せた。\n\n自分の映像には、薄い線の先が映っていない。\n\n「今、記憶の話を証明してほしいと言っても、無理ですよね」\n\n「この図だけでは、無理です」\n\n澪は薄い線の先を指した。\n\n「でも、この壁の先に何があるかなら、確かめられます。なかったら、この図を疑います」\n\n律は、自分の履歴へ戻った。\n\n＊\n\n再接続はできなかった。\n\n水門までの通常の体験は利用できる。\n\nそこから先だけ、行き先がない。\n\n律は接続具を着けず、記録を再生した。\n\n最初の入口で、案内が変わっている。\n\n公開区域の名前が消え、外部中継という表示が出る。\n\n「ここへ入ったの、僕だけですか」\n\n運営窓口へ送る。\n\n返事は、個々の利用者については回答できない、だった。\n\n「じゃあ、同じ入口が出た人がいれば、利用を止めてください。異常報告としては、それを伝えたいです」\n\n秋山が律の画面を見た。\n\n「それでいい。調べたいことと、今伝えることを分けよう」\n\n澪が、箱の表示を指した。\n\n「この字、反射していないところを一枚ずつ比べられますか」\n\n律は前後の画像を切り出した。\n\n見えている線だけを残す。\n\n足りないところは補わなかった。\n\n＊\n\n画像検索の候補が出た。\n\n初めのいくつかは、装飾文字と架空言語だった。\n\n次の一つに、古い本のページがある。\n\n緑の植物と、読めない文字。\n\n律はその候補を開いた。\n\n《ヴォイニッチ手稿》\n\n「ああ、これ」\n\n秋山が言った。\n\n「解読されたって記事が、時々出る本でしょう」\n\n「この字、そこから借りたのかもしれませんね」\n\n律は表示の画像を隣へ置いた。\n\n似ていた。\n\n似ている以上のことは、分からなかった。\n\n澪は、画面を見たままになっていた。\n\n「澪さん？」\n\n彼女は、植物の脇の行を指した。\n\n「そのページを、大きくしてください」\n\n### 三　本に残った言葉\n\n画像の出典は、大学図書館だった。\n\n律は出典を開き直し、加工前の画像へ移った。\n\n澪は、自分でページを送った。\n\n同じ本の中でも、見つめる時間が違った。\n\nすぐに送るもの。\n\n何度も戻って見るもの。\n\n「読めるんですか」\n\n律が聞いた。\n\n「読めるところがあります。字の形が、私の覚えているものと少し違う。でも、言葉は」\n\n彼女はそこで息を吸った。\n\n「全部を、今ここで正しく読めるとは言えません」\n\n秋山が椅子を寄せた。\n\n「何についての本に見えます？」\n\n「植物を育てて、食べられるようにする手順です。この辺りは」\n\n澪は根の絵を指した。\n\n「薬ですか」\n\n「私のいたところでは、食べ物でした」\n\n＊\n\n律は、今の言葉を書き留めた。\n\n古い本の正体が分かった、と書きかけ、消した。\n\n澪がそう読めると言っている。\n\n今ある事実は、そこまでだ。\n\n「前世の記憶が残ることと、関係があるんですか」\n\n律は聞いた。\n\n澪が顔を上げた。\n\n「あります」\n\n秋山の手が止まった。\n\n「その食べ物を口にした人は、次の人生に記憶を持っていく。私は、そう教わりました」\n\n澪は本の画像へ目を戻した。\n\n「それが、この植物と同じかは、実物を見たいです。名前は読める。でも、今、誰が何を育てているかは分からないので」\n\n律は、反射的に窓の外を見た。\n\n帰宅する人が、ビルの連絡路を歩いている。\n\n机の上では、世界の仕組みが変わったかもしれない話をしている。\n\n隣の席では、誰かが会場への搬入時刻を確認していた。\n\n律はもう一度、澪を見た。\n\n「澪さんは、最後に暮らしたところでも、それを食べた」\n\n「はい」\n\n「じゃあ、あの町に同じ言葉があるなら、ほかにも覚えている人がいるかもしれない？」\n\n「その可能性はあります。でも、言葉を使っていることと、食べていることは別です」\n\n律は筆記具を持ち直した。\n\n今度は、どちらも書いた。\n\n＊\n\n「この本を、前にも見たことは？」\n\n「この画像は、初めてです。同じ種類の本は、向こうにもありました」\n\n「向こうって、どこですか」\n\n澪は、自分の図を開いた。\n\n「地下に暮らしていました。地上へ出る道があって、古い記録には、外の人とのやり取りも残っていました」\n\n彼女は道の端を指した。\n\n「私が覚えているのは、その途中までです。出口の地名は、今の地図で見つかりませんでした」\n\n律は地図の検索欄を開いた。\n\n「今まで調べた候補を、見せてもらえますか」\n\n澪は候補を並べた一覧を開いた。\n\n「現地調査の仕事を選んだのも、それを探すためです」\n\n＊\n\n彼女は、既に調べていた。\n\n古い地名。洞窟の記録。水路の向き。\n\n一致しないものには、その理由も書かれていた。\n\n律は一つを開き、地上の方位を見た。\n\n澪の図には、北がなかった。\n\n高い方と、低い方。\n\n水が来る方と、出ていく方。\n\n「これを、そのまま地上の図へ載せるのは難しいですね」\n\n「そうなんです。道は覚えていても、その上に何があったのかは知らない」\n\n彼女は薄い線を指した。\n\n「だから、今、あの壁を見たい」\n\n律は、映像の白い壁へ戻った。\n\n自分が入ったときは、出口の場所しか考えなかった。\n\n誰かにとっては、長く見つからなかった入口だったのかもしれない。\n\n### 四　呼ぶ側の部屋\n\nラーナを呼びに来た係は、母にも一緒に来るように言った。\n\nファリデは、頼まれなくても付いてきた。\n\n「配水の記録をもらう用もあるから」\n\n連絡室では、壁の板が外されていた。\n\n係が束になった線を差し替えている。\n\n奥には、式のときに使う台があった。\n\nその横の机へ、リツの顔が出ていた。\n\nラーナは足を止めた。\n\n係が表示を伏せようとする。\n\n「その人」\n\n彼女は言った。\n\n係の手が止まった。\n\n「水路で会った人です。さっき、名前を伝えました」\n\n「聞いています」\n\n「ここから話せるの？」\n\n返事の前に、奥の扉が開いた。\n\nアザドが入ってきた。\n\n「試験は中断しています」\n\n彼は係に向けて言った。\n\nラーナは、机の横へ置いた自分の紙を見た。\n\nリツの顔の下には、会った時刻と、消えた時刻がある。\n\n「水路の方も、試験だったの？」\n\nアザドが彼女へ向き直った。\n\n「外との接触を、段階を踏んで確かめていた」\n\n「私が来るのは、知ってた？」\n\n「君に会わせる予定ではなかった」\n\nファリデが口を挟んだ。\n\n「水を動かしたのも、その試験？」\n\n「それは設備側へ聞いてください」\n\n「今、聞いてる。誰に聞けばいいかを教えて」\n\nメフルダードが、後から入ってきた。\n\n「水の操作と、この試験の記録を、別々に出してください。時刻を合わせたい」\n\nアザドは紙を持つ係の手元へ目をやった。\n\n「両方、控えを出してくれ」\n\n＊\n\n連絡が来たのは、そのときだった。\n\n係が受話器を取り、何度か短く返事をする。\n\n最後に、ラーナを見た。\n\n「本人と、つなげるそうです」\n\n「誰が決めたの」\n\n「ミーシャです」\n\nラーナは、母を見た。\n\n母も、その名に心当たりはない顔だった。\n\nアザドの顔だけが、変わった。\n\n「こちらから頼んだときには、待てと言ったのに」\n\nアザドは受話器へ手を伸ばしかけ、係のそばで止めた。\n\n係が低い台の周りから椅子を退けた。\n\nラーナは、机の上の名前を見た。\n\nミーシャ。\n\n窓口で聞いた責任者とは、別の名前だった。\n\n### 五　もう一度、名前を呼ぶ\n\n律の端末へ、接続の案内が来た。\n\n相手側の担当者、開始予定、終了方法が並んでいる。\n\n短い確認のための接続。\n\nミーシャからの文面には、外部の同席者がいるかとあった。\n\n律は、会社の同僚がいる、と答えた。\n\n澪の名は書かなかった。\n\n隠すというより、今、相手へ渡す範囲を選んだ。\n\n「映像は、こちらにも残します」\n\n秋山が言った。\n\nミーシャは了承した。\n\n＊\n\n視界が明るくなった。\n\n水路ではなかった。\n\n低い台のそばに、ラーナがいた。\n\n服が違う。\n\n膝には、巻いた布が見える。\n\n「リツ？」\n\n「ラーナ」\n\n彼女が、息を吐いた。\n\n律も同じことをした。\n\n「無事だったんだね」\n\n「あなたも」\n\nラーナは巻いた布の端を膝の下へ押し込み、律は次の言葉を探した。\n\nラーナの隣にいた年配の女性が、律を上から下まで見た。\n\n「この人？」\n\nラーナが頷く。\n\n「母です」\n\n律は慌てて名乗った。\n\n母は、彼の足元を見ていた。\n\n「助けてくれて、ありがとう」\n\n「僕は、見えた場所を言っただけで」\n\n「その場所が見えなかったから、困ってたんでしょう」\n\n母はそう言って、娘の横へ戻った。\n\n＊\n\nラーナが手を上げ、律の腕へ近づけた。\n\n「触ってもいい？」\n\n律は腕を差し出した。\n\n彼女の指が、袖へ入った。\n\n止まらなかった。\n\n律は腕を引きかけたが、間に合わなかった。\n\nラーナは、自分の手を見た。\n\nそれから、台の脇へ出した。\n\n手が入っていた場所に、袖は元どおりある。\n\n「今、ここにはいないんだ」\n\n「僕の身体は、別の場所にある」\n\n律は答えた。\n\n「どこ？」\n\n「東京」\n\nラーナはその名前を繰り返した。\n\n係が脇の画面へ、音を書き留めている。\n\n律はその動きを見て、初めて、自分の地名が彼らには新しい情報なのだと分かった。\n\n「あなたたちは、僕が何だと思ってた？」\n\nラーナは答える前に、奥の人々を見た。\n\n「知らない人。出口が分からなくなった人」\n\n彼女は律へ目を戻した。\n\n「それ以外の話は、後からされた」\n\n### 六　残っていたもの\n\nラーナは、律の背後ではなく、顔を見て聞いた。\n\n「さっきのこと。覚えてる？」\n\n「覚えてる」\n\n「箱の表示。私が線を外しても、消えなかったやつ」\n\n「あの、小さい箱ね」\n\n「もう一度、見られる？」\n\n彼は体験記録を開いた。\n\nラーナの視線は動かなかった。\n\n「今、探してる。僕の画面は、そっちには出ないみたいだ」\n\n「じゃあ、声で教えて」\n\n律は切替表示の場面を止めた。\n\n「送れるなら、画像の方がいい」\n\n横の女性が言った。\n\nファリデと名乗り、係を呼ぶ。\n\n係は送付先を示した。\n\n律は表示の一枚だけを送った。\n\n「この表示、切替中っていう意味で、合ってる？」\n\nラーナが顔を上げた。\n\n「読めないって、言ってたのに」\n\n「こっちで、読める人が見つかった。ただ、この画像だけで合ってるか、確かめたくて」\n\nラーナが机へ駆け寄った。\n\n「これ」\n\n彼女が指している。\n\nファリデが紙を並べる。\n\n二人の言葉が速くなった。\n\n訳が重なり、律には追い切れなかった。\n\n「少し待って。一つずつ」\n\nラーナが振り向いた。\n\n「私が何か動かして、水をあふれさせたのかもしれないと思ってた」\n\n彼女は画像を指した。\n\n「でも、切替は、その前から始まってる」\n\n「それ、さっき分かってたんじゃ？」\n\n「私は覚えてた。でも、ほかの人に見せられなかった」\n\n律は、彼女の隣へ置かれた濡れた紙を見た。\n\n記録を失ったのは、思い出せなくなったという意味ではなかった。\n\n誰かと一緒に、確かめられなくなったのだ。\n\n＊\n\n係が、別の画面を開いた。\n\n切替の指示は現地の設備係から出ていなかった。\n\nメフルダードは、表示された時刻を書き取った。\n\n「これで君の記録を訂正できる」\n\nラーナは首を振った。\n\n「私の名前のところだけじゃなくて、次に水がどう動くかを見てください」\n\n「それも調べる」\n\n彼は答え、係へ操作記録の控えを求めた。\n\nアザドが、少し離れた場所から律を見ていた。\n\n彼の視線は、顔から送信された画像へ移った。\n\n怖がっているようにも、欲しがっているようにも見えた。\n\n＊\n\n接続の終わりを告げる表示が出た。\n\n今度は、律にも見えた。\n\n「あと二分だって」\n\n「今度は、先に分かるんだね」\n\nラーナが戻ってきた。\n\n「さっき、僕も消されるとは思わなかった」\n\n「消した人の名前は、聞いた」\n\n律は彼女を見た。\n\n「ミーシャ？」\n\nラーナの顔が変わった。\n\n「あなたも知ってるの」\n\n「こっちにいる。今日、会った」\n\n彼女は奥の扉を見た。\n\n「こっちにはいない。なのに、切れるんだ」\n\n律は、台の足元へ伸びる線を見た。\n\n名前を知っただけで、安心する理由はなかった。\n\n＊\n\n「僕も、一つ聞きたい」\n\n律は言った。\n\n「何か受け取ったか、って聞かれた？」\n\nラーナは、すぐ答えなかった。\n\n目だけが、奥にいる男へ向いた。\n\nそれで、律には伝わった。\n\n「聞かれた。私は、逃げる場所だって答えた」\n\n律は小さく笑った。\n\n「それは、確かに渡した」\n\n彼女も、ほんの少し笑った。\n\n表示の数字が減った。\n\n「また話せる？」\n\n「話したい」\n\n律は答えた。\n\n「その前に、母さんへ無事だって言って。さっき、お礼しか返せなかった」\n\n「聞こえてるよ」\n\n奥から母の声がした。\n\n律は、思わず姿勢を正した。\n\nラーナが笑ったところで、終了の音が鳴った。\n\n### 七　こちらにも、誰かがいる\n\n机が戻った。\n\n秋山が先に聞いた。\n\n「手の具合は」\n\n律は接続具を外し、傷を見た。\n\n忘れていた。\n\n「大丈夫です」\n\n「食べるもの、頼んであるから。着くまでは座って」\n\n澪は記録へ時刻を書いていた。\n\nラーナが話した言葉の一つを、何度か聞き直す。\n\n「少し、言い方が違いますね」\n\n「澪さんの記憶と？」\n\n「はい。でも、分かる言葉もあります。長く離れた場所なのか、時代が違うのか、それだけでは決められません」\n\n律は、相手側へ渡した画像に言葉の違いも添えて保存した。\n\n自分は何を受け取ったのかと聞かれた。\n\n今度は、自分が渡した。\n\n画面に、ラーナとファリデが同じ一枚を覗き込む姿が残っている。\n\n＊\n\nミーシャから連絡が来た。\n\n《文字を読んだのは、どなたですか》\n\n律は画面を見つめた。\n\n自分が表示の訳を知っていると分かる箇所が、接続中にあった。\n\nミーシャも、どこかで見ていた。\n\n律は澪へ端末を向けた。\n\n「名前を伝えてもいいですか」\n\n澪は文面を読み、自分の連絡先を開いた。\n\n「私から話します。相手も、その本を調べているなら」\n\n「本を知っているとは、まだ聞いてません」\n\n律が言うと、澪は自分の言葉を止めた。\n\n「そうですね。そこから確認しましょう」\n\n秋山が、届いた食事を机へ置いた。\n\n三人分だった。\n\n律は袋から箸を出し、通話の時刻を返信した。\n\n---\n\n*第三部・了*\n\n## 第四部　助けた理由\n\n### 一　読める人\n\n「どこで覚えたんですか」\n\n通話の最初に、ミーシャは澪へ聞いた。\n\n彼女は、律にしたのと同じ説明をした。\n\n幼いころから、今の暮らしとは違う場所の記憶がある。\n\nそこでは、あの文字を使っていた。\n\n「今の身体で、生きていた時代のものではありません」\n\nミーシャは、澪の顔と、その横の図を見比べた。\n\n手元で開いていた資料を伏せる。\n\n澪が図を広げ直しても、彼の視線は顔へ戻った。\n\n律は、次に何を聞くのか待った。\n\n「その記憶を、ほかに誰が知っている」\n\nミーシャが聞いた。\n\n「家族には、子供のころから話していました。調査で協力してもらった人もいます」\n\n「その記憶を、そのまま論文に使ったことは」\n\n「場所や言葉の対応が確かめられた部分は。ただ、覚えているだけのことを、史実としては書けません」\n\n澪は画像を一枚出した。\n\n本のページだった。\n\nミーシャの視線が、画面の一か所へ落ちた。\n\n「この本を調べていますね」\n\n彼女が言った。\n\n「誰から聞いた」\n\n「今、見て、そう思いました。違いますか」\n\nミーシャは眼鏡を机へ置いた。\n\n「調べている」\n\n＊\n\n澪は、植物の下処理を記した行へ印を付けた。\n\n「乾かすのは、こちらが先です」\n\nミーシャが手元の紙をめくった。\n\n「器に入れてからも待つ？」\n\n「ここに期間が。ただ、この単位は、今の字と違います」\n\n律はその語を拡大した。ミーシャは紙の一行を囲んだ。\n\n「これは、何のための作業だと考えますか」\n\n澪は顔を上げた。\n\n「私の覚えている食事なら、次の人生へ記憶を残すためです」\n\nミーシャは、囲んだ一行から筆記具を離した。\n\n「それ以外には。どこかへ移るための手順ではないのか」\n\n澪は、少し眉を寄せた。\n\n「ほかの効能も研究されていたかもしれません。でも、私が知っているのは、それです」\n\n「読めた語と、食事について覚えていることを、分けてもらえるか」\n\n「記録と実物を見たいです。そちらには、ありますか」\n\n彼は別の資料を開きかけ、止めた。画面の余白に書き込む。\n\n《記憶保持》\n\nその右に、短い線を引く。\n\n《移行未達》\n\n律には、その二つの関係が分からなかった。\n\n「移行って、どこへの？」\n\nミーシャが顔を上げた。\n\n「食事に別の目的があると考えていた。だが、ここで記録を出さずに話せば、あなたたちは私の説明だけを聞くことになる」\n\n彼は表示を閉じた。\n\n＊\n\n澪は次の画像を出した。\n\n自分の水路の図だった。\n\n「この場所を、知っていますか」\n\nミーシャは、しばらく見た。\n\n「現在の映像にある壁には見える。それより先は分からない」\n\n「台が二つあるはずなんです。何に使われていたか、確かめたい」\n\n「その台の部分に印を。現地へこの図を送る」\n\n彼は返信先を書き添え、紙に図を写した。\n\n入口に丸を付ける。\n\n先へ線を延ばす前に、そこだけを二度なぞった。\n\n澪の指が、自分のノートの端で止まった。\n\n律は、それを見た。\n\n彼女はミーシャの顔へ視線を上げたが、言葉にはしなかった。\n\n### 二　実在する町\n\n秋山が通話へ戻ってきた。\n\n「接続の仕組みについて、運営側の担当者と話せました。同席をお願いしています」\n\nミーシャは手元の資料を閉じた。\n\n現れた担当者が、律の接続履歴を画面へ出した。\n\n「公開区域から試験用の中継へ進める状態でした。申し訳ありません」\n\n行き先の欄に、停止の表示があった。\n\n「何が中継されてたんですか」\n\n律が聞いた。\n\n担当者が、接続先の欄へカーソルを置いた。\n\nミーシャがその番号を指した。\n\n「現地の映像と音声だ」\n\n「現地って、撮影した映像ですか」\n\n「その場の映像です。同時に、あなたの姿を向こうへ投影していました」\n\n律は記録のラーナへ目を移した。\n\nラーナの手が、袖を通り抜けた。\n\nそのときにも考えた。\n\nけれど、自分の目に見えるものの全部が作れる時代に、それだけで決めてよいとは思わなかった。\n\n「ラーナも？」\n\n「その場所で暮らす人だ」\n\nミーシャが言った。\n\n運営側の担当者が、二つの接続先を並べた。\n\n片方には、制作された町の模型が出た。\n\nもう片方では、律が顔を動かすたび、現地のカメラの映像が切り替わっていた。\n\n「接続具と配信の基盤は共通です。展示で、復元された場所と、現在の現場を行き来するために使っています」\n\n「こちらの案件でも、そういう切替は使う予定でした」\n\n秋山が言った。\n\n担当者は、二本の経路が分かれる箇所を開いた。\n\n「ここに試験先の登録が残っていました。登録した経緯は、変更履歴を調べています」\n\n律は手を持ち上げた。記録の中の自分も、同じように上げている。\n\n「僕の声も、そのまま向こうへ？」\n\n「翻訳が必要な相手には、訳した音声を送ります」\n\nラーナが伸ばした指は、その袖を通り抜けていた。\n\n「僕の側では、同じように見える」\n\n「接続先が変わる境目の表示はありました。しかし、それをゲーム内の移動と受け取れる状態でした」\n\n担当者は、入口の記録を指した。\n\n律は、そのとき何を読んで通ったのかを、記録でもう一度確かめた。\n\n＊\n\n律は記録を閉じた。\n\n見れば、彼女がそこにいる。\n\nだが今は、見せられたものの外からも確かめたかった。\n\n「独立して確認できる人は、いますか。御社の説明だけじゃなく」\n\n担当者が、現地で設備確認に入っている外部の連絡員へ照会した。\n\n相手はすぐには出なかった。\n\n待つ間に、律は自分の仕事の模型を見た。\n\n来場者の通路から、住民の通路を外した模型。\n\nあの人たちは、通路が邪魔になるという理由だけで動かしてよい相手ではなかった。\n\n＊\n\n連絡員は、携帯端末の映像を出した。\n\n壁に臨時の線が這い、床に作業用の養生が敷かれている。\n\n彼は所属と、作業依頼の番号を示した。\n\n秋山が別の窓口へ番号を確かめる。\n\nその間、彼はカメラを人へ向けなかった。\n\n「どこまで見せていいか、聞いています」\n\nしばらくして、ファリデの声がした。\n\n「床ならいいよ。顔を出したい人は、後で呼ぶ」\n\n律はその声を知っていた。\n\n映った床には、傾いた工具棚と、乾かしている靴があった。\n\nラーナの靴だった。\n\nメフルダードが映像へ入った。\n\n「さっきの画像は、受け取りました。記録の保全は、こちらでも始めています」\n\n彼は係から紙を受け取った。\n\nラーナの名前と、切替の時刻。\n\n律が送った画像の番号。\n\n運営側の担当者が、提供した送信記録と対応を確認する。\n\n一枚の絵の中で全部が証明されたわけではなかった。\n\n別々の仕事をしている人たちの記録が、一つずつつながっていた。\n\n＊\n\nラーナが、画面の外から声を掛けた。\n\n「今は、どっちを見ればいいの」\n\n連絡員が端末を向け直した。\n\n「ここ？」\n\n彼女は、画面の少し下を見た。\n\n「リツ？」\n\n「いる」\n\n律は答えた。\n\n「足は」\n\n「さっきより痛い。座ってると、立つときに思い出す」\n\n彼は笑いかけて、できなかった。\n\nゲームで痛がるところは作れる。\n\n自分は、そう考えた。\n\nその考えが間違っていた場合のことを、途中から気にし始めた。\n\n今は、その場合の方にいた。\n\n「さっき、君が流されそうになったとき」\n\n言葉が続かなかった。\n\nラーナが、少し待った。\n\n「段の場所、教えてくれたでしょう」\n\n「うん」\n\n「あれ、聞こえたよ」\n\n律は、膝の布から彼女の顔へ目を戻した。\n\n「よかった」\n\nようやく、それだけ言えた。\n\n### 三　帰る道の話\n\n次の接続は、ラーナの作業所の隣にある中庭だった。\n\n持ち運べる中継設備を試すから、台の周りから離れないように、と係が説明した。\n\n律は足元の境目を確かめた。\n\n一歩外へ出かけると、視界の端へ警告が出る。\n\n戻った。\n\n初めて入ったときにも、同じ境目があったのかもしれない。\n\n自分には、次の区域への案内に見えていた。\n\nラーナは、木箱の上に座っていた。\n\n「そこ、あんまり動かない方がいいって」\n\n「聞いた」\n\n「さっきも、聞いてた？」\n\n「今のは、ちゃんと」\n\n彼女の口元が、少し上がった。\n\n＊\n\n「東京って、外の町？」\n\n「うん。ここから、かなり遠い」\n\n「歩いて何日？」\n\n律は答えかけ、迷った。\n\n冗談なのか、本当に歩くのか。\n\nラーナは彼の顔を見て言った。\n\n「乗り物があるのは知ってる。ここからそこまで、何を使うかを知らないの」\n\n「ごめん。飛行機と、車になると思う」\n\n「飛行機」\n\n彼女は音を繰り返した。\n\n「見たことは？」\n\n「絵でなら。でも、あれに乗って、ここまで来るの？」\n\n「最後は、そうはいかないみたいだ」\n\n現地の連絡員から聞いた入口の話を、律は思い出した。\n\n地上の拠点から、調査用の通路を通る。\n\nそこまでの移動手段は分かる。\n\nしかしラーナの家まで、自分で歩ける道順は、まだなかった。\n\n「行ってみたい」\n\n律は言った。\n\nラーナは、膝の布を直していた手を止めた。\n\n「どこに」\n\n「君のところ」\n\n「仕事で？」\n\n「仕事の方は、止めた。元の展示に戻していい話じゃなくなったから」\n\n彼女は少し考えた。\n\n「じゃあ、何を見に？」\n\n律は彼女を見た。\n\n水路でも、中庭でも、いつも反対側にいる。\n\n「今度は、会いに」\n\nラーナは、すぐには返事をしなかった。\n\n＊\n\n母が、中庭へ食事を持ってきた。\n\n二人を見ると、包みを一つ置き、もう一つを持ったまま止まった。\n\n「そうか。そっちは食べられないのね」\n\n「僕の方にも、あります」\n\n律は言った。\n\n「食べた？」\n\n「さっき」\n\n「じゃあ、残念がるのは、その次でいい」\n\n母はラーナの横へ座った。\n\nラーナが包みを開ける。\n\n焼いた野菜と、薄いパンが入っていた。\n\n律は、彼女の手を見た。\n\n指に、まだ細い擦り傷がある。\n\n自分の手にも、白い処置の跡があった。\n\n「どうしたの、その手」\n\nラーナが先に気づいた。\n\n律は、隠そうとしかけてやめた。\n\n「戻ってから、知らない人に襲われた」\n\n母の手が止まった。\n\n「何を受け取ったか、って聞かれた」\n\nラーナは包みを置いた。\n\n「こっちと、同じ」\n\n「うん。ミーシャという人に助けられた」\n\n彼女は目を細めた。\n\n「消した人が、助けたの」\n\n言葉にすると、変だった。\n\n律は手の処置の跡を見た。\n\n「まだ、全部は分からない」\n\n母が、二人の顔を交互に見た。\n\nそれからラーナの膝に、食事を戻した。\n\n「分からない話も、冷める前に食べながらできる」\n\n＊\n\nラーナが、パンをちぎった。\n\n「会いに来るなら、帰る道も聞いてきて」\n\n「僕が？」\n\n「帰れなくなった人を、もう一度拾うのは大変だから」\n\n律は笑った。\n\n「今度は、先に確かめる」\n\n「何日いるかも。泊まるところは、勝手に決まらないよ」\n\n「分かった」\n\n彼女は食べながら、次に直す作業場の話をした。\n\n律が知らない同僚の名前が出た。\n\nその名前を、彼は聞き返した。\n\n### 四　先に来ていた人\n\n接続を終えると、秋山が廊下から戻ってきた。\n\n律はその顔を見て、立ち上がった。\n\n「警察から。店の映像について、確認したいことがあるそう」\n\n端末を渡される。\n\n律は話を聞き、画面に出た静止画を見た。\n\nミーシャの同行者だった。\n\n通報し、通訳の端末を出し、診療所まで来た人。\n\nその人物が、律が店に入る前、襲撃者と話していた。\n\n映像は短かった。\n\n音はない。\n\nそれだけで、何を指示したかは分からない。\n\nだが、先に会っていたかどうかは、分かった。\n\n律は見覚えがあると答えた。\n\n＊\n\n通話が終わると、さっきまで座っていた椅子が遠かった。\n\n膝に力を入れ、もう一度座る。\n\n澪が隣へ来た。\n\n何があったか、すぐには聞かなかった。\n\n律はミーシャへ連絡した。\n\n彼は画面に出た。\n\n「一緒にいた人が、襲った男と、僕が来る前に話していました」\n\n律は言った。\n\n「どういうことですか」\n\nミーシャは、画面の外へ目を向けなかった。\n\n誰かに確認する必要はないのだと、そのとき分かった。\n\n「知ってたんですね」\n\n「知っていた」\n\n「あの人を見張っていたんですか」\n\n言ってから、自分で逃げ道を出したのだと気づいた。\n\n律は口を閉じた。\n\nミーシャは、その道を使わなかった。\n\n「あなたに近づくよう、私が指示した」\n\n部屋の音が、一度遠ざかった。\n\n律は、上着を置いた場所を見た。\n\n裂けた布が、机の端へ垂れている。\n\n「刃物も？」\n\n「出すように指示した」\n\n「助けるところまで？」\n\n「そのつもりだった」\n\n律は、さっきラーナに話した言葉を思い出した。\n\n助けられた。\n\n自分の声で、そう言った。\n\n＊\n\n「何を、知りたかったんですか」\n\n「何を見て、誰へ渡したか。誰かの指示で入ったのか」\n\n「普通に聞いたでしょう。全部」\n\n「普通に聞けば、用意した答えが返ると思った」\n\n律は画面を見た。\n\n「怖い方をやって、助ける方をやったら、僕が本当のことを言うと」\n\n「そう考えた」\n\n「僕が車に当たってたら？」\n\nミーシャは開きかけた口を閉じた。\n\n「当たらなかったから、今、聞けてるだけですよ」\n\n律は自分の手を机へ置いた。\n\n画面を閉じるのかと思った秋山が、少し動いた。\n\n律は閉じなかった。\n\n「その説明を、警察にもしてください」\n\n「指示した内容も、同行者を配置したことも、私から話す」\n\n「僕へ言ったのと、同じことを」\n\n律は画面を閉じず、ミーシャが連絡先を求めるのを待った。\n\n秋山が、時刻を書いた。\n\n### 五　残しておくもの\n\nミーシャとの接続を切ると、律はしばらく何もできなかった。\n\nラーナと話していたときの声が、頭の中で繰り返された。\n\n消した人が、助けたの。\n\n澪が、机の上へ水を置いた。\n\n「今日は、ここまででも」\n\n律は首を振った。\n\n「あの人に頼むのをやめたら、ラーナへ連絡できなくなるのかを、先に聞きたいです」\n\n秋山が、運営側の担当者へ連絡した。\n\n試験経路は止まっている。\n\nただし、現地との専用接続は別に管理されている。\n\n保守の窓口と現地責任者を、共有できるか。\n\n返事は、現地側にも確認する、だった。\n\n律は、そこへ自分で一文を足した。\n\n《ラーナ本人が望む場合、本人からも連絡を開始できる方法を確認してください》\n\n＊\n\n警察へ、ミーシャの説明を伝えた。\n\n秋山が隣にいて、言葉を探す間も待っていた。\n\n終わると、律はようやく上着を畳んだ。\n\n捨てるつもりで、持ち上げたわけではなかった。\n\nそれでも秋山が先に言った。\n\n「そのまま置いておこう」\n\n「はい」\n\n律は、裂けたところが見えるよう戻した。\n\n＊\n\n澪が現地調査の資料を開いた。\n\n死海周辺の掘削と、地下空間の調査。\n\n律が話した連絡員の所属は、その調査にも関わっていた。\n\n「入口へ近づくための窓口は、私の仕事の側にもあります。ただ、町の中へ入る許可は、別です」\n\n彼女は言った。\n\n「場所がつながっているか、現地で確かめたい。私も行きます」\n\n「あの町が、澪さんの探していた場所かもしれないから？」\n\n「その可能性を、確かめたいからです」\n\n澪は、画面に出した地上の地図を見た。\n\n「この周辺は、調べていました。でも、この下の道までは知らなかった」\n\n地図の上に、調査できていない範囲があった。\n\n律には白い空白に見える。\n\nラーナには、名前のある場所なのだろう。\n\n＊\n\n現地担当者へ連絡した。\n\nその場で出発が決まったわけではなかった。\n\nまず、既に始まっている現地作業を妨げないこと。\n\n通れる入口と、帰る経路を確認すること。\n\n律は、澪が交わすやり取りを聞いた。\n\n仕事で見てきた調整と似ていた。\n\n誰が来るか。\n\n何ができるか。\n\n何をしに来るのか。\n\n彼は自分の欄へ、設備作業者ではない、と書いた。\n\n代わりに、接続記録を持ち、現地の目撃者と話せると書いた。\n\n### 六　戻るところに印を\n\nミーシャから、書面が届いた。\n\n襲撃者へ指示したこと。\n\n同行者を配置したこと。\n\n律へ接触した経緯。\n\n捜査へ説明するため連絡したという報告もあった。\n\n律は一度目を通し、秋山へ渡した。\n\nそれから、現地との接続について尋ねた。\n\n「私を通さず連絡できるよう、保守担当と現地側へ依頼した」\n\nミーシャは、宛先を隠さず、その文面を出した。\n\n「向こうの人にも伝えてください」\n\n彼は現地へ送った依頼も並べた。本人からの発信を認める、とある。\n\n「それで、こちらの件が終わるわけではないです」\n\n「この依頼を、襲撃の件の条件にはしない」\n\n律は、その言葉だけを信用することはできなかった。\n\nでも、翌朝以降の連絡先には、彼以外の名前も増えていた。\n\n＊\n\n澪は通話へ残った。\n\n「私からも、聞きたいことがあります」\n\nミーシャが彼女を見た。\n\n「あの図の入口へ、先に丸を付けましたね」\n\n「戻るところを決めてから、道を考える」\n\n「誰かに教わったんですか」\n\n「昔からのやり方だ」\n\n澪はノートの入口の丸へ、指を重ねた。\n\n「同じようにする人を、知っていました」\n\n「研究者なら、珍しくはない」\n\n彼は答えた。\n\nそれは、そのとおりだった。\n\n「あなた自身にも、今の人生より前の記憶があるのですか」\n\n澪が聞いた。\n\nミーシャは筆記具を置いた。\n\n「私自身のことは、今は答えない」\n\n「ない、ではなく？」\n\n「答えない」\n\n律は彼を見た。\n\n澪は彼の返事を、日付の下へ書いた。\n\n「分かりました。答えなかったことは、覚えておきます」\n\n＊\n\n通話の後、律は尋ねた。\n\n「記憶の中の人に、似ているんですか」\n\n「やり方が、一つ」\n\n澪は答えた。\n\n「でも、一つでは決められません」\n\n「その人を探してた？」\n\n澪は、閉じかけたノートを開き直した。\n\n「場所が見つかれば、その人にも伝わるかもしれないと思っていました。自分で会えなくても」\n\n律はノートの入口を見た。\n\n濃い線が、戻る場所で止まっている。\n\n「次は、何を確かめるんですか」\n\n澪は画面の向こうではなく、机の図を見た。\n\n「私たちが一緒にいた場所に、残したものがあります。残っているなら、同じことを覚えているか聞けます」\n\nその言葉を聞いて、律はようやく分かった。\n\n彼女の図は、どこへ行くかを示すだけのものではなかった。\n\n誰に会いたいかも、描かれていた。\n\n### 七　行く人、残る人\n\nラーナが記録室の外へ出ると、運び出した荷物が道を狭めていた。\n\n母が、箱の上に油の小瓶を置いた。\n\n「落とさないでね」\n\n「私、片手空いてる」\n\n「じゃあ、これも」\n\nもう一つ、小さな包みが載った。\n\n荷物の中から、家の鍵が見えた。\n\nラーナはそれを取った。\n\n戻れるかどうか、まだ誰も言ってくれない。\n\nそれでも鍵を持っていくのは、自分で決められた。\n\n＊\n\nファリデは、作業所の図を床へ広げていた。\n\n記録の空白を指し、メフルダードへ説明する。\n\n「次に上から動かす前に、ここを見てもらう。戻りの道が、今の図ではつながってない」\n\nラーナは箱を置き、膝を曲げずにしゃがめる場所を探した。\n\n「私も行く」\n\n「今日は歩き回らない」\n\nファリデが言う。\n\n「ここで、見たものを描いて。行く人にはそれを渡す」\n\nラーナは工具ではなく、筆記具を受け取った。\n\n＊\n\nアザドが、廊下の端に立っていた。\n\nファリデは顔を上げた。\n\n「その試験の図、持ってきた？」\n\n彼は紙を置いた。\n\n折り目が固く、何度も開いた跡がある。\n\nラーナは、自分の紙と並べた。\n\n知らない線が、町の下を通っていた。\n\n「これ、どこへ行くの」\n\n「昔の経路だ」\n\n「昔って、いつ」\n\nアザドは答える前に、彼女の図を見た。\n\n「少なくとも、私が始めたものではない」\n\n「でも、使った」\n\n「使えるかどうか、確かめたかった」\n\n彼は椅子へ座った。\n\n「待てと言われるだけでは、何も変わらないから」\n\nラーナは、その気持ちだけは分かった。\n\n分かったことが、彼の判断を正しかったことにはしなかった。\n\n彼女は線の脇へ、分からない、と書いた。\n\n＊\n\n東京では、律が帰宅していた。\n\n扉を閉め、鞄を置く。\n\n朝は洗濯物のあった椅子に、明日持っていくものを並べた。\n\n接続具。\n\n充電器。\n\n記録の控え。\n\nパスポートを開き、有効期限を見る。\n\n行き先の確認は、まだ続いている。\n\n澪からは、朝、調査窓口の返事が来ると連絡があった。\n\n律は航空便の候補を保存し、画面を閉じた。\n\n＊\n\nラーナから、短い音声が届いた。\n\n係が新しい連絡方法を確かめるため、一件だけ送るという。\n\n『こっちでも、連絡できるって』\n\n少し間が空いた。\n\n『来るなら、靴。濡れても歩けるのにして』\n\n律は自分の靴を見た。\n\n駅前で踏ん張った跡が、爪先に残っていた。\n\n『あと、着く前に教えて。私にも仕事があるから』\n\nそこで音声が終わった。\n\n律は笑った。\n\n返事を録る。\n\n「分かった。道順が決まったら、先に知らせる」\n\n送り、今度は受け取られたことを確かめた。\n\n---\n\n*第四部・了*\n\n## ラーナルート　帰り道のある町\n\n### 一　持っていくもの\n\n現地へ入れるという返事が来たのは、翌朝だった。\n\n澪から届いた案内には、地上の集合場所と、そこから先の担当者の名前がある。律は帰りの経路も開いた。出るためには別の許可が要るのではない。入ったのと同じ担当者へ、戻る予定を知らせておく。\n\nその欄へ予定を入れてから、秋山に電話した。\n\n「仕事として行かせることはできないよ」\n\n最初に言われた。\n\n「はい。休みをください」\n\n「事故調査への協力と、個人で会いに行くことも、向こうには分けて話してね」\n\n律は、前の晩に書いた自分の説明を読み直した。\n\n接続記録を持っている。現地の目撃者と連絡できる。設備作業はできない。\n\nその下へ、会いたい人がいる、と書く必要はなかった。\n\n言わなくても、秋山には分かっているようだった。\n\n「靴、ちゃんとしたのを履いて」\n\n「同じことを言われました」\n\n「じゃあ、二人分聞いて」\n\n＊\n\n空港で会った澪は、小さな鞄を二つ持っていた。\n\n一つは着替え。もう一つには、図と調査資料が入っている。\n\n「私の調査の方は、現地の担当者と続けます。律さんは、まずラーナさんのところへ」\n\n「一緒に来てもらって、別行動でいいんですか」\n\n「同じ道で着いても、同じ仕事をするわけではないので」\n\n彼女は搭乗口の表示を確かめ、鞄を持ち直した。\n\n律は、自分の記録を現地へ送る項目を開いた。必要な画像だけを、時間順に並べてある。\n\n最初に表示されるのは、濡れた壁の小さな箱だった。\n\n切替中。\n\nあの言葉の意味は、もう分かる。\n\n知りたいのは、誰が、どこへ切り替えたかだった。\n\n＊\n\n移動の間、ミーシャから二度連絡があった。\n\n現地で使う図の確認先と、担当者の追加だった。律は受け取り、澪と現地の窓口にも確かめた。彼から来たという理由だけで使わないのも、彼から来たという理由だけで信じるのも、今は違う気がした。\n\n襲撃の件については、担当者から別に連絡が来ていた。\n\n律は返事をして、画面を閉じた。\n\n機内の窓には、朝でも夜でもない色が残っていた。\n\n### 二　手の届くところ\n\n地上の拠点から、資材を運ぶ車に乗った。\n\n途中で車を降りる。壁に新しく這わせた線が、通路の角を曲がっていた。人が歩くところと、工事の人が使うところは、柵で分けてある。\n\n律は、長い下りを澪と歩いた。\n\n記録の中で見た壁は、まだ現れなかった。\n\n違う入口だと聞いていても、ラーナへ近づいている実感は薄かった。\n\n最後の扉の前で、係が名前を確かめた。\n\n扉が開いた。\n\nラーナは、その向こうで木箱を動かしていた。\n\n律を見つけ、持っていた側を下ろす。\n\n「来る前に知らせてって、言ったでしょう」\n\n「連絡したよ」\n\n「着く一時間前に。こっちにも一時間、仕事があるの」\n\n言いながら、彼女は近づいてきた。\n\n水路を挟んだときより、少し背が低い。\n\n当たり前なのに、意外だった。あのときは、彼女の方が下にいた。次に会ったときは、台のそばにいた。\n\nラーナも律を見上げた。\n\n「こんなに大きかった？」\n\n「たぶん、ずっと」\n\n＊\n\n彼女が鞄へ手を出した。\n\n律も持ち替え、そこで二人とも止まった。\n\nラーナが先に笑った。\n\n「今日は、持てるんだね」\n\n指が取っ手へ掛かった。律が離しても、鞄は落ちなかった。\n\nそのまま、彼女の指に触れた。\n\n温かかった。\n\n律は言いかけた言葉を忘れた。\n\nラーナも鞄を持ったまま、少し動かなかった。\n\n係が扉を押さえ直した音で、二人は横へ退いた。\n\n「膝は？」\n\n律が聞いた。\n\n「荷物を持った後に聞くの、遅い」\n\n彼女は鞄を返した。\n\n「歩ける。でも、今日は長い階段は避ける」\n\n「分かった」\n\n澪が二人の横を通り、現地の担当者と話し始めた。ラーナは彼女へ挨拶し、それから律を手招きした。\n\n「こっち。まず、どこで寝るかを決める」\n\n### 三　地図に描かなかったもの\n\n通りには、持ち主の名前を書いた箱が積まれていた。\n\n箱と壁の間を、小さな子供が抜けていく。ラーナが呼び止め、反対へ回るように言った。\n\n「下へは行かないで。まだ、泥を上げてるから」\n\n子供は靴を見せた。\n\n汚れていなかった。\n\n「今は、じゃなくて、これから」\n\n彼女が言うと、子供は律を見た。\n\n「あの人？」\n\nラーナが何か言うより先に、走っていった。\n\n「有名になってる？」\n\n律が聞く。\n\n「名前より、消え方の方が」\n\n＊\n\n母は、仮住まいの入口で食器を拭いていた。\n\n律が名乗ると、布を置き、両手で彼の手を取った。\n\n「今度は、こっちを見て言えるね。ありがとう」\n\n律は礼を受け取り、それから持ってきた小さな菓子の箱を差し出した。\n\n母はラーナを見た。\n\n「泊まるところまで決めた？」\n\n「作業所の客用の部屋。ファリデさんに聞いた」\n\n「じゃあ、夕飯はここ」\n\n「本人に聞いて」\n\n二人が同時に律を見た。\n\n「お願いします」\n\n律は答えた。\n\n＊\n\nラーナは、濡れた紙を乾かしている棚を見せた。\n\n重しを置いたもの。もう字が読めなくなったもの。\n\n母が持ち出した家の記録も、その中にあった。\n\n「これ、誰の字？」\n\n律が、端へ書かれた線を指す。\n\n「父。棚を作るときの長さ」\n\nそこは家の図の余白だった。\n\n「裏が空いてたから、使ったの。図を描いた人が知ったら怒るかな」\n\n「僕らの職場なら、誰の寸法か分かるように書いて、って言われる」\n\nラーナは紙を裏返し、乾いた面を指で押さえた。\n\n「父は分かってた。私も、まだ分かる」\n\n律は、映像にあった町の図を思い出した。\n\n線と名前だけでは、こんなことは分からない。\n\n＊\n\n作業所へ向かう途中、閉じた店の前で立ち止まった。\n\n扉の下へ、泥が入り込んでいる。\n\nラーナが中へ声を掛けると、奥から返事があった。\n\n片づけに来ているだけで、まだ店は開けられないという。\n\n「明日は？」\n\n「上の人に聞いて」\n\nラーナは扉へ近づいた。\n\n「そのために、調べてる」\n\n律は手伝えることがあるかと聞いた。\n\n店主は、では入口へ箱を寄せてくれと頼んだ。\n\n十分ほど働き、出るときに二人分の乾いた果物をもらった。\n\nラーナは、それを一つ律へ渡した。\n\n「あなたが来たから、寄り道が増えた」\n\n「僕のせい？」\n\n「今日のところは」\n\n彼女は食べながら歩き出した。\n\n### 四　切り替えた人\n\nメフルダードは、作業所の机を二つ空けていた。\n\n律の記録が、ラーナの記録の横へ並ぶ。\n\nあの箱の表示について、初めから説明し直す必要はなかった。\n\n「外部の系統切替を、こちらの表示が受け取っていた」\n\n設備担当者が、接続図を指した。\n\n「この記録の指示元は、作業所ではありません。地上の工区側です」\n\nラーナは、その先を指でたどった。\n\n「じゃあ、外で水の行き先を変えた」\n\n「外の排水と、この地区の戻り水が合流するところです。通常は、町を通さず下へ抜ける」\n\nファリデが口を挟んだ。\n\n「あの日は、畑へ戻ってこなかった」\n\n「だから、ここの戻りも調べています」\n\n担当者は別の記録を出した。\n\n畑側の戻り先も、一時的に替わっていた。\n\n同じ日、ほとんど同じ時間帯だった。\n\n＊\n\nアザドの持ってきた図を広げた。\n\nそこには中継の設備と、その周囲で使う電源、古い保守系統が描かれていた。\n\n「中継を始めるために、水を動かす必要があったんですか」\n\n律が尋ねた。\n\n設備担当者は首を振った。\n\n「映像には要りません。旧設備を使う前の、保守運転です。同じ試験の束に入っていた」\n\nラーナは、アザドを見た。\n\n「一緒に、始めた」\n\n「古い運転手順に、入っていた」\n\n「何が入ってるかは、確かめた？」\n\n彼は図を押さえた。\n\n「戻り先は、空いている区画だと聞いていた」\n\n「どこ？」\n\n指が、図の外で止まった。\n\n別紙になっていた。\n\n＊\n\nメフルダードが、外部側の担当者へ連絡した。\n\n事故の再発を防ぐため、排水先の図と、操作時刻の記録が必要だと伝える。\n\n相手は、工区全体の図はそのまま渡せないと答えた。\n\n律は画面へ、必要な範囲を示した。\n\n「この接続点より先と、戻り先です。人が入る経路まで必要なら、その都度相談します」\n\n担当者は範囲を確認し、図の準備へ移った。\n\n待つ間、ラーナは自分の手を見た。\n\n上の箱を見てもらったときと同じだ。\n\n反対側から見えるものを、今度は紙で教えてもらう。\n\nただ、今回は、相手が何を見ているのかも知りたかった。\n\n### 五　旧貯留区画\n\n外部から届いた図を、机へ映した。\n\n初めは、向きが分からなかった。\n\n町の図にはない、大きな接続点の番号がある。ラーナはそこから水路の線を追った。\n\n曲がり角を一つ。\n\n狭くなるところを越え、四角い区画へ出る。\n\n「これ、うちの台所」\n\n指が止まった。\n\n律は、その四角を見た。\n\n家の形ではなかった。\n\n一帯を囲んだ線の中に、細かい壁がない。\n\n「この横が、隣の家。ここの溝を、母が毎朝掃いてる」\n\nラーナは指を動かした。\n\n父が棚を作った壁も、店の入口も、図にはなかった。\n\n代わりに、一つの用途名が付いていた。\n\n「何て書いてある？」\n\n彼女が聞いた。\n\n律は、翻訳表示を確かめた。\n\n「旧貯留区画」\n\nラーナはもう一度、同じ場所を見た。\n\n「水を、貯めるところ？」\n\n外部の担当者が、画面の向こうから答えた。\n\n「図上では、現在は使われていない区画です。一時的な受入れ先として――」\n\n「使ってる」\n\nラーナが言った。\n\n「朝、母がパンを切ってた」\n\n＊\n\n誰も、すぐには次の説明をしなかった。\n\nファリデが町の図を重ねた。\n\n外部の四角の中へ、細い道が現れる。\n\n家の番号。\n\n井戸。\n\n小さな作業場。\n\n「この図を、誰が渡したの」\n\nラーナは、メフルダードへ尋ねた。\n\n彼は外部の図の表題を見た。\n\n文書番号を書き取り、机の端の電話を取った。\n\nラーナは待たずに言った。\n\n「ここが家だって知ってたんでしょう」\n\n受話器を持つ手が止まる。\n\n「知っている」\n\n「外で水を動かすことも？」\n\n「作業があることは、聞いていた」\n\nラーナは、身体を起こした。\n\n膝が痛んだ。\n\n「だから、私たちを移したの」\n\nメフルダードは、受話器を置いた。\n\n### 六　署名の下\n\n「危険だと知って、移転させた。そこへ水が来ることも、分かってたんじゃないの」\n\nラーナは机へ両手を置いた。\n\nメフルダードは、閉鎖の指示書を出した。\n\n彼の承認が付いている。\n\n「私が受けた説明は、東の設備へ工事の影響が出る可能性がある、というものだった。原因が分かるまで、人を離すと決めた」\n\n「私の控えは届いてなかった」\n\n「届いていなかった。そのまま決めた」\n\n彼は書類の脇へ、ラーナが持ってきた控えの写しを置いた。\n\n「この地区が貯留先になっている図は、今日、初めて見た」\n\n「知らなかったって言えば、済むの」\n\n「済まない。だが、知っていて水を入れたという説明も、違う」\n\n彼はラーナの手から目をそらさなかった。\n\n「私の判断は、私の名前で残す。まず、この図を渡した経路を調べさせてほしい」\n\n＊\n\n管理側の書庫から、控えが来た。\n\n外部向けの資料と、住民のために更新された図は、別に保管されていた。\n\n管理側の資料係が、古い地形図に接続番号だけを加え、「旧貯留区画」の用途名を残したまま外部へ渡していた。\n\n家の情報は載せない。\n\nその方針は、今回の工事より前からあった。\n\nラーナは、住民用の図の更新日を見た。\n\n去年だった。\n\n去年も、ここには家があった。\n\n「住所を出さないため？」\n\nアザドが、低い声で答えた。\n\n「誰が、どこで暮らしているかを、外へ渡さないためだ」\n\n「家だってことまで、消す必要があった？」\n\n彼は答えなかった。\n\nファリデが外部の担当者へ尋ねた。\n\n「人が住んでるとだけ書いてあったら、そのまま水を回した？」\n\n「いいえ。少なくとも、この受入れ先は選べません」\n\n答えは早かった。\n\n＊\n\nミーシャが通話へ入った。\n\n外部に提供する資料の確認を求められていた。\n\nラーナは彼の顔を初めて正面から見た。\n\n自分の前からリツを消した男。\n\n向こうで、そのリツを襲わせた男。\n\n「この方針を、あなたも知っていたの」\n\n「知っていた」\n\n彼は短く答え、外部向けの図を拡大した。\n\n「この古い用途名を、現役の受入れ先として使ったことまでは把握していなかった」\n\n律の横で、ラーナは紙を押さえた。\n\nミーシャが続ける。\n\n「居住の情報を出さない運用には、私も関わっている。資料の作成者と確認者は出す」\n\n「私の家が何にされてるか、私が見られない方針にも？」\n\n今度は、答えが遅かった。\n\n「それも改める」\n\nラーナは、画面を見たまま言った。\n\n「今、この図を作業所に置いて」\n\n＊\n\n通話の後、律は外部担当者の操作記録へ戻った。\n\n住民がいることを知った時刻に、作業停止が記録されている。\n\n連絡を受けた相手の名前は、ラーナも知っていた。\n\nそれ以前に使った図は、さっきの一枚だった。\n\n「誰かが私たちを沈めるために、この名前へ変えたんじゃない」\n\n彼女は、用途名の脇を指でなぞった。\n\n「違う目的で残したものを、別の人が、水を入れていいという意味で読んだ」\n\n律が言った。\n\nラーナは目を閉じかけ、やめた。\n\n「じゃあ、止めた後も水が上がってるのは、どうして」\n\n机の電話が鳴った。\n\n上段の計器は下がっている。\n\n下の地区では、まだ上がっていた。\n\n### 七　同じ水\n\n外部の担当者が、上流の記録を出した。\n\n作業で出た水は、一度、上の調整槽へ入れていた。そこから先の行き先が、旧貯留区画へ切り替わった。\n\n「ポンプは止めています。ただ、槽の中に残った分は、下へ流れ続ける」\n\n彼は残量と、出口側の値を示した。\n\n設備担当者が、町の図へその線を写す。\n\nラーナは、そこで紙を押さえた。\n\n「この先は、下の家じゃない。まず、東の合流部に入る」\n\nファリデが別の図を寄せた。\n\n「畑の戻りも、ここへ」\n\n二本の線が重なった。\n\n＊\n\n律は、操作を時刻順に並べた。\n\n外部では、下流の工事中も水を受けられるよう、行き先を替えた。\n\n現地では、旧設備の保守運転が、畑の戻りを一時的に迂回させた。\n\n図面の上では、どちらも空いている場所へ向かっている。\n\nだが、空いている場所は二つではなかった。\n\nラーナが、二本の線の先へ自分の家の図を置いた。\n\n同じ場所だった。\n\n「入れる量の計算は？」\n\n律が聞いた。\n\n外部担当者は、旧貯留区画の容量を示した。\n\nその高さのところに、ラーナが昨日まで暮らしていた床がある。\n\n水を受けるはずの空間には、壁と床が増えていた。\n\n「こんなには、入らない」\n\n彼女が言った。\n\n家を描き足した図を見て、外部担当者が計算を止めた。\n\n＊\n\n水は、図の用途名を知らない。\n\n空いているところを満たし、溢れたら、低い道へ進む。\n\n旧区画に入り切らなかった水が、合流部までせり上がった。ラーナが立っていた水路へ出て、階段側の通路を下ってきた。\n\n「あのとき、入口からも来たのは、こっちへ回ったからか」\n\nラーナは、指で角を曲がった。\n\n律は自分の映像へ戻った。\n\n階段から水が来る。\n\n同じころ、箱の針が大きく動く。\n\nそこで初めて、見たものが一つの流れになった。\n\n＊\n\n「原因は、これで分かったということですか」\n\n律が尋ねた。\n\nラーナは、上の槽の残量を見た。\n\n「まだ、流れてる」\n\n隣の設備担当者も、計器を見ていた。\n\n「この量が、全部あそこへ来るのは避けたい。出口を変えるか、入る方を止めるか」\n\n「入る方を止めたら？」\n\n「上の槽を保たせる必要がある。工区側にも湧き水は来続ける」\n\nラーナは図を回した。\n\n南の染場を通る、細い線があった。\n\n「こっちへ出せない？」\n\n担当者が、線の番号を読んだ。\n\n「予備の排水路。ただ、この図では末端が閉じている」\n\n「閉じてない。先月、染場の人に頼まれて、出口の板を替えた。水は流れてた」\n\nファリデが立った。\n\n「今の状態を見てもらおう。地図が間違ってたばかりなんだから」\n\n＊\n\n一度、机を離れた。\n\nラーナは入口の段へ座り、目を押さえた。\n\n律が隣に来る。\n\n何かを聞こうとして、やめた気配がした。\n\n「怒ってるよ」\n\nラーナが先に言った。\n\n「うん」\n\n「でも、誰か一人に怒れば済むと思ってたときより、面倒になった」\n\n律は、二人分の水を床へ置いた。\n\n「一人に全部聞いても、答えがそろわない」\n\n「そろえるのは、私たちの仕事？」\n\n彼はすぐには答えなかった。\n\n「少なくとも、君の家をどうするかは、君も一緒に決めるべきだと思う」\n\nラーナは水を取った。\n\n半分飲み、残りを膝の横へ置く。\n\n「じゃあ、戻ろう。決めるために、もう少し見る」\n\n### 八　先に言う\n\n染場の出口には、人が向かった。\n\nその間に、ラーナは予備の排水路を、町の図へ描き直した。\n\n染場の床より低い。\n\n作業場の裏で一度狭くなり、東から来る細い支線が合わさる。\n\n「ここを開けたら、こっちの水が先に下がると思う」\n\n彼女は、支線の近くの井戸を指した。\n\n飲むための井戸ではない。床の下の水位を確かめるため、普段は蓋をしている。\n\n「家の前の計器じゃなくて？」\n\n律が聞いた。\n\n「そっちは、間に狭いところがある。下がるなら遅い」\n\n「水路の方は」\n\n「それより後。上から来る分が減っただけでも、そっちは下がる。あの井戸も下がれば、ここの水が抜けたと分かる」\n\n律は紙へ順序を書いた。\n\n予備排水路の観測点。\n\n支線の井戸。\n\n家の前の計器。\n\n「これでいい？」\n\nラーナが紙を見た。\n\n「先に、上の槽も。流入が勝手に減ったせいじゃないか、分かるように」\n\n律は一番上へ足した。\n\n＊\n\n設備担当者が、確認する量と時間を決めた。\n\n全部を流す試験ではない。\n\n今、畑側で抑えている戻り水の一部を、予備排水路へ回す。その間、旧区画へ入る分は増やさない。\n\n末端まで人を置き、流れが確認できなければ、元へ戻す。\n\n通路へ人を入れずに観測できる場所も確かめた。\n\n「私、井戸へ行く」\n\nラーナが工具袋を取った。\n\n律も立った。\n\n「一緒に」\n\n彼女は、彼の足元を見た。\n\n「こっちにいて」\n\n「荷物なら持てる」\n\n「荷物を持てる人はいる。外の記録を読んで、こっちの言い方に合わせられる人が欲しい」\n\nラーナは図を彼へ向けた。\n\n「向こうが言う南口と、私たちの染場の出口。同じだって、全員に伝えて。さっきまで違う場所みたいに呼んでた」\n\n律は座り直した。\n\n「分かった。井戸の名前も、ここへ書いて」\n\n彼女は筆記具を取り、慣れた文字を横へ添えた。\n\n＊\n\n出口から返事が来た。\n\n閉じていなかった。\n\nただし、途中の細い部分に流木と屑が溜まっている。取り除いてから試験する、と担当者が告げた。\n\n図にある能力と、今使える能力は違う。\n\n律は、未確認だった欄に観測の時刻を書いた。\n\nラーナはそれを見届け、工具袋を肩へ掛けた。\n\n### 九　先に下がる場所\n\n井戸の蓋は、昨日、別の人が開けていた。\n\n測定器を下ろすための小さな隙間が残してある。\n\nラーナは同僚と並んでしゃがみ、機器を固定した。\n\n「外から来た人を置いてきたのか」\n\n「必要な仕事があるから」\n\n「ここにも、あるだろ」\n\n「ある。だから私が来た」\n\n同僚が笑い、壁の電話を取った。\n\nラーナは数値と、水面の実際の位置を交互に見た。\n\n今回は、機器だけを信じない。\n\n＊\n\n作業所では、律が連絡の順番を書いていた。\n\n外部の担当者。\n\n予備排水路。\n\nラーナの井戸。\n\n家の前の計器。\n\n呼び名は、二つずつ並べた。\n\n片方の名前で返事が来たら、もう片方も読み上げる。\n\n「開始前の値をください」\n\nファリデが記録を取る。\n\nメフルダードは、変更の指示を出す担当者を確かめた。\n\n誰が操作するか分からないまま、始めることはしなかった。\n\n＊\n\n水を回し始めた。\n\n最初に、予備排水路から声が来た。\n\n流れがある。\n\n予定した側へ向かっている。\n\n律は、ラーナを呼んだ。\n\n『まだ』\n\n返事は短かった。\n\n上の槽からは、流入に大きな変化はないと報告が来る。\n\n律は井戸の欄を見た。\n\n数字を、先に埋めたくなった。\n\n埋めなかった。\n\n＊\n\nラーナは測定器を見た。\n\n一度だけ、下がった。\n\n水面を確かめると、同じ高さに小さな波が戻っていた。\n\nまだ言わなかった。\n\n同僚が彼女を見る。\n\n次の値が来た。\n\nその次も、同じ向きへ動いた。\n\nラーナは井戸の内壁の印を見た。\n\n濡れていた線の下へ、水面が離れていた。\n\n「下がってる」\n\n受話器へ伝えた。\n\n「波だけじゃない。壁の印から離れた」\n\n＊\n\n律は数値を復唱した。\n\nラーナが訂正しないのを待ち、記録した。\n\n家の前の計器は、まだ動いていない。\n\n電話の向こうから、誰かがそのことを告げた。\n\n「順序どおりなら、次です」\n\n律はラーナが書いた矢印を見た。\n\n自分の予想ではない。\n\n彼女が場所を知っているから、言えた順序だった。\n\n＊\n\n数分後、家の前からも報告が来た。\n\n同じ方向へ動いた。\n\nラーナは受話器を耳へ当てたまま、目を閉じた。\n\n「そっちも？」\n\n『うん。こっちも』\n\n律の声がした。\n\n水路の上で、届くかどうかも分からず聞いていた声。\n\n今日は、こちらが先に見たものを伝えている。\n\n「じゃあ、戻る。次の話をしよう」\n\n### 十　水が通るところ\n\n一度、試験を終えた。\n\n予備排水路の途中と出口で、漏れと滞留がないことを確かめる。\n\n使える流量は、古い図に書かれた最大値より少なかった。それでも、上の槽から来る残りと、抑えた畑の戻りを、時間を分けて通せる見通しが立った。\n\n外部の担当者が計算を出した。\n\nファリデが、畑側で待てる時間を伝える。\n\nラーナは家の前へ戻る人の数を確かめた。\n\n「片づけに来てる人も、今は出てもらう」\n\nメフルダードは係へ頼み、誰が出たかを作業所へ集めた。\n\n母の名前もあった。\n\nラーナは、自分で迎えに行った。\n\n＊\n\n母は扉の前で、長い板を持っていた。\n\n父が棚にした板だった。\n\n「それ、後にして」\n\n「水が下がったなら、今のうちに」\n\n「まだ、終わってない」\n\nラーナは板の端を持った。\n\n母が反対側を持ち直す。\n\n二人で道へ出た。\n\n通りの先では、店主が最後の箱を運んでいた。ラーナは戸口の札を掛け替え、係へ声を掛けた。\n\n誰もいないはずの区画ではなく、今、全員が出た区画として伝えた。\n\n＊\n\n本運転を始めるころ、律は自分の声が少しかすれていることに気づいた。\n\nファリデが水を置く。\n\n「飲んでる間、私が呼ぶ」\n\n彼は礼を言い、受話器から離れた。\n\n現場の人たちは、律がいなくても自分の仕事を続けられる。\n\n全部をつなぐ役を引き受けても、全部を自分が決める必要はなかった。\n\n＊\n\n切替直後、井戸の値が少し上がった。\n\n律が記録紙へ手を伸ばした。\n\n設備担当者が、開始前に書いた範囲を指した。\n\n一時的な上振れは、見込んでいた。\n\n「この幅を越えたら戻す。まだ越えていない」\n\n律は時計を見た。\n\n一秒ずつが、さっきより遅かった。\n\nラーナから報告が来た。\n\n『上がり方は止まった。まだ、下がってはいない』\n\n「聞いた。上の槽は、予定どおり」\n\n律が返す。\n\n次の報告は、少し待った。\n\n長かったが、誰も、分かったことにして先へ進まなかった。\n\n＊\n\n水面が下がり始めた。\n\n予備排水路の出口では、流れが続いていた。\n\n上の槽の残量が減る。\n\n家の前の計器も、遅れて動く。\n\n律は、報告が来るたびに印を付けた。\n\n終わりの条件は、一つの数字ではなかった。\n\nいくつもの場所で、互いに矛盾しない状態が続くことだった。\n\n＊\n\n最後の確認が済んだとき、ファリデが椅子へ座った。\n\n「畑の方も、この順で戻せる」\n\n設備担当者は次の班へ引継ぎを始めた。\n\n誰かが拍手をすることも、機器が祝う音を出すこともなかった。\n\n作業所の扉からラーナが入ってきた。\n\n靴が泥で汚れている。\n\n律が立ち上がると、彼女は工具袋を床へ下ろした。\n\n「今度は、どこが乾いてるか、こっちから教えられるよ」\n\n律は笑った。\n\n息を吐いたら、途中で胸が詰まった。\n\nラーナが、その腕へ手を置いた。\n\n今度は、そこにあった。\n\n### 十一　戻れる家\n\n翌日、家へ入る前に、点検を受けた。\n\nすぐに暮らしを戻してよい、という返事ではなかった。床下を乾かし、傷んだところを直す必要がある。\n\n隣の家は、もっと長くかかる。\n\n店の壁にも、取り替える部分があった。\n\n危険を抑えたことと、失ったものが戻ることは、同じではなかった。\n\n＊\n\nラーナが鍵を開けた。\n\n扉の下が少し擦れた。\n\n母が先に入り、壁へ指を当てた。\n\n水の跡が残っている。\n\n台所の棚は外されていた。板は仮住まいにある。\n\n律は入口で靴の泥を落とした。\n\n「ここが、旧貯留区画」\n\nラーナが言った。\n\n母が振り向く。\n\n「ずいぶん、小さな台所に水を入れたもんだね」\n\n声は軽かった。\n\nだが、彼女は壁から指を離すまで時間を掛けた。\n\n＊\n\n「戻る？」\n\nラーナは聞いた。\n\n母は、窓を開けた。\n\n通りの向こうで、誰かが道具を運んでいる。\n\n「直るまでの部屋は、使う。その後は、直す費用と、ここで暮らせる時期を聞いてから」\n\n「ここが嫌になった？」\n\n母は娘を見た。\n\n「好きだからって、分からないまま戻る必要はないでしょう」\n\nラーナは鍵を握った。\n\n母に追いついていないことが、まだあった。\n\n＊\n\n作業所の壁に、図が二枚並んだ。\n\n古い図には、古いと分かる日付と用途を付ける。\n\n現在の図には、家と通路と、今回確かめた排水先がある。\n\nどちらにも、分からない場所は残っていた。\n\nラーナはそこを勝手に塗りつぶさなかった。\n\n「次に見る人が、空いてると思わないように」\n\n係へそう言った。\n\n外部へ渡す図にも、居住区域を示す範囲が入った。個々の住民の名前までは載せない。\n\nファリデが写しを受け取り、作業所の棚へ置いた。\n\n管理の部屋へ行かなければ見られなかった紙が、そこに残った。\n\n＊\n\nメフルダードは、最初の閉鎖判断からの経緯を、住民に説明した。\n\n途中で質問が出て、予定の時間を越えた。\n\nラーナは、その場で母の隣へ座っていた。\n\n全部に納得したわけではなかった。\n\nただ、質問を持ち帰る人の名前と、答える予定は、その場で書かれた。\n\nアザドも、自分が始めた試験について答えた。\n\nミーシャは、遠隔で資料の秘匿に関わった経緯を説明した。律への襲撃についても、事故とは別に調べられていることを隠さなかった。\n\n話を聞いた人々の反応は、同じではなかった。\n\n長く守られていたと感じる人も、長く知らされなかったと怒る人もいた。\n\nラーナには、全員の返事をそろえるつもりはなかった。\n\n自分も、その一人として話した。\n\n### 十二　帰りの切符\n\n律が帰る朝、ラーナは作業所の客室へ迎えに行った。\n\n机の上に、接続具と充電器が並んでいた。\n\n「忘れ物、ない？」\n\n「今、見てる」\n\n「そう言って、後で送ってって頼む人がいる」\n\n「君の同僚？」\n\n「私」\n\n律が笑い、机の下も確かめた。\n\n＊\n\n出口までは、ラーナが送った。\n\n帰りの道は、来た道と同じだった。\n\nそれでも律は、途中で何度も振り返った。\n\n「迷った？」\n\n「覚えようとしてる」\n\n「次も案内が要るよ。閉じる道もあるから」\n\n彼は、分かったと答えた。\n\n自分の知った道が、ずっと同じまま待っているとは限らない。\n\n＊\n\n最後の扉の前で、ラーナは鞄から紙を出した。\n\n連絡先と、作業所の休み。\n\n母が夕食を作る予定まで、小さく書いてある。\n\n「来るときは、この日なら早く帰れる」\n\n律は紙を受け取り、自分の予定を開いた。\n\n「今度は、君が来るのも」\n\n「知ってる」\n\nラーナは言った。\n\n「どこまで行けるか、調べてる」\n\n彼は画面を閉じた。\n\n「待ってる」\n\n彼女が、彼の手を取った。\n\n初めて会ったときより、指の傷は薄くなっていた。\n\n「今度は、途中で切らないでね」\n\n「自分で、帰るって言う」\n\n律は答えた。\n\n＊\n\n東京へ戻ってからも、連絡は続いた。\n\n作業場の壁を直したこと。\n\n母が元の家へ戻る時期を決めたこと。\n\n律の職場で、入口の模型を最初から作り直したこと。\n\n話す時間が合わない日は、短い声だけを残した。\n\nラーナは、自分の側にも届いた合図を確かめた。\n\n律も同じことをした。\n\n＊\n\n数か月後、空港で待つ律へ、ラーナから連絡が来た。\n\n《出た。どこ？》\n\n同じ場所にいるはずだった。\n\n彼は頭上の番号を送り、彼女から来た番号を見た。\n\n違っていた。\n\n《そのまま待ってて。僕が行く》\n\n返事は、すぐ来た。\n\n《動かない方がいいの？》\n\n《お互いに探すと、すれ違うから》\n\n少し間が空いた。\n\n《じゃあ、待つ》\n\n＊\n\nラーナは案内板の下にいた。\n\n新しい鞄を足元へ置き、行き交う人を見ている。\n\n律が手を上げると、彼女も上げた。\n\n「ちゃんといた」\n\n近づいて、ラーナが言った。\n\n「迎えに来るって、言ったでしょう」\n\n「何時間も前に。こっちにも何時間か、移動があったから」\n\n彼女は笑い、端末を差し出した。\n\n滞在先の場所と、帰りの便が入っていた。\n\n「帰るの、もう決めたんだ」\n\n律は聞いた。\n\n「帰ってからも、仕事がある」\n\nラーナが答える。\n\n「それまでに、見たいところは、これ」\n\n保存した場所が、次々に並んだ。\n\n半分ほどは、律も行ったことがなかった。\n\n＊\n\n自動の扉が開いた。\n\nラーナは立ち止まり、外の明るさへ目を細めた。\n\n律は彼女の隣で待った。\n\n知らない場所へ来た人を、急がせる必要はなかった。\n\nやがて、彼女が手を出した。\n\n律が取る。\n\n「まず、どっち？」\n\n「右」\n\nラーナは左を見た。\n\n「あっちに、電車の絵がある」\n\n律も案内板を見た。\n\n確かにあった。\n\n「……左」\n\n彼女は何も言わず、彼の手を引いた。\n\n途中で、笑った。\n\nその声は、どちらの接続具も通らずに聞こえた。\n\n---\n\n*ラーナルート・了*\n", "progressVersion": "c1ba2af7557bef9d"}</script>

      if (/^\*.+ルート・了\*$/.test(line)) { flush(); boundary = true; add(line.slice(1,-1), 'end'); boundary = true; continue; }
      if (/^\*第.+部・了\*$/.test(line)) { flush(); add(line.slice(1,-1), 'note'); continue; }
      paragraph.push(/^\*.*\*$/.test(line) ? line.slice(1,-1) : line);
    }
    flush();
    return {blocks, chapters, parts};
  }
  function paginate(blocks, target) {
    const limit = Number.isFinite(target) ? Math.max(120, Math.min(1200,target)) : 360;
    const pages = []; let current = [], count = 0;
    function flush() {
      if (!current.length) return;
      pages.push({blocks:current, startId:current[0].id, endId:current[current.length-1].id, chapter:current[0].chapter, part:current[0].part});
      current = []; count = 0;
    }
    for (const block of blocks) {
      if (block.breakBefore || block.kind === 'title' || block.kind === 'end') flush();
      const size = Array.from(block.text).length;
      if (current.length && count + size > limit) flush();
      current.push(block); count += size;
      if (block.kind === 'title' || block.kind === 'end') flush();
    }
    flush(); return pages;
  }
  function pageForAnchor(pages, rawAnchor) {
    const anchor = Number.isFinite(rawAnchor) ? Math.max(0,Math.floor(rawAnchor)) : 0;
    const i = pages.findIndex(page => page.endId >= anchor);
    return i < 0 ? Math.max(0,pages.length-1) : i;
  }
  function validAnchor(value, length) {
    const n = Number(value);
    return value !== null && value !== '' && Number.isInteger(n) && n >= 0 && n < length ? n : null;
  }
  return {parseMarkdown, paginate, pageForAnchor, validAnchor};
});
</script>
<script>(function(){
  'use strict';
  const story = JSON.parse(document.getElementById('story-data').textContent);
  const {parseMarkdown,paginate,pageForAnchor,validAnchor} = ReaderCore;
  const manuscript = parseMarkdown(story.markdown);
  const $ = id => document.getElementById(id);
  const keys={settings:'yakusoku-reader-settings-v1',progress:'yakusoku-reader-'+(story.progressVersion||story.version)};
  let storageAvailable=true;
  function load(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(_){return null;}}
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(_){storageAvailable=false;}}
  const stored=load(keys.settings)||{};
  const mobile=window.matchMedia('(max-width:600px)').matches;
  const allowed=[240,360,480];
  const settings={font:Number.isFinite(stored.font)?Math.max(16,Math.min(28,stored.font)):(mobile?18:21),target:allowed.includes(stored.target)?stored.target:(mobile?240:360),theme:['light','dark'].includes(stored.theme)?stored.theme:(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
  const restored=load(keys.progress)||{};
  const hashAnchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);
  const resumeAnchor=validAnchor(restored.anchor,manuscript.blocks.length);
  let pages=paginate(manuscript.blocks,settings.target);
  let pageIndex=pageForAnchor(pages,hashAnchor===null?(resumeAnchor||0):hashAnchor);
  let maxVisited=validAnchor(restored.maxVisited,manuscript.blocks.length)||0;
  let toastTimer;
  function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent='';},4000);}
  function applySettings(){document.documentElement.dataset.theme=settings.theme;document.documentElement.style.setProperty('--reading-size',settings.font+'px');$('font-value').textContent=settings.font+'px';$('font-minus').disabled=settings.font<=16;$('font-plus').disabled=settings.font>=28;$('page-size').value=String(settings.target);$('theme-toggle').textContent=settings.theme==='dark'?'紙の色にする':'夜の色にする';save(keys.settings,settings);}
  function persist(){const anchor=pages[pageIndex].startId;maxVisited=Math.max(maxVisited,pages[pageIndex].endId);save(keys.progress,{anchor,maxVisited});try{history.replaceState(null,'','#at='+anchor);}catch(_){}if(!storageAvailable)$('toast').textContent='このブラウザーでは読書位置を保存できません。';}
  function render(){
    const page=pages[pageIndex];if(!page)return;
    const chapter=manuscript.chapters[page.chapter];const part=manuscript.parts[page.part];
    $('part-label').textContent=part?part.title:story.title;
    $('chapter-title').textContent=chapter?chapter.title:'';
    $('chapter-title').hidden=!chapter;
    $('chapter-position').textContent=chapter?'第'+(page.chapter+1)+'章 / 全'+manuscript.chapters.length+'章':'';
    const fragment=document.createDocumentFragment();
    page.blocks.forEach(block=>{const p=document.createElement('p');p.textContent=block.text;if(block.kind!=='text')p.className=block.kind;fragment.appendChild(p);});
    $('prose').replaceChildren(fragment);
    $('reading-page').classList.toggle('card',page.blocks[0].kind==='title'||page.blocks[0].kind==='end');
    $('page-count').textContent=(pageIndex+1)+' / '+pages.length;
    $('previous').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;
    $('next').textContent=pageIndex===pages.length-1?'読了':'次のページ →';
    const progress=$('progress');progress.setAttribute('aria-valuenow',String(pageIndex+1));progress.setAttribute('aria-valuemax',String(pages.length));$('progress-fill').style.width=((pageIndex+1)/pages.length*100)+'%';
    document.title=(chapter?chapter.title+' | ':'')+story.title;
    persist();window.scrollTo(0,0);if(!document.querySelector('dialog[open]'))$('reading-page').focus({preventScroll:true});
  }
  function move(delta){const n=Math.max(0,Math.min(pages.length-1,pageIndex+delta));if(n!==pageIndex){pageIndex=n;render();}}
  function showDialog(id){$(id).showModal();}
  function showContents(){
    const body=$('toc-body');body.replaceChildren();
    const note=document.createElement('p');note.className='dialog-note';note.textContent='未読の章は、内容を伏せて番号だけで表示します。';body.appendChild(note);
    manuscript.parts.forEach(part=>{
      const section=document.createElement('section');section.className='toc-group';
      const heading=document.createElement('h3');heading.textContent=part.label;section.appendChild(heading);
      manuscript.chapters.filter(c=>c.part===part.index).forEach(chapter=>{
        const button=document.createElement('button');button.type='button';button.className='toc-link';button.disabled=chapter.startId===null;
        if(chapter.index===pages[pageIndex].chapter)button.setAttribute('aria-current','true');
        const mark=document.createElement('span');mark.className='toc-mark';mark.textContent=chapter.startId<=maxVisited?'✓':'';mark.setAttribute('aria-hidden','true');
        const label=document.createElement('span');label.textContent=chapter.startId<=maxVisited?chapter.title:'第'+chapter.label+'章';
        button.append(mark,label);button.addEventListener('click',()=>{pageIndex=pageForAnchor(pages,chapter.startId);$('contents').close();render();});section.appendChild(button);
      });body.appendChild(section);
    });showDialog('contents');
  }
  $('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
  $('contents-open').addEventListener('click',showContents);$('settings-open').addEventListener('click',()=>showDialog('settings'));
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('close',()=>$('reading-page').focus({preventScroll:true}));dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});});
  $('font-minus').addEventListener('click',()=>{settings.font=Math.max(16,settings.font-1);applySettings();});
  $('font-plus').addEventListener('click',()=>{settings.font=Math.min(28,settings.font+1);applySettings();});
  $('theme-toggle').addEventListener('click',()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings();});
  $('page-size').addEventListener('change',()=>{const anchor=pages[pageIndex].startId;settings.target=Number($('page-size').value);pages=paginate(manuscript.blocks,settings.target);pageIndex=pageForAnchor(pages,anchor);applySettings();render();});
  $('reading-page').addEventListener('click',()=>{if(window.getSelection()?.toString())return;move(1);});
  document.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing||document.querySelector('dialog[open]'))return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable)return;
    if(event.target.closest('button')&&(event.key===' '||event.key==='Enter'))return;
    const direction=(event.key===' '?(event.shiftKey?-1:1):({'ArrowRight':1,'PageDown':1,'ArrowLeft':-1,'PageUp':-1,'Backspace':-1})[event.key]);
    if(direction){event.preventDefault();move(direction);}
  });
  window.addEventListener('hashchange',()=>{const anchor=validAnchor(new URLSearchParams(location.hash.slice(1)).get('at'),manuscript.blocks.length);if(anchor!==null){pageIndex=pageForAnchor(pages,anchor);render();}});
  applySettings();render();
  if(hashAnchor===null&&resumeAnchor>0)toast('前回の続きから再開しました。');
})();
</script>
