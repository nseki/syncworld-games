<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>図版について | The Voynich XCrossings</title><style>body{max-width:42rem;margin:3rem auto;padding:0 1rem;background:#f3e7ce;color:#45382f;font:1rem/1.9 system-ui}a{color:#365c52}</style><h1>図版について</h1><p>植物図は、イェール大学バイネッケ図書館所蔵のヴォイニッチ手稿（Beinecke MS 408、38葉表）を参考に、本作の挿絵として描き起こしました。文字も挿絵のために作ったものです。</p><p><a href="https://collections.library.yale.edu/catalog/2002046?child_oid=1006148">ヴォイニッチ手稿の原資料</a></p><p>騎士団の八尖十字は、<a href="https://www.orderofmalta.int/government/flags-emblems/">マルタ騎士団公式サイトの旗・紋章一覧</a>を参考に描き起こしました。</p><p>作中の印、地図、舟のスケッチ、二人の時間を示す図は、本作のために制作しました。</p><p><a href="../?draft=6">試読ページへ</a></p></html>
